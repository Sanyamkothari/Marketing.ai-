; Alembic, configured to know where the migrations are and nothing about where the database is.
;
; `sqlalchemy.url` is deliberately absent. A DSN in a file that is committed is a credential in a
; file that is committed, even when today's value is a localhost password, because the next person
; to need a staging run edits it and the one after that forgets to. `alembic/env.py` resolves the
; URL instead, in one order: `-x url=...` on the command line, then `sqlalchemy.url` if an operator
; sets one in their own copy, then `engine.settings.Settings` - which is the same description the
; API and the job container are built from, so a migration cannot be run against a different
; database than the one the product uses (DEC-345).
;
; There are no `[loggers]` sections either, and `env.py` does not call `fileConfig`. This product
; formats its logs with a formatter that withholds exception messages (plan section 13.7), and a
; migration failing against a real database is exactly where a driver would otherwise print a row.

[alembic]
script_location = alembic
prepend_sys_path = .
; How the paths above are split. `os` means os.pathsep; Alembic 1.20 deprecates the legacy guess.
path_separator = os

; Filled in by env.py. Left empty here on purpose; see above.
sqlalchemy.url =
