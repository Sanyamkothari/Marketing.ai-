# READY FOR PHASE 3b - STILL NOT INSTALLED.
#
# Since Phase 3b (plan B) the engine has what this use case needed: an `uplift` problem type, a
# treatment column that is never a feature, the AUUC metric and S/T/X meta-learners. This file is
# written for that problem type and validates against the engine's configuration schema (checked on
# 2026-09-23 by resolving it from a copy of library/configs/). It is still deliberately NOT in
# library/configs/use_cases/, for two reasons that have nothing to do with the engine:
#
# 1. The data could not be fetched. On 2026-09-23 go.criteo.net, huggingface.co and
#    ailab.criteo.com were still refused by this environment's egress proxy (403), so there is no
#    sample to run it on and no run report. Installing it would list a use case nobody can try.
# 2. The dataset is CC BY-NC-SA 4.0 - NON-COMMERCIAL. See LICENSE.txt before any use; it must never
#    appear in a commercial demo, a sales deck or a customer pilot.
#
# To install it on a network that can fetch the file: run `python library/criteo-uplift/fetch.py`,
# replace the invented `examples` below with values from data/prepared.csv, copy this file to
# library/configs/use_cases/criteo_uplift.yaml, flip ad_tech.yaml's entry from `planned` to
# `available`, update library/tests/test_criteo_uplift.py (which pins the NOT-installed state), and
# start the run from the uplift screens (#/uplift) or POST /uplift/runs - not from Phase 1's Setup,
# which does not offer uplift (DEC-608).

id: criteo-uplift
name: Incremental Ad Uplift
description: Ranks users by how much showing them an ad changes their chance of converting, rather than by how likely they are to convert anyway.
lifecycle_stage: Awareness
ai_type: hybrid                            # a propensity model plus a treatment-effect estimator
entity: impression                         # the engine's copy would say "one row per impression"

problem_type: uplift                       # Phase 3b: model P(convert | ad) - P(convert | no ad) per user

target:
  column: conversion                       # the OUTCOME; `visit` is the other label (see mapping.yaml)
  positive_label: 1
  definition: The user converted after the randomised ad-eligibility decision
  label_source: Criteo Uplift Prediction Dataset v2.1, column conversion

primary_key_hints: [impression_id, user_id, id]

validation:
  min_positive: 2000                       # 0.29% of a 1M-row sample is ~2,900; 200 would be far too few
                                           # to estimate a treatment effect, as opposed to fitting a model

model_search:
  metric: auuc                             # the only metric of the uplift problem type
  metric_choices: [auuc]

prepare:
  exclude_columns: [exposure, visit]       # `exposure` is an outcome, not a feature (see mapping.yaml);
                                           # `visit` is the other label, and is not a feature either

uplift:
  treatment_column: treatment              # 1 = randomly made eligible for the ad, 0 = held out (mapping.yaml)
  learner: x_learner                       # Kunzel et al. 2019: suits one arm much smaller than the other (85/15 here)
  base_model: lightgbm                     # fast and deterministic on 1M rows of dense floats
  # No treatment_date_column and no outcome_window_days: the file carries no timestamps, so
  # OUTCOME_WINDOW_IMMATURE and FEATURE_AFTER_TREATMENT cannot run on it and are skipped.
  # min_arm_rows / min_arm_positives stay at the engine defaults (1,000 rows, 50 conversions per
  # arm). By Criteo's published rates a 1M-row sample has ~150,000 control rows and ~285 control
  # conversions, but that is arithmetic on published figures, not a count this library made.

actions:
  score_field: uplift
  suppression:
    opt_out_column: null
    recently_contacted_column: null
  control_group_fraction: 0.15             # the dataset's own control share, so the holdout matches the experiment

output:
  kpi:
    label: "Users scored"                  # an uplift scoring run replaces this with "Persuadables recommended to contact"
    formula: "count_rows()"

ui:
  pages:
    data: "Impression + treatment assignment"
    model: "Uplift Model"
    output: "Persuadable Audience / Bids"

template:
  columns:
    - {name: impression_id, role: primary_key, type: integer, description: "Row number in the published order. Identifies the impression; never used as a feature.", examples: ["1","2","3","4","5"]}
    - {name: f0,            role: feature,     type: float,   description: "Anonymised dense feature. Criteo publishes no meaning for f0 to f11.", examples: ["12.616365","12.616365","12.616365","12.616365","12.616365"]}
    - {name: f1,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["10.059654","10.059654","10.059654","10.059654","10.059654"]}
    - {name: f2,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["8.976429","8.976429","8.976429","8.976429","8.976429"]}
    - {name: f3,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["4.679882","4.679882","4.679882","4.679882","4.679882"]}
    - {name: f4,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["10.280525","10.280525","10.280525","10.280525","10.280525"]}
    - {name: f5,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["4.115453","4.115453","4.115453","4.115453","4.115453"]}
    - {name: f6,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["0.294443","0.294443","0.294443","0.294443","0.294443"]}
    - {name: f7,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["4.833815","4.833815","4.833815","4.833815","4.833815"]}
    - {name: f8,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["3.955396","3.955396","3.955396","3.955396","3.955396"]}
    - {name: f9,            role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["13.190056","13.190056","13.190056","13.190056","13.190056"]}
    - {name: f10,           role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["5.300375","5.300375","5.300375","5.300375","5.300375"]}
    - {name: f11,           role: feature,     type: float,   description: "Anonymised dense feature",                                            examples: ["-0.168679","-0.168679","-0.168679","-0.168679","-0.168679"]}
    - {name: treatment,     role: feature,     type: integer, description: "1 when the user was randomly made eligible to be shown the ad, else 0. THE LEVER: uplift.treatment_column names it, so the uplift engine never uses it as a feature. The template has no treatment role, so it is listed with role feature here.", examples: ["1","1","0","1","0"]}
    - {name: exposure,      role: feature,     type: integer, description: "1 when the ad was actually rendered. An OUTCOME, not a treatment: excluded in prepare.exclude_columns.", examples: ["0","1","0","0","0"]}
    - {name: visit,         role: feature,     type: integer, description: "1 when the user visited the advertiser's site. The other label: excluded in prepare.exclude_columns.", examples: ["0","1","0","0","0"]}
    - {name: conversion,    role: target,      type: integer, description: "Outcome: 1 when the user converted, else 0. Leave blank when scoring.", examples: ["0","0","0","0","0"]}

# The `examples` values above are INVENTED PLACEHOLDERS in the right shape - twelve dense floats
# and four binary flags. The file was never fetched in this environment, so no real value from it
# appears anywhere in this library. Regenerate them from a real download before this file is
# installed: `python library/criteo-uplift/fetch.py` then read the head of data/prepared.csv.
