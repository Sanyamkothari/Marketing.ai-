# MineThatData E-Mail Analytics (Hillstrom) -> use case `hillstrom-email`
#
# The shape Phase 2's column-mapping UI will import. One column is derived (the file ships no key);
# nothing is renamed, recoded or dropped by fetch.py. The journey harness (`python -m library.run_engine
# journey --dataset hillstrom-email`, library/journey.py) splits the prepared file into training and evaluation rows and adds two
# derived columns of its own to the files it uploads; both are listed under `journey_derived` with
# the assumption behind each.
schema_version: 1
dataset: hillstrom-email
use_case: hillstrom-email
config_root: configs                       # the repo's own config root (DEC-085)

source:
  file: data/hillstrom.csv
  format: csv
  delimiter: ","
  encoding: utf-8
  rows: 64000
  sha256: 00a6a868e05a9ffe7382da51629f6d6dce88c5acfc945e79d314ebc78fd3a2c0
  one_row_per: customer                    # one row per customer who last bought within 12 months

prepared:
  file: data/prepared.csv
  built_by: fetch.py
  changes:
    - "customer_id added: the 1-based row number in the published order; the file ships no key"

roles:
  primary_key: customer_id
  treatment: segment                       # randomised: Mens E-Mail / Womens E-Mail / No E-Mail, a third each
  target: conversion
  positive_label: 1
  time: null                               # the file carries no date at all

columns:
    - {source: customer_id,     standard: customer_id,     role: primary_key,
       derived: "1-based row number in the published order; the file ships no key of its own"}
    - {source: recency,         standard: recency,         role: feature, note: "months since the last purchase"}
    - {source: history_segment, standard: history_segment, role: feature, note: "band of `history`, e.g. '2) $100 - $200'"}
    - {source: history,         standard: history,         role: feature,
       note: "dollars spent in the past year, before the e-mail. Also the pre-campaign amount CUPED adjusts spend by, and the basis of each customer's value (see journey_derived)."}
    - {source: mens,            standard: mens,            role: feature, note: "1 = bought men's merchandise in the past year"}
    - {source: womens,          standard: womens,          role: feature, note: "1 = bought women's merchandise in the past year"}
    - {source: zip_code,        standard: zip_code,        role: feature, note: "Urban, Surburban (sic) or Rural; an area type, not a postcode"}
    - {source: newbie,          standard: newbie,          role: feature, note: "1 = a new customer in the past twelve months"}
    - {source: channel,         standard: channel,         role: feature, note: "Phone, Web or Multichannel: how the customer bought in the past year"}
    - {source: segment,         standard: segment,         role: treatment,
       note: "THE LEVER, assigned at random. uplift.treatment_column names it and uplift.treatment_levels lists it control first, so it is never a feature."}
    - {source: visit,           standard: visit,           role: excluded,
       note: "an outcome (visited the website in the two weeks after the e-mail): excluded from the features"}
    - {source: conversion,      standard: conversion,      role: target,
       note: "an outcome: bought in the two weeks after the e-mail. The use case's target."}
    - {source: spend,           standard: spend,           role: excluded,
       note: "an outcome (dollars spent in the two weeks after the e-mail): excluded from the features; measured as an amount with CUPED"}

journey_derived:
    - name: value_inr
      formula: "history x scale x fx_inr_per_usd, scale = mean spend / mean history of the training rows' converters (journey.value_scale)"
      used_as: "uplift.policy.value_column: what one conversion of this customer is worth, before margin"
      assumption: >-
        A customer's worth per conversion is taken to be proportional to their past year's spend (`history`),
        scaled to the size of one order: the scale is the mean two-week spend of the training rows' converters
        over their mean `history` (0.3877 on the full file), measured on training rows only. The engine's money
        is rupees and the file's is 2008 US dollars, so each dollar is converted at the journey's
        fx_inr_per_usd (an input assumption, recorded in journey.results.json and run_report.md, not a market
        quote). Excluded from the features: it is `history` rescaled.
    - name: history_date
      formula: "the day before the campaign record's treatment start"
      used_as: "covariate_date_column for the CUPED covariate `history`"
      assumption: >-
        The file has no dates. `history` is by the dataset's own definition the spend of the twelve months
        before the e-mail, so it is dated, by assumption, the day before the campaign. The engine's
        point-in-time rule (COVARIATE_NOT_BEFORE_CAMPAIGN) therefore passes by construction: it is not a check
        on this file.

dropped: []                                # nothing is dropped
pii: []                                    # no names, e-mails, phone numbers, addresses or government ids
