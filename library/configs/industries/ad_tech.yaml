schema_version: 1
id: ad_tech
name: Ad-tech
journey_label: Audience Lifecycle

# Ad-tech is configured but has nothing available yet. The Criteo Uplift dataset is mapped in
# library/criteo-uplift/, and its use-case file is kept there rather than installed here. The
# question that dataset exists to answer - the incremental effect of showing an ad - is uplift
# modelling; since Phase 3b that file is written for `problem_type: uplift` and the engine can run
# it. It stays `planned` because the data could not be fetched in this environment (re-tested
# 2026-09-23: refused with 403), so there is nothing to run it on.

stages:
  - id: awareness
    name: Awareness
    ai_type: predictive
    use_cases:
      - id: criteo-uplift
        status: planned
        name: Incremental Ad Uplift
        description: Ranks users by how much showing them an ad changes their chance of converting, rather than by how likely they are to convert anyway.
