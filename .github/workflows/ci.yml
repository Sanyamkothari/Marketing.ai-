# The checks a change has to pass. Everything here runs without an AWS account: the S3 backend is
# exercised through moto, SageMaker through an in-process fake, Postgres through a service
# container, and the infrastructure through `cdk synth` and in-process CloudFormation assertions.
#
# Nothing in this workflow deploys anything. `deploy-dev.yml` does that, by hand.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + fast suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # The metadata tests skip with a reason when there is no server. In CI there is one, so they
      # run for real - MARKETING_AI_REQUIRE_POSTGRES turns a skip here into a failure, because a
      # test that silently stopped running is worse than one that fails.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketing -d marketing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-freeze.txt

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Fast suite
        env:
          MARKETING_AI_REQUIRE_POSTGRES: "1"
          MARKETING_AI_TEST_DATABASE_URL: postgresql+psycopg://marketing:marketing@localhost:55432/marketing
        run: .venv/bin/python -m pytest -m "not slow"

  infra:
    name: cdk synth + snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: make infra-setup
      - name: Lint
        run: make infra-lint
      - name: Offline assertions and snapshots
        run: make infra-test
      # Synthesising for real is a separate step from the in-process assertions because it needs
      # node and the CDK CLI, and because it catches a different class of mistake: the assertions
      # prove the template says what it should, `cdk synth` proves the app runs at all.
      - name: Synthesise
        run: make infra-synth
      - name: cdk-nag
        run: make infra-nag

  image:
    name: image builds and passes its own suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # This is the step that catches a missing system library - `libgomp1`, say - before a
      # deployment does. Running the suite on the runner cannot catch it, because the runner has
      # a full distribution and the image does not.
      - name: Build and run the fast suite inside the image
        run: make image-test
      - name: Build the shipping image
        run: make image
      - name: Measure it against the budget
        run: |
          python -m venv .venv
          .venv/bin/python -m scripts.check_image_size --ref marketing-ai:local
