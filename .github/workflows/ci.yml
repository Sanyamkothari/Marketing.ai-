# Satisfies plan §10: "CI: `make lint test` must pass; integration tests may be marked slow."
#
# This workflow is the gate, not a second build system: it installs the project the same way a
# developer does (`make setup`) and then runs the same two targets plan §13.2 asks for after every
# milestone. Nothing here re-implements a lint or a test invocation, because a check that CI spells
# out differently from the Makefile is a check that can pass locally and fail here for reasons that
# have nothing to do with the change. `make lint` already chains check-generated (templates/ and
# docs/API.md drift), ruff, black --check and mypy --strict, so drift in a generated file fails the
# pull request rather than being discovered later by a reader of a stale file.
#
# The @slow AutoGluon integration tests are deliberately NOT run here — that is the second half of
# plan §10's sentence. `make test` is `pytest -m "not slow"`; the full suite runs in nightly.yml, so
# a pull request waits minutes rather than a quarter of an hour.

name: CI

on:
  push:
  pull_request:

# A push to a pull request branch triggers both `push` and `pull_request`; superseding the older run
# of the same ref keeps that from doubling the queue on a busy branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read                        # the gate only reads the tree; nothing here writes to the repo

jobs:
  lint-test:
    name: lint + fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 30                 # the fast suite is minutes; this only catches a hang or a wedged install

    # Phase 4a: the metadata tests skip with a reason when there is no server. Here there is one, so
    # MARKETING_AI_REQUIRE_POSTGRES turns that skip into a failure - a test that silently stopped
    # running is worse than one that fails (DEC-344).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketing -d marketing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # M56: the same rule for the JS halves of the suite. They skip with a reason where node or jsdom
    # is missing; here both are installed below, so REQUIRE_JSDOM turns that skip into a failure
    # (tests/fixtures/node.py, DEC-877).
    env:
      MARKETING_AI_REQUIRE_POSTGRES: "1"
      MARKETING_AI_TEST_DATABASE_URL: postgresql+psycopg://marketing:marketing@localhost:55432/marketing
      REQUIRE_JSDOM: "1"

    steps:
      - uses: actions/checkout@v5

      # No matrix. pyproject pins `requires-python = ">=3.11,<3.12"` and mypy/ruff/black all target
      # py311, so a second interpreter would test a configuration the project refuses to install on.
      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip                    # wheel cache: the miss path below still has to install AutoGluon
          cache-dependency-path: |
            pyproject.toml
            requirements-freeze.txt

      # Two layers, because AutoGluon (plus catboost, lightgbm, xgboost, torch-free but still large)
      # dominates the job's wall clock. A hit here skips resolution and installation entirely; a miss
      # falls back on setup-python's pip cache above, so the worst case is unpacking wheels rather
      # than downloading them again.
      #
      # The key carries the resolved patch version because a venv holds absolute paths into the
      # interpreter that created it: a restored .venv built against 3.11.x is broken once the runner
      # image ships 3.11.(x+1). There are deliberately no `restore-keys` — a partially matching venv
      # would keep packages that the new pyproject no longer asks for, which is how a dropped
      # dependency stays invisible until someone installs from scratch.
      - name: Cache the venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-freeze.txt') }}

      # `make setup` is idempotent: with .venv restored it skips creation and re-runs the editable
      # install, which also re-links engine/api/scripts after the checkout. Its final import check
      # fails loudly if AutoGluon did not land, so a half-restored cache is a setup failure here and
      # not a confusing collection error three steps later.
      - name: make setup
        run: make setup

      - name: make lint
        run: make lint

      # M56 (DEC-877). Node drives every jsdom suite: the two pytest wraps (Phase 4b's screens), the
      # node-only checks (the uplift module, the settings form, the journey links) and the
      # prototype's own suite. `cache: npm` keeps npm's download cache keyed on every lockfile under
      # tests/, so `npm ci` below installs from disk on a hit; node_modules itself is not cached,
      # because `npm ci` deletes it first by design.
      - name: Set up node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/**/package-lock.json

      # Every directory under tests/ with a lockfile holds jsdom suites. Found rather than listed, so
      # a new suite cannot be added without being installed here; `npm ci` fails if a lockfile is
      # missing or out of step with its package.json, which `npm install` would quietly rewrite.
      - name: npm ci in every jsdom suite
        run: |
          locks=$(find tests -name package-lock.json -not -path '*/node_modules/*' | sort)
          test -n "$locks" || { echo "no package-lock.json under tests/"; exit 1; }
          for lock in $locks; do
            dir=$(dirname "$lock")
            echo "npm ci in $dir"
            (cd "$dir" && npm ci --no-audit --no-fund) || exit 1
          done

      # PYTEST_ADDOPTS rather than a changed `test` target (protocol §4 keeps setup/test/test-all/lint
      # fixed): pytest appends it to pyproject's addopts, so the fast suite runs exactly as before and
      # also leaves a JUnit report for the next step to read.
      - name: make test
        run: make test
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/junit-fast.xml

      # Plan A M39: a milestone the README calls "pending" whose mapped tests just passed fails the
      # build (scripts/check_readme.py says which, and at which line). It reads the report the step
      # above wrote rather than running anything again, so it costs a parse, not minutes.
      - name: make check-readme
        run: make check-readme JUNIT=${{ runner.temp }}/junit-fast.xml

      # M56 (DEC-878): the same report, read for skips. REQUIRE_JSDOM and MARKETING_AI_REQUIRE_POSTGRES
      # turn the skips their fixtures know about into failures; this also catches a skip added
      # later by some other route, and a suite that stopped being selected at all (each pattern
      # must match at least one test that ran).
      - name: The jsdom and Postgres tests ran, and none was skipped
        run: >-
          .venv/bin/python -m scripts.check_no_skips --junit ${{ runner.temp }}/junit-fast.xml
          --id 'test_production_ui_js::test_the_production_ui_modules_in_jsdom$'
          --id 'test_production_ops_ui_js::test_the_privacy_and_monitoring_screens_in_jsdom$'
          --id '^tests\.integration\.test_inactive_settings_ui::'
          --id '^tests\.integration\.test_ui_journey::'
          --id '^tests\.unit\.uplift\.test_uplift_ui::test_(every_module_file_parses|node_suite_passes)'
          --id '\[postgres\]$'
          --id '^tests\.unit\.test_postgres_metadata::'
          --id 'test_alembic_migrations::test_the_migrations_match_the_models_on_postgres$'
          --id 'test_platform_migration::test_the_postgres_audit_table_refuses_update_delete_and_truncate$'

      # The prototype's own jsdom suite (tests/prototype) is node --test only, with no pytest wrap,
      # so it is its own step. Its harness waits for the page to settle (no file read in flight, no
      # page timer left to fire) instead of sleeping a fixed time, which is what made uplift tests
      # fail on a busy machine - as a shared runner is (DEC-875, DEC-876).
      - name: make prototype-test
        run: make prototype-test

  # --- Phase 4a -------------------------------------------------------------
  # Two jobs the main gate cannot do. `infra` needs node and a second virtualenv; `image` needs a
  # Docker daemon. Both are still credential-free: nothing here deploys anything, and
  # `deploy-dev.yml` is the only workflow that touches an account.
  infra:
    name: cdk synth + snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Everything this job runs comes from `.venv-infra`, including ruff and black: `make infra-lint`
      # used to borrow them from the main `.venv`, which this job never built, and died with exit 127
      # before `infra-test` could run (reviewer finding G-1). Building the main venv here as well
      # would fix that by installing all of AutoGluon, uncached, inside a 20-minute timeout, for two
      # linters. `infra/requirements.txt` pins them instead, at the same versions as pyproject's
      # `dev` extra, and `tests/unit/test_container_files.py` fails if the two ever differ.
      - name: make infra-setup
        run: make infra-setup

      - name: make infra-lint
        run: make infra-lint

      - name: make infra-test
        run: make infra-test

      # Synthesising for real is a separate step from the in-process assertions because it catches a
      # different class of mistake: the assertions prove the template says what it should, `cdk synth`
      # proves the app runs at all.
      - name: make infra-synth
        run: make infra-synth

      - name: make infra-nag
        run: make infra-nag

  image:
    name: the image builds and passes its own suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # This is the step that catches a missing system library - libgomp1, say - before a deployment
      # does. Running the suite on the runner cannot catch it: the runner has a full distribution and
      # the image does not.
      - name: make image-test
        run: make image-test

      - name: make image
        run: make image

      - name: Measure the image against its budget
        run: |
          python -m venv .venv
          .venv/bin/python -m scripts.check_image_size --ref marketing-ai:local
