# v2 (plan-v2.md): a light, fast gate for the autonomy package.
#
# The main CI (ci.yml) still runs everything on every push, including tests/v2 and mypy over
# autonomy/, but it installs AutoGluon and runs ~14k tests, so it takes 15-30 minutes. This job
# installs only what the v2 core needs and answers in a couple of minutes, so the parallel v2
# streams get quick feedback. Tests that import heavy v1 modules carry the `v1bridge` marker and are
# left to ci.yml.

name: v2

on:
  workflow_dispatch:
  push:
    branches: ["version-2", "v2/**"]
    paths: ["autonomy/**", "tests/v2/**", "api/v2/**", "ui/v2/**", "pyproject.toml", ".github/workflows/v2.yml"]
  pull_request:
    branches: ["version-2"]

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v2:
    name: v2 lint + types + fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketing -d marketing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MARKETING_AI_TEST_DATABASE_URL: postgresql+psycopg://marketing:marketing@localhost:55432/marketing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/v2.yml
      # The light set, at the versions pyproject / requirements-freeze pin.
      - name: Install the v2 core
        run: >-
          pip install
          "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54" "psycopg[binary]==3.3.6"
          "fastapi==0.141.1" "httpx==0.28.1" "jinja2==3.1.6" "pyyaml==6.0.3"
          "pytest==9.1.1" "ruff==0.16.8" "black==26.5.1" "mypy==2.3.1" "pandas-stubs==3.0.5.260914"
      - name: ruff
        run: ruff check autonomy tests/v2
      - name: black
        run: black --check autonomy tests/v2
      - name: mypy (strict, autonomy only)
        run: mypy --strict --python-version 3.11 --ignore-missing-imports --follow-imports=silent autonomy
      - name: fast tests
        run: python -m pytest tests/v2 -q -m "not v1bridge and not slow"

  # The Gym at a size this machine cannot afford locally. Report-only for now: the agent does not
  # pass the bar yet (docs/v2/GYM_RESULTS.md), so a red Gym must not block other work. Each
  # scenario's scoreboard is uploaded as an artefact.
  gym:
    name: gym ${{ matrix.scenario }}
    if: github.ref == 'refs/heads/version-2' || github.event_name == 'workflow_dispatch'
    needs: v2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline_shop, sleeping_dogs_15, sleeping_dogs_hidden, discount_cannibalisation, whatsapp_fatigue, send_time_matters, drift_midway, small_business, null_effect, complaint_storm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/v2.yml
      - name: Install the v2 core
        run: pip install "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54"
      - name: Gym scoreboard
        run: |
          mkdir -p gym-report
          python -m autonomy.gym.run --scenario ${{ matrix.scenario }} --policy agent --seeds 3 --customers 3000 --report-json gym-report/${{ matrix.scenario }}.json | tee gym-report/${{ matrix.scenario }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gym-${{ matrix.scenario }}
          path: gym-report/
