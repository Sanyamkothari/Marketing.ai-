# The real-data scoreboard (docs/v2/REAL_BENCH.md): Autonomy's agent against simple policies on four
# real randomised campaigns (Hillstrom, X5 RetailHero, Criteo, MegaFon), scored off-policy on a
# held-out half split by customer.
#
# Its own workflow, like the Gym's: it runs on a push to version-2 whose commit message contains
# "[real]", or by hand (workflow_dispatch). Report-only: the targets are read from the uploaded
# JSON, not enforced; the job turns red only when the bench itself crashes or a dataset errors.
# Each dataset runs twice, on a policy axis: `agent` (the scoreboard of record) and `agent_v3` (the same agent
# built with the plan-v3 preset, docs/v3/PRESET.md), so v3 is scored as a whole against v2 on the same split.
# docs/v4/METHOD.md adds three more on the same split: `uplift_threshold` (a cross-fitted uplift model with a cost
# threshold, gated against the best simple rule), and the agent ablations `agent_greedy` (no exploration) and
# `agent_uplift_only` (the click model detached).
# The datasets (about 1.27 GB) are downloaded from public mirrors with fixed SHA-256 checksums
# (scripts/v2_realbench/fetch.py) and cached between runs; nothing is written into the repository.

name: realbench

on:
  push:
    branches: ["version-2", "claude/**"]
  workflow_dispatch:

concurrency:
  group: realbench-${{ github.ref }}-${{ github.sha }}   # one group per commit: a later push never cancels a long bench run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scoreboard:
    name: scoreboard ${{ matrix.dataset }} ${{ matrix.policy }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real]')
    runs-on: ubuntu-latest
    # Locally (4 CPUs) the slowest dataset takes about 8 minutes plus its download with the agent; agent_v3 is
    # not timed yet (its who book holds every customer's pre-campaign events), hence the longer limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dataset: [hillstrom, x5, criteo, megafon]
        policy: [agent, agent_v3, uplift_threshold, agent_greedy, agent_uplift_only]
    env:
      DATA_DIR: ${{ github.workspace }}/.realbench-data   # inside the workspace: actions/cache rejects ".." paths
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/realbench.yml
      - name: Install the light deps
        run: pip install "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54" "pyyaml==6.0.3"
      # Only the raw downloads are cached (keyed on the checksums in fetch.py); the bench's own
      # derived caches (<data-dir>/_cache) are rebuilt every run so they always match the code.
      - name: Cache the dataset
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_DIR }}/hillstrom
            ${{ env.DATA_DIR }}/x5_retailhero
            ${{ env.DATA_DIR }}/criteo_uplift
            ${{ env.DATA_DIR }}/megafon
          key: realbench-data-${{ matrix.dataset }}-${{ hashFiles('scripts/v2_realbench/fetch.py') }}
      - name: Download (checksummed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m scripts.v2_realbench.fetch --data-dir "$DATA_DIR" --dataset ${{ matrix.dataset }} && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Scoreboard
        shell: bash   # bash -eo pipefail: a crash under tee must turn the job red
        run: |
          mkdir -p realbench-report
          python -m scripts.v2_realbench.run --dataset ${{ matrix.dataset }} --policy ${{ matrix.policy }} \
            --data-dir "$DATA_DIR" \
            --json realbench-report/${{ matrix.dataset }}-${{ matrix.policy }}.json --quiet \
            --note "CI ${{ github.sha }}" | tee realbench-report/${{ matrix.dataset }}-${{ matrix.policy }}.md
      - name: Fail on a dataset error (out of memory and the like)
        shell: bash
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open("realbench-report/${{ matrix.dataset }}-${{ matrix.policy }}.json"))
          bad = {k: v["error"] for k, v in report["datasets"].items() if "error" in v}
          if bad:
              sys.exit(f"dataset error: {bad}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realbench-${{ matrix.dataset }}-${{ matrix.policy }}
          path: realbench-report/
          if-no-files-found: ignore

  summary:
    name: scoreboard summary
    needs: scoreboard
    if: always() && needs.scoreboard.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the light deps
        run: pip install "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54" "pyyaml==6.0.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: realbench-*
          path: parts
          merge-multiple: true
      - name: One report per policy for all four datasets
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          # parts/<dataset>-<policy>.json; realbench.json stays the agent's (the scoreboard of record)
          for policy, out in (
              ("agent", "realbench.json"),
              ("agent_v3", "realbench-agent_v3.json"),
              ("uplift_threshold", "realbench-uplift_threshold.json"),
              ("agent_greedy", "realbench-agent_greedy.json"),
              ("agent_uplift_only", "realbench-agent_uplift_only.json"),
          ):
              merged = None
              for p in sorted(pathlib.Path("parts").glob(f"*-{policy}.json")):
                  r = json.loads(p.read_text())
                  if merged is None:
                      merged = {**r, "datasets": {}}
                  merged["datasets"].update(r["datasets"])
              if merged is None:
                  print(f"no dataset report was produced for {policy}")
                  continue
              merged["command"] = (
                  f"CI matrix: python -m scripts.v2_realbench.run --dataset <each> --policy {policy} --quiet"
              )
              pathlib.Path(out).write_text(json.dumps(merged, indent=1))
          if not pathlib.Path("realbench.json").exists():
              raise SystemExit("no agent report was produced")
          PY
          python -m scripts.v2_realbench.run --render realbench.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f realbench-agent_v3.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## agent_v3 (the plan-v3 preset, docs/v3/PRESET.md)" >> "$GITHUB_STEP_SUMMARY"
            python -m scripts.v2_realbench.run --render realbench-agent_v3.json | tee -a "$GITHUB_STEP_SUMMARY"
            python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          a, b = (json.load(open(f)) for f in ("realbench.json", "realbench-agent_v3.json"))
          print("\n## agent_v3 against agent, doubly-robust profit per customer on the same TEST half\n")
          print("Each policy's DR point with its 95% interval, from two separate runs. The last column is the")
          print("difference of the two points only, with no interval of its own: read it against the intervals.\n")
          print("| Dataset | agent (95% CI) | agent_v3 (95% CI) | v3 minus agent, points only |")
          print("|---|---:|---:|---:|")
          for name, x in a["datasets"].items():
              y = b["datasets"].get(name)
              if y is None or "error" in x or "error" in y:
                  print(f"| {name} | n/a | n/a | n/a |")
                  continue
              u, v = x["agent"]["value"]["dr"], y["agent"]["value"]["dr"]
              cell = lambda e: f"{e['point']:.4f} ({e['low']:.4f} to {e['high']:.4f})"
              print(f"| {name} | {cell(u)} | {cell(v)} | {v['point'] - u['point']:+.4f} |")
          PY
          fi
          for policy in uplift_threshold agent_greedy agent_uplift_only; do   # docs/v4/METHOD.md
            if [ -f "realbench-$policy.json" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## $policy (docs/v4/METHOD.md)" >> "$GITHUB_STEP_SUMMARY"
              python -m scripts.v2_realbench.run --render "realbench-$policy.json" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: realbench-report
          path: realbench*.json
