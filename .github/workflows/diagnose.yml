# Which mechanism causes the v3 collapse and the plain agent's ceiling? (docs/v3/DIAGNOSE.md)
#
# Ablation variants of the agent (autonomy/runtime/ablation.py), each run in the Gym and on the real bench, with
# a compact "DIAG " block per run (decisions, act against nothing, every blocked_by and reason code, which v3
# part held customers, expected against realised value). CI logs are the only readable output, so the block
# is printed to the log; the reports are uploaded as artefacts as well.
#
# Its own workflow, like the Gym's and the bench's, so a later push never cancels a long run. It runs on a push to
# claude/** whose head commit message contains "[diagnose]", or by hand (workflow_dispatch). Report-only: a red job
# means the run crashed, not that a variant lost. The policy list must match autonomy/runtime/ablation.py (a test
# checks it), except the who_probe family, which runs in realbench.yml instead (docs/v4/BASELINES.md); the bench's
# data cache is the one realbench.yml fills (same key, same folder).

name: diagnose

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: diagnose-${{ github.ref }}-${{ github.sha }}   # one group per commit: a later push never cancels a long run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gym:
    name: gym ${{ matrix.scenario }} ${{ matrix.policy }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline_shop, whatsapp_fatigue, discount_cannibalisation, sleeping_dogs_15]
        # agent and agent_v3 are the two things every variant is read against; then the v3 leave-one-out,
        # the new parts alone (agent_lookalike, agent_who and agent_frequency were already in the Gym), and one
        # v2 guard relaxed at a time (agent_no_guards: all four together)
        policy: [agent, agent_v3, v3_no_lookalike, v3_no_who, v3_no_frequency, v3_no_moments, v3_no_journeys, v3_no_offers, agent_lookalike, agent_who, agent_frequency, agent_moments, agent_journeys, agent_offers, agent_no_restraint, agent_no_weekly_budget, agent_no_explore, agent_no_attention_price, agent_loose_caps, agent_no_guards]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/diagnose.yml
      - name: Install the v2 core
        run: pip install "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54" "pyyaml==6.0.3"
      - name: Gym scoreboard and DIAG
        shell: bash   # bash -eo pipefail: a crash under tee must turn the job red
        run: |
          mkdir -p diagnose-report
          python -m autonomy.gym.run --scenario ${{ matrix.scenario }} --policy ${{ matrix.policy }} --seeds 3 --customers 3000 --report-json diagnose-report/${{ matrix.scenario }}-${{ matrix.policy }}.json | tee diagnose-report/${{ matrix.scenario }}-${{ matrix.policy }}.txt
      - name: DIAG block again, alone
        if: always()
        shell: bash
        run: grep '^DIAG ' diagnose-report/${{ matrix.scenario }}-${{ matrix.policy }}.txt || echo "no DIAG block was printed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-gym-${{ matrix.scenario }}-${{ matrix.policy }}
          path: diagnose-report/
          if-no-files-found: ignore

  bench:
    name: bench ${{ matrix.dataset }} ${{ matrix.policy }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dataset: [hillstrom, x5]
        policy: [agent, agent_v3, v3_no_lookalike, v3_no_who, v3_no_frequency, v3_no_moments, v3_no_journeys, v3_no_offers, agent_lookalike, agent_who, agent_frequency, agent_moments, agent_journeys, agent_offers, agent_no_restraint, agent_no_weekly_budget, agent_no_explore, agent_no_attention_price, agent_loose_caps, agent_no_guards]
    env:
      DATA_DIR: ${{ github.workspace }}/.realbench-data   # inside the workspace: actions/cache rejects ".." paths
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/diagnose.yml
      - name: Install the light deps
        run: pip install "pydantic==2.13.5" "numpy==2.4.6" "pandas==2.3.3" "sqlalchemy==2.0.54" "pyyaml==6.0.3"
      # The same raw-download cache as realbench.yml (same key and folders), so a dataset that run fetched is not
      # fetched again; the bench's own derived caches (<data-dir>/_cache) are rebuilt every run.
      - name: Cache the dataset
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_DIR }}/hillstrom
            ${{ env.DATA_DIR }}/x5_retailhero
            ${{ env.DATA_DIR }}/criteo_uplift
            ${{ env.DATA_DIR }}/megafon
          key: realbench-data-${{ matrix.dataset }}-${{ hashFiles('scripts/v2_realbench/fetch.py') }}
      - name: Download (checksummed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python -m scripts.v2_realbench.fetch --data-dir "$DATA_DIR" --dataset ${{ matrix.dataset }} && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Scoreboard and DIAG
        shell: bash   # bash -eo pipefail: a crash under tee must turn the job red
        run: |
          mkdir -p diagnose-report
          python -m scripts.v2_realbench.run --dataset ${{ matrix.dataset }} --policy ${{ matrix.policy }} \
            --data-dir "$DATA_DIR" \
            --json diagnose-report/${{ matrix.dataset }}-${{ matrix.policy }}.json --quiet \
            --note "CI diagnose ${{ github.sha }}" | tee diagnose-report/${{ matrix.dataset }}-${{ matrix.policy }}.md
      - name: Summary row and DIAG block again, alone
        if: always()
        shell: bash
        run: grep -E '^(DIAG |\| ${{ matrix.dataset }} \|)' diagnose-report/${{ matrix.dataset }}-${{ matrix.policy }}.md || echo "no summary row or DIAG block was printed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-bench-${{ matrix.dataset }}-${{ matrix.policy }}
          path: diagnose-report/
          if-no-files-found: ignore
