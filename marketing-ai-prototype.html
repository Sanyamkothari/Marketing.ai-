<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing AI · Minfy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--soft:#F9FAFB;--line:#E5E7EB;--line2:#D1D5DB;
  --ink:#111827;--ink2:#374151;--muted:#6B7280;--faint:#9CA3AF;
  --stage:#111827;--stage-ink:#FFFFFF;--stage-num:#9CA3AF;
  --p:#2F6FDB;--p-t:#EDF3FD;--g:#7A55D3;--g-t:#F3EFFC;--h:#12957F;--h-t:#E8F6F3;
  --ok:#15803D;--ok-t:#E8F6EE;--warn:#B45309;--warn-t:#FEF3C7;--bad:#B42318;--bad-t:#FDECEC;
  --brand-blue:#1E57BD;--brand-yellow:#FFD500;
  --track:#F3F4F6;
  /* v1 aliases (no new colours): the primary button's fill and label */
  --btn:var(--ink);--btn-ink:var(--surface);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216;--surface:#171B21;--soft:#1D222A;--line:#2A3039;--line2:#36404B;
    --ink:#F3F4F6;--ink2:#D1D5DB;--muted:#9AA3AF;--faint:#6B7480;
    --stage:#E5E7EB;--stage-ink:#111827;--stage-num:#6B7280;
    --p:#6E9BEA;--p-t:#1B2A44;--g:#A68BEA;--g-t:#2A2342;--h:#4CC3AC;--h-t:#16302B;
    --ok:#5BD08A;--ok-t:#16301F;--warn:#F2B35B;--warn-t:#3A2C14;--bad:#F2877B;--bad-t:#3B1C19;
    --brand-blue:#6E9BEA;--track:#232932;
    --btn:var(--p);--btn-ink:var(--stage-ink);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#171B21;--soft:#1D222A;--line:#2A3039;--line2:#36404B;
  --ink:#F3F4F6;--ink2:#D1D5DB;--muted:#9AA3AF;--faint:#6B7480;
  --stage:#E5E7EB;--stage-ink:#111827;--stage-num:#6B7280;
  --p:#6E9BEA;--p-t:#1B2A44;--g:#A68BEA;--g-t:#2A2342;--h:#4CC3AC;--h-t:#16302B;
  --ok:#5BD08A;--ok-t:#16301F;--warn:#F2B35B;--warn-t:#3A2C14;--bad:#F2877B;--bad-t:#3B1C19;
  --brand-blue:#6E9BEA;--track:#232932;
  --btn:var(--p);--btn-ink:var(--stage-ink);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}
a:focus-visible{border-radius:6px}
img,svg{max-width:100%}
.screen{max-width:1440px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:44px 64px 96px}
@media (max-width:900px){.screen{margin:0;border-radius:0;border-left:0;border-right:0;padding:28px 20px 96px}}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.head .titles{display:flex;flex-direction:column;gap:8px;min-width:0}
.h1{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:15px;margin:0}
.desc{color:var(--muted);font-size:14px;margin:0;max-width:640px;line-height:1.5}
.logo{width:142px;height:38px;flex:none}
.logo .b{fill:var(--brand-blue)} .logo .y{fill:var(--brand-yellow)} .logo .s{stroke:var(--brand-blue)}
.rule{height:1px;background:var(--line);margin:24px 0}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--faint)} .crumbs .cur{color:var(--ink);font-weight:600}
.over{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.stage{background:var(--soft);border:1px solid var(--line)} .chip.stage span{color:var(--muted);font-weight:400}
.t-P{--c:var(--p);--t:var(--p-t)} .t-G{--c:var(--g);--t:var(--g-t)} .t-H{--c:var(--h);--t:var(--h-t)}
.chip.type{background:var(--t);color:var(--c)} .chip.type.t-H{color:var(--ink2)}
.back{font-size:12px;font-weight:500;color:var(--muted)} .back:hover{color:var(--ink)}

/* overview */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cap{font-size:12px;font-weight:500;color:var(--muted)}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend .lbl{font-size:12px;color:var(--muted)}
.timeline-wrap{overflow-x:auto;margin-top:40px;padding-bottom:8px}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));column-gap:38px;min-width:1100px}
.stage-col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stage-pill{position:relative;width:100%;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:8px;background:var(--stage);color:var(--stage-ink);font-weight:600;font-size:15px}
.stage-pill .n{color:var(--stage-num);font-size:12px}
.stage-col:not(:last-child) .stage-pill::after{content:"→";position:absolute;right:-28px;top:50%;transform:translateY(-50%);color:var(--faint);font-weight:400;font-size:18px}
.uc-list{display:flex;flex-direction:column;gap:8px;width:100%}
.uc{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 14px 18px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-weight:500;overflow:hidden;transition:border-color .15s, background .15s}
.uc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.uc .chev{color:var(--faint);font-size:18px;line-height:1}
.uc:hover{border-color:var(--c);background:var(--soft)} .uc:hover .chev{color:var(--c)}
.hint{margin-top:48px;font-size:12px;color:var(--muted)}

/* detail */
.flow{display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;align-items:stretch;margin-top:16px}
.flow .arrow{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:22px}
.block{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:196px;padding:28px 24px 22px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);overflow:hidden;transition:border-color .15s, background .15s}
.block::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.block .lab{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.block .val{font-size:20px;font-weight:600;margin-top:10px;line-height:1.3}
.block .go{display:flex;justify-content:space-between;color:var(--c);font-weight:500;font-size:13px}
.block:hover{border-color:var(--c);background:var(--soft)}
@media (max-width:900px){.flow{grid-template-columns:1fr}.flow .arrow{transform:rotate(90deg);height:40px}}

/* detail setup */
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;margin-top:8px}
@media (max-width:1100px){.setup-grid{grid-template-columns:1fr}}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--soft);gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.seg-help{font-size:12px;color:var(--muted);margin:10px 0 0}
.form-body{padding:20px}
.fstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.fstep:first-of-type{border-top:0;padding-top:4px}
.fstep.locked{opacity:.4;pointer-events:none}
.stepno{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--t);color:var(--c);font-size:12px;font-weight:600;margin-top:2px}
.fstep.done .stepno{background:var(--ok-t);color:var(--ok)}
.flabel{font-size:13px;font-weight:600;color:var(--ink)}
.fhint{font-size:12px;color:var(--muted);margin:2px 0 10px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;width:240px}
.field.sm{width:170px}
.field .sub{font-size:12px;color:var(--muted)}
@media (max-width:700px){.field,.field.sm{width:100%}}
.control{position:relative;display:flex;align-items:center;height:38px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink);transition:border-color .15s}
.control:hover{border-color:var(--ink2)}
.control:focus-within{outline:2px solid var(--brand-blue);outline-offset:1px}
.control.file{cursor:pointer;padding:0 12px;justify-content:space-between;gap:8px;font-weight:500;width:260px;max-width:100%}
.control.file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.control.file .ico{color:var(--faint);font-size:15px}
.control.file.has{border-color:var(--c);background:var(--t);color:var(--c)}
.control.file.has .ico{color:var(--c)}
.control.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.control select,.control input[type=number],.control input[type=text]{appearance:none;-webkit-appearance:none;width:100%;height:100%;border:0;background:transparent;color:inherit;font:inherit;padding:0 32px 0 12px;outline:none;text-overflow:ellipsis}
.control input[type=text]{padding:0 12px}
.field.wide{width:100%}
.control select{cursor:pointer}.control input[type=number]{padding-right:12px}
.control select option{color:var(--ink);background:var(--surface)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.linkbtn{border:0;background:none;padding:0;min-height:24px;font:inherit;font-size:13px;font-weight:500;color:var(--brand-blue);text-decoration:none;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.orline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.preview .pv-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--muted)}
.preview .pv-head b{color:var(--ink);font-weight:600}
.preview table{font-size:12px;background:var(--surface)}
.preview th{padding:7px 12px}.preview td{padding:7px 12px;color:var(--ink2);white-space:nowrap}
.colchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.colchip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.colchip.t{border-color:var(--c);color:var(--c)}
details.adv{border-top:1px solid var(--line);padding:14px 0 0}
details.adv summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.adv[open] summary::before{transform:rotate(45deg)}
details.adv .frow{padding-top:14px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;height:38px}
.check input{width:16px;height:16px;accent-color:var(--brand-blue)}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line);margin-top:6px}
.run{height:40px;padding:0 20px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.run:hover{opacity:.88}.run:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}
.run[disabled]{background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);opacity:1;cursor:not-allowed}
.reason{font-size:13px;color:var(--muted)}
.runs-list{display:flex;flex-direction:column}
.runrow{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.runrow:first-child{border-top:0}
.runrow .r1{font-weight:500;color:var(--ink)}.runrow .r2{font-size:12px;color:var(--muted);margin-top:2px}
.runrow .r3{text-align:right;white-space:nowrap}
.runrow .r3 b{display:block;font-weight:600}
.champ{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok-t);color:var(--ok);margin-left:6px;vertical-align:1px}
.empty{padding:16px 20px;font-size:13px;color:var(--muted)}
.next{margin-top:24px;font-size:12px;color:var(--muted)}
.adv-wrap{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.adv-wrap>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13px;font-weight:500;color:var(--ink2)}
.adv-wrap>summary::-webkit-details-marker{display:none}
.adv-wrap>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.adv-wrap[open]>summary::before{transform:rotate(45deg)}
.adv-wrap>summary .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.stages{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 16px}
.stage-d{border-top:1px solid var(--line)}
.stage-d:first-child{border-top:0}
.stage-d>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;font-size:13px;background:var(--surface)}
.stage-d>summary::-webkit-details-marker{display:none}
.stage-d>summary:hover{background:var(--soft)}
.stage-d>summary .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.stage-d>summary .st{font-weight:600;color:var(--ink)}
.stage-d>summary .ss{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-d>summary .sc{font-size:12px;color:var(--muted)}
.stage-d[open]>summary .sc{color:var(--c)}
.stage-d .frow{padding:4px 16px 16px 16px;background:var(--soft)}
.field.xs{width:130px}
.algos{display:flex;flex-wrap:wrap;gap:8px 16px;padding:4px 16px 16px 16px;background:var(--soft)}
.algos label{display:flex;align-items:center;gap:7px;font-size:13px}
.algos input{width:15px;height:15px;accent-color:var(--brand-blue)}
.fstep .frow .field{width:220px}
.ptype{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.ptype .pill{background:var(--t);color:var(--c)}
.ptype select{border:0;background:transparent;font:inherit;font-size:12px;color:var(--brand-blue);text-decoration:underline;cursor:pointer;padding:0}
/* running */
.progress{list-style:none;margin:0;padding:8px 20px 20px;display:flex;flex-direction:column}
.progress li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.progress li:first-child{border-top:0}
.progress .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--soft);color:var(--faint);border:1px solid var(--line)}
.progress li.active .dot{border-color:var(--c);color:var(--c);background:var(--t)}
.progress li.active .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.progress li.done .dot{background:var(--ok-t);color:var(--ok);border-color:transparent}
.progress .pt{font-size:13px;font-weight:500;color:var(--muted)}
.progress li.active .pt,.progress li.done .pt{color:var(--ink)}
.progress .pd{font-size:12px;color:var(--muted);margin-top:2px;min-height:14px}
.progress li.done .pd{color:var(--ok)}
/* results */
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px;margin-top:8px}
.summary .ok{color:var(--ok);font-weight:600}.summary .muted{color:var(--muted)}
.summary .again{color:var(--brand-blue);font-weight:500;background:none;border:0;padding:0;min-height:24px;font:inherit;cursor:pointer;text-decoration:none}
.summary .again:hover{text-decoration:underline}
.block .meta{font-size:12px;color:var(--muted);margin-top:8px}
.block .lab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bstate{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ok)}
.results .cap{display:block;margin:28px 0 0}
.runs-below{margin-top:32px}

/* mock pages */
.tabs-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2)}
.tab .n{color:var(--muted);font-size:12px;font-weight:600}
.tab.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tab:not(.on):hover{border-color:var(--ink2)}
.tabs .arr{color:var(--faint)}
.note{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:24px;margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:600;margin-top:6px;line-height:1.2;font-feature-settings:"tnum"}
.row{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:stretch}
.row.rev{grid-template-columns:420px minmax(0,1fr)}
@media (max-width:1100px){.row,.row.rev{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.card h3{margin:0;padding:16px 20px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.card h4{margin:0;padding:13px 20px;font-size:13px;font-weight:600;background:var(--soft);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--soft);text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 20px;white-space:nowrap}
td{padding:12px 20px;border-top:1px solid var(--line);color:var(--ink2);vertical-align:middle}
td:first-child{color:var(--ink);font-weight:500}
table.eval td:nth-child(2){color:var(--ink);font-weight:600} table.eval td:nth-child(3){color:var(--muted)}
.code{font-family:inherit;font-feature-settings:"tnum"}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 20px;border-top:1px solid var(--line);font-size:13px}
.card h3 + .kv{border-top:0}
.kv .k{color:var(--muted)} .kv .v{font-weight:500;text-align:right}
.steps{list-style:none;margin:0;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:center}
.steps .no{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--t);color:var(--c);font-size:12px;font-weight:600}
.steps .s1{font-size:13px;font-weight:500} .steps .s2{font-size:12px;color:var(--muted)}
.bars{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.brow{display:grid;grid-template-columns:200px 1fr 48px;gap:16px;align-items:center;font-size:13px}
.brow .lab{color:var(--ink2);overflow-wrap:anywhere}
.track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--c)}
.brow .pct{font-weight:500;text-align:right}
.caption{font-size:12px;color:var(--muted);padding:0 20px 18px}
.bars + .caption{padding-top:0}
.cm{padding:18px 20px;display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:center}
.cm .hd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cm .rl{font-size:12px;font-weight:600;color:var(--muted)}
.cm .cell{height:64px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft)}
.cm .cell.good{background:var(--t)} .cm .cell b{font-size:16px;font-weight:600;color:var(--ink2)} .cm .cell.good b{color:var(--c)}
.cm .cell small{font-size:12px;color:var(--muted)}
.vchart{flex:1;display:flex;align-items:flex-end;gap:12px;padding:24px 20px 12px;min-height:240px;overflow-x:auto}
.vcol{flex:1;min-width:34px;max-width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.vcol .bv{color:var(--ink2);font-weight:500}
.vcol .bb{width:100%;max-width:40px;border-radius:4px 4px 0 0;background:var(--t)}
.vcol.top .bb{background:var(--c)}
.vcol .bl{color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-t);color:var(--ok)} .pill.warn{background:var(--warn-t);color:var(--warn)} .pill.bad{background:var(--bad-t);color:var(--bad)}
.spacer{flex:1}
@media (prefers-reduced-motion:no-preference){ #app{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }
/* --- header client picker (Phase 2 §10 A), since v1 in the top bar's context slot (ui/index.html) --- */
.clientpick{display:flex;align-items:center;gap:8px}
.clientpick .clabel{font-size:12px;font-weight:500;color:var(--muted)}
.clientpick .control{height:32px;width:186px;font-size:12px}
.clientpick .control select{padding:0 28px 0 10px}
@media (max-width:700px){.clientpick .clabel{display:none}.clientpick .control{width:150px}.clientpick .toggletip{display:none}}

/* --- step 1 source choice + onboarding panel (Phase 2 §10 B) --- */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px}
@media (max-width:700px){.pick{grid-template-columns:1fr}}
.pickcard{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.pickcard:hover{border-color:var(--c);background:var(--soft)}
.pickcard.on{border-color:var(--c);background:var(--t)}
.pickcard .pt1{font-size:13px;font-weight:600;color:var(--ink)}
.pickcard.on .pt1{color:var(--c)}
.pickcard .pt2{font-size:12px;color:var(--muted);line-height:1.45}
.pickcard .ptag{position:absolute;top:12px;right:12px;font-size:12px;font-weight:600;color:var(--c)}
.ob{border:1px solid var(--line2);border-radius:10px;margin-top:14px;overflow:hidden;background:var(--surface)}
.ob>.obhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.ob>.obhead .obt{font-size:13px;font-weight:600}
.ob>.obhead .obh{font-size:12px;color:var(--muted)}
.obstep{border-top:1px solid var(--line)}
.obstep:first-of-type{border-top:0}
.obsum{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;background:var(--surface);font:inherit;text-align:left;cursor:pointer}
.obsum:hover{background:var(--soft)}
.obtick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.obstep.done .obtick{background:var(--ok-t);border-color:transparent;color:var(--ok)}
.obsum .ot{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.obsum .os{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.obsum .oc{font-size:12px;color:var(--muted)}
.obstep.open .obsum .oc{color:var(--c)}
.obbody{padding:4px 16px 18px;background:var(--soft);border-top:1px solid var(--line)}
.obbody .sechd{font-size:12px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
.obbody .sechd:first-child{margin-top:12px}
.obhint{font-size:12px;color:var(--muted);margin:2px 0 10px}
.obhint.stage-note{margin:0;padding:0 16px 12px;background:var(--soft)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface);text-align:center;cursor:pointer;margin-top:10px}
.drop:hover{border-color:var(--c)}
.drop .d1{font-size:13px;font-weight:500}
.drop .d2{font-size:12px;color:var(--muted)}
.srctbl{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.srcrow{display:grid;grid-template-columns:minmax(150px,1.4fr) 104px 200px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.srcrow:first-child{border-top:0}
.srcrow .sname{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.srcrow .srows{font-size:12px;color:var(--muted);font-feature-settings:"tnum"}
.srcfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-2px}
.srchint{font-size:12px;color:var(--muted)}
@media (max-width:1100px){.srcrow{grid-template-columns:1fr 1fr}.srcrow .sname{grid-column:1/-1}}
@media (max-width:700px){.buildprog li{grid-template-columns:22px minmax(0,1fr)}.buildprog li .bn{grid-column:2}}
.cov{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--ok-t);color:var(--ok);white-space:nowrap}
.cov.warn{background:var(--warn-t);color:var(--warn)}
.control.tiny{height:32px;font-size:12px}
.control.tiny select{padding:0 26px 0 10px}
.control.tiny input{padding:0 10px}

/* mapping */
.mapcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:12px}
.mapcard>.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.mapcard>.mh .m1{font-size:13px;font-weight:600}
.mapcard>.mh .m2{font-size:12px;color:var(--muted)}
.maprow{display:grid;grid-template-columns:minmax(120px,160px) 18px 190px minmax(120px,1fr);gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.maprow .mcol{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.maprow .marrow{color:var(--faint);text-align:center}
.maprow .mtype{font-size:12px;color:var(--muted)}
.maprow .msamp{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow.need{background:var(--bad-t)}
.maprow .srchint{grid-column:1/-1}
.needmsg{grid-column:1/-1;font-size:12px;color:var(--bad);margin-top:2px}
@media (max-width:1100px){.maprow{grid-template-columns:1fr 1fr}.maprow .marrow{display:none}.maprow .mcol{grid-column:1/-1}}
.conf{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;font-feature-settings:"tnum";background:var(--ok-t);color:var(--ok)}
.conf.amber{background:var(--warn-t);color:var(--warn)}
.conf.grey{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.vmapbtn{border:0;background:none;padding:0;min-height:24px;font:inherit;font-size:12px;color:var(--brand-blue);text-decoration:underline;cursor:pointer}
.vmap{margin:0 14px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--soft);padding:12px 14px}
.vmap .vt{font-size:12px;font-weight:600;margin-bottom:6px}
.vmap .vrow{display:grid;grid-template-columns:110px 18px 1fr;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid var(--line)}
.vmap .vrow:first-of-type{border-top:0}
.vmap code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* features & label */
.featgrp{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.featgrp>.fg{padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2)}
.featrow{display:grid;grid-template-columns:18px minmax(150px,1fr) minmax(0,1.6fr) 118px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:12px}
.featrow:first-of-type{border-top:0}
.featrow input{width:15px;height:15px;accent-color:var(--brand-blue)}
.featrow .fn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);overflow-wrap:anywhere}
.featrow .fd{color:var(--muted)}
.featrow .fw{color:var(--muted);text-align:right;white-space:nowrap}
.featrow.dropped .fn,.featrow.dropped .fd{color:var(--muted);text-decoration:line-through}
@media (max-width:900px){.featrow{grid-template-columns:18px 1fr}.featrow .fd,.featrow .fw{grid-column:2/-1;text-align:left}}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;line-height:2.1;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sentence .control{height:32px;font-size:13px;width:auto}
.sentence .control select{padding:0 28px 0 10px}
.sentence .control input{width:62px;padding:0 10px;text-align:center}
.sentence .control.name input{width:130px;text-align:left}
.nullbars{display:flex;flex-direction:column;gap:9px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.nullbars .nrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:12px;align-items:center;font-size:12px}
.nullbars .nrow .nl{color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.nullbars .nrow .np{text-align:right;color:var(--muted);font-feature-settings:"tnum"}
.posrate{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.posrate .pcol{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.posrate .pcol .pv{font-weight:600;color:var(--ink2);font-feature-settings:"tnum"}
.posrate .pcol .pl{color:var(--muted)}

/* build & review */
.buildprog{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.buildprog li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.buildprog li:first-child{border-top:0}
.buildprog li .bd{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600}
.buildprog li.done{color:var(--ink2)}
.buildprog li.done .bd{background:var(--ok-t);border-color:transparent;color:var(--ok)}
.buildprog li.active{color:var(--ink)}
.buildprog li.active .bd{border-color:var(--c);background:var(--t);color:var(--c)}
.buildprog li .bn{color:var(--muted);font-feature-settings:"tnum"}
.report{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-top:12px}
.report>.rh{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.report .rrow{display:grid;grid-template-columns:minmax(140px,1.4fr) 120px 110px minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:12px}
.report .rrow .r1{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.report .rrow .r2,.report .rrow .r3{color:var(--muted);font-feature-settings:"tnum"}
@media (max-width:900px){.report .rrow{grid-template-columns:1fr 1fr}.report .rrow .r1{grid-column:1/-1}}
.mini{display:block}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.checks li .ck{color:var(--ok);font-weight:600}
.checks li.bad .ck{color:var(--bad)}
.obact{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.run.sm{height:34px;padding:0 16px;font-size:12px}
.run.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.run.ghost:hover{border-color:var(--ink2);opacity:1}

/* lineage (Phase 2 §10 F) */
.lineage{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;padding:14px 20px;overflow-x:auto}
.lnode{flex:1;min-width:132px;display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.lnode .l1{font-size:12px;font-weight:600;color:var(--ink)}
.lnode .l2{font-size:12px;color:var(--c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.lnode .l3{font-size:12px;color:var(--muted)}
.larrow{display:flex;align-items:center;justify-content:center;width:26px;flex:none;color:var(--faint)}
@media (max-width:700px){.lineage{flex-direction:column}.larrow{width:auto;height:22px;transform:rotate(90deg)}}

/* root causes (Phase 3a §9 D) */
.rcseg{border-top:1px solid var(--line)}
.rcseg:first-of-type{border-top:0}
.rcseg .rs{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 20px 0}
.rcseg .rs .rsh{font-size:13px;font-weight:600}
.rcseg .rs .rsn{font-size:12px;color:var(--muted)}
.rcseg .rline{font-size:13px;color:var(--ink2);padding:6px 20px 12px}
.cause{padding:12px 20px;border-top:1px solid var(--line)}
.cause .ct{font-size:13px;font-weight:500;color:var(--ink)}
.evchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:999px;font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.evchip.reason{background:var(--t);border-color:transparent;color:var(--c);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.evchip.quote{font-style:italic;color:var(--muted)}
.rcfoot{padding:12px 20px;border-top:1px solid var(--line);background:var(--soft)}
.rcfoot .fl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.rcfoot ul{margin:0;padding-left:18px;font-size:12px;color:var(--ink2)}
.rcfoot ul li{margin:3px 0}
.rcfoot .cav{font-size:12px;color:var(--muted);margin-top:10px}
.genbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px}
.genbox .gb1{font-size:13px;color:var(--ink2)}
.genbox .gb2{font-size:12px;color:var(--muted)}

/* campaign copy (Phase 3a §9 E) */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 20px;background:var(--warn-t);color:var(--warn);font-size:12px;border-bottom:1px solid var(--line)}
.ccbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ccgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 20px}
@media (max-width:1100px){.ccgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.ccgrid{grid-template-columns:1fr}}
.cccard{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.cccard.blocked{border-color:var(--bad)}
.cccard .cch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cccard .cct{font-size:12px;font-weight:600;color:var(--ink)}
.cccard .ccb{font-size:13px;color:var(--ink2);line-height:1.5}
.cccard .ccm{font-size:12px;color:var(--muted);font-feature-settings:"tnum"}
.cccard .ccwhy{font-size:12px;color:var(--bad)}
.cccard .ccact{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.ccbtn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 12px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer}
.ccbtn:hover{border-color:var(--ink2)}
.ccbtn[disabled]{background:var(--soft);color:var(--muted);opacity:1;cursor:not-allowed}
.ccgrouphd{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}

/* assistant results (Phase 3a §9 C) */
.evalbar{padding:16px 20px}
.evalbar .eb{position:relative;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.evalbar .eb i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.evalbar .ebm{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.evalbar .ebl{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.evalbar .ebv{font-size:22px;font-weight:600;color:var(--ink);margin-bottom:10px}
.chatpanel{display:flex;flex-direction:column;gap:12px;padding:16px 20px}
.bubble{max-width:88%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.bubble.q{align-self:flex-end;background:var(--t);color:var(--c);border-bottom-right-radius:4px}
.bubble.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);color:var(--ink2);border-bottom-left-radius:4px}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details.cite{max-width:100%}
details.cite summary{display:inline-flex;align-items:center;gap:6px;list-style:none;cursor:pointer;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--surface);border:1px solid var(--line2);color:var(--ink2)}
details.cite summary::-webkit-details-marker{display:none}
details.cite summary:hover{border-color:var(--c);color:var(--c)}
details.cite[open] summary{border-color:var(--c);color:var(--c)}
details.cite .quote{margin-top:8px;padding:10px 12px;border-left:3px solid var(--c);background:var(--surface);border-radius:0 8px 8px 0;font-size:12px;color:var(--muted);line-height:1.55}
.costline{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
/* shapes the built generative screens settled on (ui/modules/generative) */
.gusage{font-size:12px;color:var(--ink2)}
.gusage b{color:var(--ink);font-weight:600}
.gchecks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.gchecks li{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.gchecks .pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.gcounts{display:inline-flex;gap:6px;flex-wrap:wrap}
.bubble.a.refused{border-color:var(--warn);background:var(--warn-t)}
.gmeta{margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gsim{font-weight:400;color:var(--muted)}
.askrow{display:flex;gap:10px;margin-top:14px}
.askrow input{flex:1;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:0 14px}
.askrow input:focus-visible{outline:2px solid var(--brand-blue);outline-offset:1px}
.askrow button{height:40px;padding:0 18px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.holdout{font-size:12px;color:var(--muted);padding:0 20px 14px}
.holdout b{color:var(--ink);font-weight:600}
.approver{padding:0 20px 14px}
.approver .field{width:280px;max-width:100%}
.segshare{font-size:12px;color:var(--muted)}
.refcols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;margin:10px 0 2px;font-size:12px;color:var(--muted)}
.refcols .colchip{justify-self:start}
.referr{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bad-t);color:var(--bad);font-size:12px}
.ebverdict{font-size:12px;margin-top:8px;font-weight:500}
.ebverdict.ok{color:var(--ok)}.ebverdict.bad{color:var(--bad)}
.docrow{display:grid;grid-template-columns:minmax(150px,1fr) 88px 96px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:12px}
.docrow:first-child{border-top:0}
.docrow .dn{font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.docrow .dv{color:var(--muted);text-align:right;font-feature-settings:"tnum"}
.doclist{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-top:10px}

/* uplift (Phase 3b §8) */
/* DEC-608's entry link under a use case's header, and the #/uplift index: ui/modules/uplift/styles.js */
.uentry{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:-8px 0 20px;font-size:12px;color:var(--muted)}
.uentry a{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line2);border-radius:999px;color:var(--ink2);font-weight:500;text-decoration:none}
.uentry a:hover{border-color:var(--ink2);color:var(--ink)}
.uentry a b{font-weight:600;color:var(--ink)}
.uindex{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.uindex>a,.uindex>.off{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink);text-decoration:none}
.uindex>:first-child{border-top:0}
.uindex>a:hover{background:var(--soft)}
.uindex>.off{color:var(--muted)}
.uindex .s{font-size:12px;color:var(--muted);text-align:right}
.upwhy{flex-basis:100%;color:var(--ink2)}
.ptype select{max-width:88px}
.uphint{font-size:12px;color:var(--muted)}
.upchecks{border:1px solid var(--line2);border-radius:10px;margin-top:14px;overflow:hidden;background:var(--surface)}
.upchecks .uph{padding:10px 14px;background:var(--bad-t);color:var(--bad);font-size:12px;font-weight:600}
.upchecks .checks li.warn .ck{color:var(--warn)}
.upchecks .checks li.skip{color:var(--muted)}
.upchecks .checks li.skip .ck{color:var(--muted)}
.upchecks .upmsg{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.upchecks .upmsg b{color:var(--bad);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600}
.upchecks .check{height:auto;padding:10px 14px;border-top:1px solid var(--line);background:var(--soft);align-items:flex-start}
.upchecks .check input{margin-top:2px}
.ncbanner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border:1px solid var(--bad);border-radius:10px;background:var(--bad-t);color:var(--bad);font-size:13px;line-height:1.5}
.ncbanner b{font-weight:600}
.qini{display:block;width:100%;max-width:720px;height:auto;padding:12px 16px 0}
.qini text{fill:var(--muted);font-size:12px;font-family:inherit}
.qlegend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 20px 12px;font-size:12px;color:var(--muted)}
.qlegend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--c);vertical-align:middle;margin-right:6px}
.qlegend i.rnd{border-top:1.5px dashed var(--faint)}
.ciband{padding:16px 20px 4px}
.ciband .civ{font-size:22px;font-weight:600;color:var(--ink);margin-bottom:10px}
.ciband .civ small{font-size:13px;font-weight:500;color:var(--muted);margin-left:8px}
.ciband .cit{position:relative;height:12px;border-radius:6px;background:var(--track)}
.ciband .cir{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--ok-t);border:1px solid var(--ok)}
.ciband.bad .cir{background:var(--bad-t);border-color:var(--bad)}
.ciband .cip{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.ciband .ciz{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--ink2)}
.ciband .cil{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.upverdict{font-size:13px;color:var(--ink2);padding:10px 20px 14px;line-height:1.5}
.upverdict .pill{margin-right:6px}
.dbars{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.dbrow{display:grid;grid-template-columns:36px minmax(0,1fr) 240px;gap:14px;align-items:center;font-size:12px}
.dbrow .dl{color:var(--muted);font-weight:600}
.dbrow .dv{text-align:right;color:var(--ink2);font-feature-settings:"tnum";white-space:nowrap}
.dbrow .dv span{color:var(--muted)}
.dbar{position:relative;height:20px}
.dbar .dz{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line2)}
.dbar .dob{position:absolute;top:1px;height:10px;border-radius:2px;background:var(--c)}
.dbar .dob.neg{background:var(--bad)}
.dbar .dpr{position:absolute;top:13px;height:5px;border-radius:2px;background:var(--faint)}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:16px 20px 6px;background:var(--track)}
.segbar i{display:block;height:100%}
.sg-persuadable{--sg:var(--ok)} .sg-sure_thing{--sg:var(--p)} .sg-lost_cause{--sg:var(--line2)} .sg-sleeping_dog{--sg:var(--bad)}
.segbar i,.segrow .sw{background:var(--sg)}
.segrows{display:flex;flex-direction:column;padding:4px 0 8px}
.segrow{display:grid;grid-template-columns:12px minmax(120px,1fr) 70px 56px minmax(150px,1.5fr);gap:10px;align-items:center;padding:9px 20px;border-top:1px solid var(--line);font-size:13px}
.segrow:first-child{border-top:0}
.segrow .sw{width:12px;height:12px;border-radius:3px}
.segrow .sn{font-weight:500;color:var(--ink)}
.segrow .sn small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.segrow .sc2,.segrow .sp{text-align:right;font-feature-settings:"tnum";color:var(--ink2)}
.segrow .sa{font-size:12px;color:var(--muted)}
.segrow.sg-sleeping_dog .sa{color:var(--bad)}
.segrow.sg-persuadable .sa{color:var(--ok);font-weight:500}
.upbig{padding:16px 20px 6px}
.upbig .ub1{font-size:12px;color:var(--muted)}
.upbig .ub2{font-size:28px;font-weight:700;line-height:1.2;margin-top:4px}
.upbig .ub3{font-size:12px;color:var(--ink2);margin-top:4px}
.updl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.crgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;padding:16px 20px}
.crgrid .field{width:auto}
.crwait{display:flex;flex-direction:column;gap:6px;padding:22px 20px;border-top:1px solid var(--line);background:var(--soft)}
.crwait .cw1{font-size:20px;font-weight:600;color:var(--ink)}
.crwait .cw2{font-size:13px;color:var(--muted);max-width:640px}
.crsum{padding:14px 20px;font-size:13px;color:var(--ink2);line-height:1.55;border-top:1px solid var(--line)}
@media (max-width:700px){.dbrow{grid-template-columns:30px minmax(0,1fr)}.dbrow .dv{grid-column:2;text-align:left}
.segrow{grid-template-columns:12px minmax(0,1fr) 64px}.segrow .sp{display:none}.segrow .sa{grid-column:2/-1}
.crgrid{grid-template-columns:1fr}}
/* ==== v1 foundation (docs/ui/FOUNDATION.md): one set of components every screen shares ============
   Tokens only (no new colour values). Spacing 4/8/12/16/24/32/48; type 12/13/14/15/20/22/28. */
.skip{position:absolute;left:16px;top:-64px;z-index:100;padding:8px 16px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);font-size:13px;font-weight:600}
.skip:focus{top:8px}
#app:focus{outline:none}
.control :focus-visible{outline:none}
@media (max-width:700px){.head{gap:12px}.logo{width:110px;height:30px}}
.tnum,td.num,th.num{font-feature-settings:"tnum"}
td.num,th.num{text-align:right}

/* buttons: .btn + one of .primary / .secondary / .quiet / .danger, optionally .sm */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:1px solid transparent;border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.secondary:hover{background:var(--soft);border-color:var(--ink2)}
.btn.quiet{height:auto;min-height:24px;padding:0 4px;border:0;background:none;color:var(--brand-blue)}
.btn.quiet:hover{text-decoration:underline}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.danger.confirm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{height:32px;padding:0 12px}
.btn.quiet.sm{height:auto;padding:0 4px}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--soft);border-color:var(--line);color:var(--muted);opacity:1;cursor:not-allowed}
.btn.quiet[disabled]{background:none}
.btn svg,.ico{width:16px;height:16px;flex:none}
.btn-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* page header: breadcrumb, H1, description, one chip, then the actions */
.head-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.head-actions .related{font-size:13px;font-weight:500;color:var(--brand-blue)}
.head-actions .related:hover{text-decoration:underline}

/* cards and notices */
.card-body{padding:16px 20px}
.notice-card .notice-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px}
.notice-card h3{border-bottom:0;padding-bottom:0}
.chip.neutral{background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand-blue);color:var(--surface);font-size:12px;font-weight:600;font-feature-settings:"tnum"}

/* states: empty, error, not found, loading */
.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:24px 20px}
.empty-state .es-t{margin:0;font-size:14px;font-weight:600;color:var(--ink)}
.empty-state p{margin:0;font-size:13px;color:var(--muted);max-width:640px}
.empty-state .btn{margin-top:8px}
.apierr .apierr-fix{margin:4px 0 0;color:var(--ink2)}
.apierr .btn-row{margin-top:12px}
.apierr details.tech{margin-top:12px;border-top-color:var(--line2)}
.skel-screen .skel{display:block;background:var(--track);border-radius:6px}
.skel-crumb{width:180px;height:12px}
.skel-h1{width:320px;max-width:70%;height:28px}
.skel-desc{width:520px;max-width:90%;height:14px}
.skel-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.skel-kpi{height:84px;border-radius:10px}
.skel-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.skel-card{height:220px;border-radius:10px}
.skel-list{display:flex;flex-direction:column;gap:8px}
.skel-row{height:48px;border-radius:8px}
@media (max-width:1100px){.skel-kpis{grid-template-columns:repeat(2,1fr)}.skel-cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.skel-screen .skel{animation:skel 1.2s ease-in-out infinite}@keyframes skel{0%,100%{opacity:1}50%{opacity:.55}}}

/* technical detail: ids, codes, hashes behind one closed disclosure */
details.tech{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
details.tech>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:24px;font-size:12px;font-weight:500;color:var(--ink2)}
details.tech>summary::-webkit-details-marker{display:none}
details.tech>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.tech[open]>summary::before{transform:rotate(45deg)}
.tech-list{margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.tech-list>div{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tech-list dt{min-width:140px;color:var(--muted)}
.tech-list dd{margin:0;display:flex;gap:8px;align-items:baseline;min-width:0}
.tech code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}

/* tables: at most 5 columns by default, the rest behind "Show more columns"; stacked below 700px */
.tbl .more{display:none}
details.tbl-more{padding:8px 20px;font-size:12px}
details.tbl-more>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;min-height:24px;color:var(--brand-blue);font-weight:500}
details.tbl-more>summary::-webkit-details-marker{display:none}
details.tbl-more[open] + .tbl-wrap .tbl .more{display:table-cell}
.card h3 .sort-note{font-weight:400;color:var(--muted)}
@media (max-width:700px){
  .tbl-stack thead{display:none}
  .tbl-stack,.tbl-stack tbody,.tbl-stack tr{display:block;width:100%}
  .tbl-stack tr{border-top:1px solid var(--line);padding:8px 0}
  .tbl-stack td{display:flex;justify-content:space-between;gap:12px;border-top:0;padding:4px 16px;text-align:right}
  .tbl-stack td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:500;text-align:left}
  .tbl-stack td:first-child{font-size:14px}
  .tbl-stack td.more{display:none}
  details.tbl-more[open] + .tbl-wrap .tbl-stack td.more{display:flex}
}

/* toggletip: a "?" that opens one short explanation */
.toggletip{position:relative;display:inline-flex;vertical-align:middle}
.tt-btn{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;color:var(--muted);font:inherit;font-size:12px;font-weight:600}
.tt-btn::before{content:"";position:absolute;inset:3px;border:1px solid var(--line2);border-radius:50%}
.tt-btn:hover{color:var(--ink)}
.tt-pop{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:60;width:280px;max-width:calc(100vw - 32px);padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink2);box-shadow:0 8px 24px rgba(17,24,39,.12);font-size:13px;font-weight:400;line-height:1.5;text-align:left;white-space:normal}
.tt-pop.right{left:auto;right:0;transform:none}
.tt-pop[hidden]{display:none}

/* menus and dialogs */
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:60;display:flex;flex-direction:column;min-width:240px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 8px 24px rgba(17,24,39,.12)}
.menu-pop.right{left:auto;right:0}
.menu-pop[hidden]{display:none}
.menu-pop a,.menu-pop button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap}
.menu-pop a:hover,.menu-pop button:hover,.menu-pop a.on{background:var(--soft)}
.menu-pop .mh{padding:8px 12px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.menu-pop .msep{height:1px;margin:4px 0;background:var(--line)}
.dialog{max-width:440px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 32px rgba(17,24,39,.16)}

/* the top bar (ui/chrome.js): wordmark, six goals, then client, sample data, help and user */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.tb-row{max-width:1440px;margin:0 auto;min-height:56px;padding:0 24px;display:flex;align-items:center;gap:16px}
.wordmark{flex:none;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.topnav{display:flex;align-items:center;min-width:0}
.topnav>ul{display:flex;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
.tn-item{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--ink2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tn-item:hover{background:var(--soft);color:var(--ink)}
.tn-item.on{background:var(--soft);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand-blue)}
.tn-item .chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.tb-context{position:relative;margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-utils{display:flex;align-items:center;gap:8px}
.tb-menu-btn{display:none}
@media (max-width:700px){
  .tb-row{padding:0 16px;gap:8px;flex-wrap:wrap}
  .tb-c{display:none}
  .tb-menu-btn{display:inline-flex}
  .topbar.open .tb-c{display:flex;order:10;width:100%;flex-direction:column;align-items:stretch;padding:8px 0}
  .topbar.open .topnav>ul{flex-direction:column;align-items:stretch}
  .topbar.open .tn-item{width:100%;justify-content:space-between}
  .topbar.open .menu-pop{position:static;box-shadow:none;border:0;padding:0 0 0 12px;min-width:0}
  .topbar.open .tb-utils{border-top:1px solid var(--line)}
}
/* dark mode: no light slabs; the active tab and the stage pills read as tinted surfaces */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tab.on{background:var(--soft);border-color:var(--line2);border-top:3px solid var(--c,var(--brand-blue));color:var(--ink)}
  :root:not([data-theme="light"]) .stage-pill{background:var(--soft);color:var(--ink);border-top:3px solid var(--c,var(--line2))}
  :root:not([data-theme="light"]) .stage-pill .n{color:var(--muted)}
}
:root[data-theme="dark"] .tab.on{background:var(--soft);border-color:var(--line2);border-top:3px solid var(--c,var(--brand-blue));color:var(--ink)}
:root[data-theme="dark"] .stage-pill{background:var(--soft);color:var(--ink);border-top:3px solid var(--c,var(--line2))}
:root[data-theme="dark"] .stage-pill .n{color:var(--muted)}
/* ==== end v1 foundation ==== */
/* ==== v1 screens: the prototype's own layouts, drawn on the foundation above ==== */
.notice-card{max-width:720px}
.notice-card p{margin:0;padding:12px 20px 0;line-height:1.55;color:var(--ink2)}
.notice-card p:last-child{padding-bottom:16px}
/* the top bar's utilities: sample data chip, help and user */
.tb-user{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tb-user .ur{font-size:12px;font-weight:400;color:var(--muted)}
/* verdict first: every results screen opens with one sentence and one primary action */
.verdict{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding:16px 20px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px}
.verdict .vtext{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:760px}
.verdict .vstate{font-size:12px;font-weight:600;color:var(--ok)}
.verdict .vstate.warn{color:var(--warn)} .verdict .vstate.bad{color:var(--bad)} .verdict .vstate.wait{color:var(--muted)}
.verdict .vline{margin:0;font-size:20px;font-weight:600;line-height:1.3;color:var(--ink)}
.verdict .vsub{margin:0;font-size:13px;color:var(--ink2);line-height:1.5}
.verdict .vsub .muted{color:var(--muted)}
.verdict .btn-row{flex:none}
.verdict .reason{max-width:360px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.flow.four{grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr}
.stack>details.tech{margin:0}
.card>details.tech{margin:0;padding:12px 20px 16px;border-top:1px solid var(--line)}
details.tech>.tech-body{margin-top:12px;display:flex;flex-direction:column;gap:24px}
details.show-tbl:not([open]) + .tbl-wrap{display:none}
/* Home */
.foryou{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0;font-size:13px;color:var(--ink2)}
.foryou .related{font-weight:500;color:var(--brand-blue)} .foryou .related:hover{text-decoration:underline}
.desc .toggletip{margin-left:4px}
/* Setup: one step at a time; settings for a later release behind one toggle */
.fstep.later{padding:12px 0}
.fstep.later .stepno{background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.fstep.later .flabel{color:var(--ink2)}
.fstep.later .fhint{margin-bottom:0}
.stage-d>summary .sc.changed{color:var(--brand-blue)}
details.later{border-top:1px solid var(--line)}
details.later>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;font-weight:500;color:var(--ink2);background:var(--surface)}
details.later>summary::-webkit-details-marker{display:none}
details.later>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.later[open]>summary::before{transform:rotate(45deg)}
details.later>summary .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.field.advisory{opacity:.62}
.field.advisory .advisory-note{font-size:12px;color:var(--muted);line-height:1.35}
/* Build from raw tables: fewer default columns, finished steps fold to one line, verdict-first build */
.srctbl:not(.more-on) .more,.maps:not(.more-on) .more{display:none}
.srctbl.more-on .srcrow{grid-template-columns:minmax(150px,1.4fr) 104px 168px 152px 152px}
.maps.more-on .maprow{grid-template-columns:minmax(120px,160px) 18px 190px minmax(120px,1fr) 92px 72px}
.srcbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.srcbar details.tbl-more{padding:0}
.mex{display:flex;align-items:center;gap:8px;min-width:0}
.obact.top{margin:4px 0 12px}
.obverdict{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:12px 16px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.obverdict .ov{display:flex;flex-direction:column;gap:4px}
.obverdict .ov1{font-size:14px;font-weight:600;color:var(--ink)}
.obverdict .ov2{font-size:12px;color:var(--muted)}
.obbody details.tech{margin-top:12px}
@media (max-width:1100px){.srctbl.more-on .srcrow,.maps.more-on .maprow{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.flow.four{grid-template-columns:1fr}}
@media (max-width:700px){.timeline{grid-template-columns:1fr;min-width:0;row-gap:24px}.timeline-wrap{margin-top:24px}
.stage-col:not(:last-child) .stage-pill::after{content:none}.kpis.two{grid-template-columns:1fr}
.verdict .btn-row,.verdict .btn-row .btn{width:100%}}
.setup-form{margin-top:18px}
.flabel .opt{font-weight:400;color:var(--muted)}
.kv.first{border-top:0}
.row.one{grid-template-columns:1fr}
.block .bstate.waiting{color:var(--muted)}
.rule + .hint{margin-top:0}
.hint + .uindex{margin-top:12px}
.lnode .l2{color:var(--muted)}
/* screens the prototype only names: Build data, Campaigns, Reports and the product's own pages */
.list-card .tbl-wrap td .btn{white-space:nowrap}
/* ==== end v1 screens ==== */
</style>

  const t=document.querySelector(`[data-menu="${id}"]`);if(t){t.setAttribute("aria-expanded","false");if(focus)t.focus();}}
function closeTips(except){document.querySelectorAll("[data-toggletip][aria-expanded='true']").forEach(b=>{if(b===except)return;b.setAttribute("aria-expanded","false");if(b.nextElementSibling)b.nextElementSibling.hidden=true;});}

  if(t.closest("[data-skip]")){e.preventDefault();document.getElementById("app").focus();return;}
  const m=t.closest("[data-menu]");
  if(m){const id=m.dataset.menu,opening=TB.menu!==id;closeMenus();if(opening){TB.menu=id;m.setAttribute("aria-expanded","true");const p=document.getElementById(id);if(p)p.hidden=false;}return;}

  if(panel){TB.panel=!TB.panel;panel.setAttribute("aria-expanded",String(TB.panel));document.getElementById("pb-bar").classList.toggle("open",TB.panel);return;}
  const tip=t.closest("[data-toggletip]");
  if(tip){const open=tip.getAttribute("aria-expanded")!=="true";closeTips(tip);tip.setAttribute("aria-expanded",String(open));if(tip.nextElementSibling)tip.nextElementSibling.hidden=!open;return;}
  const copy=t.closest("[data-copy]");
  if(copy){try{navigator.clipboard.writeText(copy.dataset.copy).then(()=>{copy.textContent="Copied";},()=>{});}catch(err){}return;}

  return PTYPES[0];}

function mock(u, kind){
  const NAMES = {data:"Data",model:"Model",output:"Output",campaign:"Campaign results"};
  const K = NAMES[kind], up = upliftRun(u), cur = st(u).current;
  const title = kind==="model"&&(up||u.up) ? `${u.name} uplift model` : {data:u.d,model:u.m,output:u.o,campaign:"Campaign results"}[kind];

  const camp = u.id==="win-back-campaign"&&(kind==="campaign"||!!(cur&&cur.mode==="score"));
  /* v1: tabs are words only (no 01/02/03); the run's id and file go to Details at the foot of the page */
  const order = ["data","model","output",...(camp?["campaign"]:[])];

  const nextKind = order[order.indexOf(kind)+1];

  else if(kind==="model"&&up){ body = upliftModelBlock(u); }

          <span class="rl">Actual −</span><div class="cell"><b>${x.cm[2]}</b><small>False positive</small></div><div class="cell good"><b>${x.cm[3]}</b><small>True negative</small></div>

    const base=x.base.replace(/^baseline \((.*)\)$/,"$1");

    <div class="tabs-bar"><nav class="tabs" aria-label="Pipeline">${tabs}</nav><span class="note">Illustrative sample, AWS reference stack</span></div>
    <div class="stack">${body}
    ${run&&kind!=="campaign"?techDetails([["Run id",run.id],["Dataset file",run.file],["Recorded",run.at]],"Details: this run"):""}</div>
  </main>`;
}
/* The one sentence each Output page leads with (the illustrative sample's own numbers). */
const OUT_VERDICT={
 "targeted-advertisement":"184K customers are worth showing the ad to: the top three deciles convert 1.8 to 3.2 times more often than average.",
 "ai-onboarding-assistant":"The assistant settles 78% of onboarding questions without a person.",
 "order-fulfillment":"1,340 orders are at risk of missing their delivery date. Act on them before the customer notices.",
 "fault-prediction":"412 assets are likely to fail in the next 72 hours. Service the critical ones first.",
 "payment-propensity":"9.2K accounts are likely to pay late. Remind them before the due date.",
 "rca":"6.8K customers are at risk of leaving, most of them because of network issues.",
 "win-back-campaign":"14.5K churned customers can get a win-back offer, with a personal message each."};

/* A CSV of what the screen shows, saved by the browser. */
function downloadCsv(name,cols,rows){const csv=[cols.join(","),...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n");
  try{const b=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){}}
function downloadMessages(){const rows=copyCards().filter(c=>tplStatus(c)==="Approved");
  const csv=["band,channel,variant,offer,message",...rows.map(c=>[c.band,c.ch,c.v,c.offer,c.text]
    .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n");
  try{const b=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="winback_messages_approved.csv";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){}}
function bindGlobal(){
  /* v1: links that open a use case's Setup in a given state (Build data → raw tables; a model page → score mode) */
  document.querySelectorAll("[data-go-raw]").forEach(a=>a.addEventListener("click",()=>{const u=UC.find(x=>x.id===a.dataset.goRaw);if(!u)return;
    const s=st(u);s.view="setup";s.mode="train";if(s.source!=="raw"){s.source="raw";s.file=null;s.cols=[];s.preview=null;s.pk="";s.target="";const o=onb(u);if(!o.open)o.open=1;}}));
  document.querySelectorAll("[data-go-score]").forEach(a=>a.addEventListener("click",()=>{const m=location.hash.match(/^#\/(uc|uplift)\/([^/]+)/),b=m&&UC.find(x=>x.id===m[2]);if(!b)return;
    const s=st(m[1]==="uplift"?upView(b):b);s.view="setup";if(s.mode!=="score"){s.mode="score";s.file=null;s.cols=[];s.preview=null;s.target="";s.pk="";s.treatment="";s.targeted=false;s.ack=false;}}));
  const g=document.getElementById("rca-gen");
  if(g)g.addEventListener("click",()=>{RCA_ON=true;render();});
  const appr=document.getElementById("cc-approver");
  if(appr)appr.addEventListener("input",e=>{COPY_APPROVER=e.target.value;
    const named=COPY_APPROVER.trim();
    document.querySelectorAll("[data-cc-ok]").forEach(b=>{
      const c=copyCards()[+b.dataset.ccOk];b.disabled=!(named&&tplStatus(c)==="Pending review");});});
  document.querySelectorAll("[data-cc-ok]").forEach(b=>b.addEventListener("click",()=>{
    const c=copyCards()[+b.dataset.ccOk];
    if(!COPY_APPROVER.trim()||tplStatus(c)!=="Pending review")return;
    c.status="Approved";c.by=COPY_APPROVER.trim();c.at=nowStamp();render();}));
  document.querySelectorAll("[data-cc-re]").forEach(b=>b.addEventListener("click",()=>{
    const c=copyCards()[+b.dataset.ccRe],t=c.text;c.text=c.alt;c.alt=t;
    c.status="Pending review";c.why="";c.by="";c.at="";render();}));
  const d=document.getElementById("cc-dl");
  if(d)d.addEventListener("click",downloadMessages);
  /* Phase 3b §8: uplift output and the campaign results page */
  const m=location.hash.match(/^#\/(uc|uplift)\/([^/]+)\//),u0=m&&UC.find(x=>x.id===m[2]);if(!u0)return;
  const u=m[1]==="uplift"?upView(u0):u0;
  const s=st(u),$i=id=>document.getElementById(id),on=(id,ev,fn)=>{const el=$i(id);if(el)el.addEventListener(ev,fn);};
  on("up-dl","click",()=>downloadTreatList(u));
  on("f-download-out","click",()=>downloadCsv(`${u.id.replace(/-/g,"_")}_contact_list.csv`,u.out.cols,u.out.rows));
  on("up-null","click",()=>{UP_NULL_VIEW=!UP_NULL_VIEW;UP_NULL_HASH=location.hash;render();});
  on("cr-run","change",e=>{s.cr.run=e.target.value;render();});
  on("cr-sample","click",()=>{s.cr.outcomes=true;s.cr.sample=true;s.cr.file=CAMPAIGN_OUTCOMES.file;render();});
  on("cr-file","change",e=>{const f=e.target.files[0];if(!f)return;s.cr.outcomes=true;s.cr.sample=false;s.cr.file=f.name;render();});
  on("cr-window","change",e=>{s.cr.window=Math.max(1,Math.min(3650,+e.target.value||90));render();});
  on("cr-datecol","change",e=>{s.cr.dateCol=e.target.value;render();});}

/* ===== v1: the goal screens the top bar opens (Build data, Campaigns, Reports), drawn from the sample ===== */
const listTable=(cols,rows)=>`<div class="tbl-wrap"><table class="tbl tbl-stack"><thead><tr>${cols.map(c=>`<th scope="col"${c.num?' class="num"':""}>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,j)=>`<td data-label="${esc(cols[j].label)}"${cols[j].num?' class="num"':""}>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function buildDataScreen(){
  const pred=UC.filter(u=>!SETUP[u.id].gen);
  return `<main class="screen">${pageHead(`${crumbs([{label:"Build data"}])}<h1 class="h1">Build data</h1><p class="desc">Get your data ready: ask your IT team for the tables, then build a dataset for any use case that predicts something.</p>`)}
    <div class="stack">
    <section class="card list-card"><h3>Build a dataset from raw tables</h3>${listTable([{label:"Use case"},{label:"Stage"},{label:""}],
      pred.map(u=>[esc(u.name),esc(u.stage),`<a class="btn secondary sm" href="#/uc/${u.id}" data-go-raw="${u.id}">Start with raw tables</a>`]))}</section>
    <section class="card notice-card"><h3>Data request kit</h3><p>The templates list every table and column we need, with a plain description of each. Send them to whoever looks after your customer data.</p>
      <div class="notice-actions"><button type="button" class="btn secondary sm" id="pe-kit">Download the kit (ZIP)</button></div>
      ${techBlock("For your IT team",`<p class="obhint">Before sending anything, run the pre-flight check on your own machine. Nothing is uploaded.</p><p class="mono"><code>python -m scripts.preflight &lt;folder&gt; --use-case &lt;use case&gt;</code></p>`)}</section>
    <section class="card list-card"><h3>Data readiness reports <span class="sort-note">(newest first)</span></h3>${listTable([{label:"Report"},{label:"Checked on"},{label:"Result"},{label:""}],
      [["Customer tables · Demo Telecom","20 Sep 2026",'<span class="pill ok">Ready</span>','<a class="btn quiet sm" href="#/pilot/view/readiness/demo">Open</a>']])}</section>
    </div></main>`;}
function campaignsScreen(){
  const rows=[];
  UC.forEach(u=>[u,upView(u)].forEach(v=>{if(v.up&&!upliftOffered(u))return;
    st(v).runs.filter(r=>r.mode==="score"&&(r.ptype==="Uplift")===!!v.up).forEach(r=>rows.push([r,v]));}));
  const wb=UC.find(u=>u.id==="win-back-campaign");
  const status=(r,v)=>{if(baseUC(v).id!==wb.id)return '<span class="pill warn">No results yet</span>';
    const on=addDays(r.date,st(v).cr.window);return on<=today()?'<span class="pill ok">Ready to measure</span>':`<span class="pill warn">Results on ${fmtDay(on)}</span>`;};
  const body=[...rows.reverse().map(([r,v])=>[esc(v.up?`${v.name} · Uplift`:v.name),esc(r.at.split(",")[0]),`<span class="tnum">${esc(r.rows)}</span>`,status(r,v),`<a class="btn quiet sm" href="${pageHref(v,baseUC(v).id===wb.id?"campaign":"output")}">${baseUC(v).id===wb.id?"Add results":"Who to contact"}</a>`]),
    [esc(wb.name),esc(CAMPAIGN_SEED.at),`<span class="tnum">${esc(CAMPAIGN_SEED.rows)}</span>`,'<span class="pill ok">Ready to measure</span>',`<a class="btn quiet sm" href="${pageHref(wb,"campaign")}">View results</a>`]];
  return `<main class="screen">${pageHead(`${crumbs([{label:"Campaigns"}])}<h1 class="h1">Campaigns</h1><p class="desc">Every list you scored, and whether you can see yet what the campaign changed.</p>`)}
    <div class="stack"><section class="card list-card"><h3>Scored lists <span class="sort-note">(newest first)</span></h3>${listTable([{label:"Use case"},{label:"Scored on"},{label:"Customers scored",num:true},{label:"Results"},{label:""}],body)}</section></div></main>`;}
function reportsScreen(){
  const rows=UC.flatMap(u=>st(u).runs.filter(r=>r.mode==="train"&&r.ptype!=="Uplift").map(r=>[esc(u.name),esc(r.at.split(",")[0]),r.champion?'<span class="pill ok">In use</span>':'<span class="pill warn">Candidate</span>',`<a class="btn quiet sm" href="${pageHref(u,"model")}">Open</a>`]));
  return `<main class="screen">${pageHead(`${crumbs([{label:"Reports"}])}<h1 class="h1">Reports</h1><p class="desc">Model results and campaign value, ready to open or save as a PDF.</p>`)}
    <div class="stack"><section class="card list-card"><h3>Model results <span class="sort-note">(newest first)</span></h3>${listTable([{label:"Use case"},{label:"Trained on"},{label:"Status"},{label:""}],rows)}</section>
    <section class="card list-card"><h3>Campaign value</h3>${emptyState({title:"No campaign value report yet",text:"Measure a campaign's results first; its value in rupees appears here.",action:{label:"Go to Campaigns",href:"#/monitoring/runs"}})}</section></div></main>`;}
/* A product screen the prototype names in the top bar but does not draw: one calm card and a way home. */
const PRODUCT_SCREENS={approvals:"Waiting for approval",monitoring:"Model health",generative:"AI assistant and root-cause notes",admin:"Admin",privacy:"Privacy",account:"Change your password",pilot:"Reports"};
function productScreen(parts){const name=parts[0]==="generative"&&parts[1]==="connection"?"AI service":parts[0]==="admin"?(parts[1]==="audit"?"Audit log":"Users"):parts[0]==="pilot"&&parts[1]==="value"?"Value in rupees":PRODUCT_SCREENS[parts[0]]||"This screen";
  return `<main class="screen">${pageHead(`${crumbs([{label:name}])}<h1 class="h1">${esc(name)}</h1>`)}
    ${noticeCard({title:"Drawn by the product, not by this prototype",text:[`${name} follows the same patterns as every screen here: the page header, a verdict first, plain words, and technical detail behind Details.`,"See docs/ui/after for how it looks in the product."],action:{label:"Back to Home",href:"#/"}})}</main>`;}
function render(){
  if(UP_NULL_VIEW&&location.hash!==UP_NULL_HASH)UP_NULL_VIEW=false;
  const parts = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const app = document.getElementById("app");
  /* a redraw of the same screen keeps what a person opened; a new screen starts closed, at the top */
  const same = render.last===location.hash, kept = same?[...app.querySelectorAll("details[data-keep][open]")].map(d=>d.dataset.keep):[];
  if(!same){TB.menu=null;TB.panel=false;}
  render.last = location.hash;
  let html, t = "Marketing AI · Minfy", after = null;
  if(parts[0]==="pilot"&&parts[1]==="kit"){ html = buildDataScreen(); t = "Build data · Marketing AI"; }
  else if(parts[0]==="pilot"&&!parts[1]){ html = reportsScreen(); t = "Reports · Marketing AI"; }
  else if(parts[0]==="monitoring"&&parts[1]==="runs"){ html = campaignsScreen(); t = "Campaigns · Marketing AI"; }
  else if(PRODUCT_SCREENS[parts[0]]){ html = productScreen(parts); t = "Marketing AI · Minfy"; }
  else if(parts[0]==="uc"){
    const u = UC.find(x=>x.id===parts[1]);
    if(!u){ html = overview(); }
    else if(["data","model","output"].includes(parts[2])){ html = mock(u,parts[2]); t = `${u.name} · ${parts[2][0].toUpperCase()+parts[2].slice(1)} · Marketing AI`; }
    else if(parts[2]==="campaign"&&u.id==="win-back-campaign"){ html = mock(u,"campaign"); t = `${u.name} · Campaign results · Marketing AI`; }
    else { html = detail(u); t = `${u.name} · Marketing AI`; after = () => bindDetail(u); }
  } else if(parts[0]==="uplift"){
    /* DEC-608: the uplift screens, reached from the use case's "Uplift for this use case" link */
    const b = UC.find(x=>x.id===parts[1]), u = b&&upliftOffered(b)?upView(b):null;
    if(!u){ html = upliftIndex(); t = "Uplift · Marketing AI"; }
    else if(["data","model","output","campaign"].includes(parts[2])){ html = mock(u,parts[2]); t = `${u.name} · Uplift · ${{data:"Data",model:"Model",output:"Output",campaign:"Campaign results"}[parts[2]]} · Marketing AI`; }
    else { html = detail(u); t = `${u.name} · Uplift · Marketing AI`; after = () => bindDetail(u); }
  } else html = overview();
  app.style.animation="none"; void app.offsetWidth; app.style.animation="";
  app.innerHTML = html; document.title = t;
  app.querySelectorAll("details[data-keep]").forEach(d=>{if(kept.includes(d.dataset.keep))d.open=true;});
  paintTopBar(); if(after) after(); bindGlobal(); if(!same) window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
