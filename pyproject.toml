[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketing-ai"
version = "0.1.0"
description = "A reusable marketing AI engine: one engine, many use cases, all configuration."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "autogluon.tabular[lightgbm,xgboost,catboost]==1.6.3",
  "shap==0.51.0",
  "pandas==2.3.3",
  "pyarrow==24.0.0",
  "scikit-learn==1.9.1",
  "imbalanced-learn==0.14.2",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "python-multipart==0.0.32",
  "sqlmodel==0.0.42",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",

  # ========================================================================
  # Shared file (PARALLEL_WORK_PROTOCOL.md §4). Add a dependency inside your
  # own block and pin it exactly. Never bump a pin above this comment
  # (pandas, pydantic, FastAPI, AutoGluon and the rest are shared): request
  # the bump in docs/CROSS_BRANCH_REQUESTS.md instead.
  # ========================================================================

  # ---- PHASE-2 (onboarding) — append only below this line ----
  "duckdb==1.5.5",                      # in-process SQL for the point-in-time feature aggregations (plan §2.2)
  "rapidfuzz==3.14.6",                  # fuzzy column-name similarity for mapping suggestions (plan §6.1)
  # ---- END PHASE-2 ----

  # ---- PHASE-3A (generative) — append only below this line ----
  # Phase 3a, the generative features. No orchestration framework: chunking, retrieval and the
  # vector store are forty lines each and a framework would hide them (Phase 3a plan §2.2).
  "boto3==1.43.99",                     # Bedrock Converse + embeddings; the only LLM client
  "jinja2==3.1.6",                      # sandboxed rendering of prompts and of copy templates
  "pypdf==6.19.0",                      # reads PDFs; it does not write them (DEC-207)
  "python-docx==1.2.0",                 # reads DOCX
  "markdown-it-py==4.2.0",              # reads Markdown with its headings intact
  # ---- END PHASE-3A ----

  # ---- PHASE-4A (aws) — append only below this line ----
  # ---- END PHASE-4A ----

  # ---- PHASE-3B (uplift) — append only below this line ----
  # ---- END PHASE-3B ----
]

[project.optional-dependencies]
nn = ["torch>=2.10,<2.14"]              # enables the NeuralNet family (NN_TORCH); multi-GB; off by default (DEC-011)
aws = [                                 # Phase 4a: what an AWS deployment needs and a laptop does not (DEC-306)
  "boto3==1.43.99",                     # already resolved transitively by autogluon-common; declared so it is pinned here too
  "botocore==1.43.99",
  "psycopg[binary]==3.3.6",             # metadata_backend=postgres only
  "alembic==1.20.0",                    # owns the Postgres schema from 0001 on (DEC-338)
]
deploy = [                              # Phase 4a: synthesising infra/, never imported by engine/ or api/ (DEC-364)
  "aws-cdk-lib==2.270.0",
  "constructs==10.8.1",
  "cdk-nag==2.38.2",                    # 3.0.2 is incompatible with aws-cdk-lib 2.270.0; measured, see DEC-366
]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "httpx==0.28.1",
  "ruff==0.16.8",
  "black==26.5.1",
  "mypy==2.3.1",
  "pandas-stubs==3.0.5.260914",
  "types-PyYAML==6.0.12.20260906",
  "playwright==1.56.0",                 # drives plan §11's acceptance journey through the real screens
                                        # (tests/integration/test_acceptance.py). Pinned exactly because the
                                        # package and the browser build are one unit: 1.56 is Chromium 1194,
                                        # and a bump needs a matching `playwright install`. Absent it, that
                                        # module skips rather than fails.
  "boto3-stubs[bedrock-runtime]==1.43.99",   # boto3 ships no py.typed; the other four Phase 3a deps do
  # Phase 4a. The fast suite exercises the AWS backends offline, so everything the `aws` extra
  # declares is also a dev dependency, plus the fakes and the stubs that keep mypy --strict clean.
  # `types-boto3` is the same project as `boto3-stubs` under its newer name; the two sets of service
  # stubs live in different module namespaces (`types_boto3_s3` and `mypy_boto3_bedrock_runtime`),
  # so both are declared rather than one being made to cover the other's services.
  "boto3==1.43.99",
  "botocore==1.43.99",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "moto[s3,ssm,secretsmanager,sagemaker,sts,kms,logs]==5.2.3",
  "types-boto3[s3,ssm,secretsmanager,sagemaker,cloudwatch]==1.43.99",
]

[project.scripts]
marketing-ai-templates = "scripts.gen_templates:main"
marketing-ai-apidocs   = "scripts.gen_api_docs:main"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["engine", "api", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "ANN", "TID", "RUF"]
ignore = [
  "ANN401",                             # dict[str, Any] is unavoidable at the YAML/JSON boundary
  "E501",                               # verbatim prototype help strings are longer than the line limit
  "E203",                               # conflicts with black's slice formatting
  "RUF001",                             # verbatim prototype copy contains en dashes, middle dots and arrows
  "RUF002",                             # the same characters appear inside docstrings
  "RUF003",                             # the same characters appear inside comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["engine", "api", "scripts"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true                           # engine, api AND scripts (plan §13.6 minimum is engine/; DEC-013)
files = [
  "engine",
  "api",
  "scripts",
  "alembic",                            # the migrations own the Postgres schema, so they are held to the same bar
  "tests/fixtures/make_data.py",
  "tests/fixtures/make_docs.py",
  "tests/fakes",                        # FakeSageMaker stands in for a service (DEC-041, DEC-206's precedent)
]                                       # source dirs, plus the synthetic generators and the service fakes: test
                                        # infrastructure every later milestone builds on. Other tests are not
                                        # type-checked; no per-module `strict` anywhere (it is not a per-module option).
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]                 # the ONLY override: ENV_FACTS measured these as the sole strict-mode failures
module = ["autogluon.*", "shap.*", "sklearn.*", "imblearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                      # import engine/api/scripts from the checkout, with or without an editable install
addopts = "-q --strict-markers -rs"     # `-rs` prints every skip WITH ITS REASON: a test that is not
                                        # running must say so out loud, never silently (DEC-344)
markers = [
  "slow: takes more than a few seconds (AutoGluon training); excluded from `make test`",
  "integration: exercises several modules, the filesystem or the API together",
  "bedrock: calls Amazon Bedrock for real; costs money, needs credentials, opt-in with `-m bedrock`",
  "postgres: needs a PostgreSQL server (`make postgres-up`); skips with a reason when there is none",
  "docker: needs a working Docker daemon and a pullable base image; skips with a reason when there is none",
  "aws: talks to a real AWS account; never selected by default, run by hand against a dev account",
]
