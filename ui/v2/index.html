<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Autonomy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E57BD'/%3E%3Cpath d='M9 23 16 8l7 15' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a id="skip-link" class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <div class="topbar-row">
        <a class="wordmark" href="#/goal" aria-label="Autonomy, home">
          <span class="wordmark-mark" aria-hidden="true">A</span>
          <span class="wordmark-text">Autonomy</span>
        </a>
        <div class="goal-switcher">
          <label for="goal-select" class="visually-hidden">Current goal</label>
          <select id="goal-select" disabled>
            <option>Loading goals…</option>
          </select>
        </div>
        <div class="topbar-actions">
          <a id="inbox-link" class="inbox-link" href="#/live" aria-label="Alerts inbox">
            <span aria-hidden="true">Inbox</span>
            <span id="inbox-count" class="count" hidden></span>
          </a>
          <button id="pause-button" type="button" class="btn btn-danger" disabled>Pause</button>
        </div>
      </div>
      <nav class="nav" aria-label="Screens">
        <ol id="nav-list" class="nav-list"></ol>
        <a id="operator-link" class="operator-link" href="#/operator">Operator mode</a>
      </nav>
    </header>
    <div id="mode-banner" class="mode-banner" role="status" hidden></div>
    <main id="main" class="main" tabindex="-1">
      <noscript><p>Autonomy needs JavaScript to run.</p></noscript>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
