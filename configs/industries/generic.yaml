schema_version: 1
id: generic
name: Every business
journey_label: Customer Lifecycle          # str; overview subtitle and breadcrumb root

# Plan H M81 (DEC-1110, DEC-1111): one journey for every business, and the one Home shows. Its stages
# are the customer lifecycle the product was built around (Awareness > Onboarding > Service /
# Payments > Churn > Win-back), with each stage's name equal to the `lifecycle_stage` of every use
# case below it. The other industry files stay loadable; Home no longer offers a choice.
# (DEC-1121 restored these stage names after DEC-1110's first version had renamed them into goals;
# DEC-1124 took out the four use cases from other industries that had been added under them.)

stages:                                    # ordered; the overview renders them left to right
  - id: awareness
    name: Awareness
    ai_type: predictive
    use_cases:
      - {id: targeted-advertisement, status: available}
  - id: onboarding
    name: Onboarding
    ai_type: generative
    use_cases:
      - {id: ai-onboarding-assistant, status: available}
  - id: service_payments
    name: Service
    ai_type: predictive
    use_cases:
      - {id: order-fulfillment,  status: available}
      - {id: fault-prediction,   status: available}
      - {id: payment-propensity, status: available}
  - id: churn
    name: Churn
    ai_type: hybrid
    use_cases:
      - {id: rca,         status: available}
      - {id: telco-churn, status: available}
  - id: win_back
    name: Win-back
    ai_type: hybrid
    use_cases:
      - {id: win-back-campaign, status: available}
