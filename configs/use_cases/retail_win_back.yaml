id: retail-win-back
name: Retail Win-back
description: Ranks customers who have stopped buying by how likely they are to order again, so a win-back budget goes to the ones an offer can actually move.
lifecycle_stage: Win-back
entity: shopper                            # the engine's copy says "one row per shopper"

# UCI Online Retail, a 541,909-line invoice log from a UK gift retailer, aggregated to one row per
# lapsed customer by library/online-retail/fetch.py. Every feature below is an aggregate of that
# customer's own invoices on or before the 2011-09-10 snapshot; `reactivated_90d` is the only thing
# read from after it. When Phase 2's aggregation lands, that script becomes a mapping file.

target:
  column: reactivated_90d
  positive_label: 1
  definition: The shopper placed another order in the 90 days after the snapshot
  label_source: UCI Online Retail invoice log, derived (see library/online-retail/fetch.py)

primary_key_hints: [customer_id, shopper_id, id]

# The file is a single snapshot, so `snapshot_date` is the same date in every row and the split
# stays random_stratified (the engine default). A dataset built from a raw order log has one row per
# shopper per month-end (v3 phase 0, the Data Doctor's order-log path), so it is split by time:
# `built_split` below, which only that path reads.

model_search:
  metric: pr_auc                           # 41% of this audience comes back, but the business question is
                                           # "who is worth an offer", so ranking quality on the positives is
                                           # what the search optimises

actions:
  score_field: winback_prob
  bands:
    - {name: High,   min_score: 0.80, action: "Best offer + free delivery"}
    - {name: Medium, min_score: 0.50, action: "Standard offer"}
    - {name: Low,    min_score: 0.00, action: "Newsletter only"}
  suppression:
    opt_out_column: null                   # the public log carries no consent or contact history
    recently_contacted_column: null

output:
  kpi:
    label: "Shoppers worth an offer"
    formula: 'count_where_band_in(["High","Medium"])'

ui:
  pages:
    data: "Purchase history at the snapshot"
    model: "Win-back Propensity Model"
    output: "Win-back List / Offers"

template:
  columns:
    - {name: customer_id,              role: primary_key, type: string,  description: "Unique shopper identifier from the invoice log. Never used as a feature.",  examples: ["12346","12839","13047","15311","17850"]}
    - {name: snapshot_date,            role: time,        type: date,    description: "Date the features describe the shopper as of. Nothing after it may be used.", examples: ["2011-09-10","2011-09-10","2011-09-10","2011-09-10","2011-09-10"]}
    - {name: country,                  role: feature,     type: string,  description: "Country the shopper usually orders from",                                     examples: ["United Kingdom","United Kingdom","France","Germany","EIRE"]}
    - {name: recency_days,             role: feature,     type: integer, description: "Days between the shopper's last order and the snapshot. At least 90 by construction - this file is the lapsed audience.", examples: ["91","118","164","203","282"]}
    - {name: tenure_days,              role: feature,     type: integer, description: "Days between the shopper's first order and the snapshot",                      examples: ["91","172","215","260","282"]}
    - {name: orders_total,             role: feature,     type: integer, description: "Distinct orders placed on or before the snapshot",                             examples: ["1","2","3","6","12"]}
    - {name: items_total,              role: feature,     type: integer, description: "Items bought on or before the snapshot, summed over every order",              examples: ["12","74","168","430","2104"]}
    - {name: distinct_products,        role: feature,     type: integer, description: "Distinct product codes bought on or before the snapshot",                      examples: ["1","8","19","52","134"]}
    - {name: active_months,            role: feature,     type: integer, description: "Calendar months in which the shopper placed at least one order",               examples: ["1","1","2","4","7"]}
    - {name: spend_total,              role: feature,     type: float,   description: "Total order value on or before the snapshot",                                   examples: ["25.50","148.20","318.70","961.44","5310.28"]}
    - {name: order_value_mean,         role: feature,     type: float,   description: "Mean value of the shopper's orders",                                            examples: ["25.50","74.10","246.98","320.48","442.52"]}
    - {name: order_value_max,          role: feature,     type: float,   description: "Value of the shopper's largest order",                                          examples: ["25.50","96.80","287.89","512.30","1840.75"]}
    - {name: days_between_orders_mean, role: feature,     type: float,   description: "Mean days between consecutive orders; 0 when the shopper ever placed only one", examples: ["0.0","0.0","31.5","47.25","184.0"]}
    - {name: returned_orders,          role: feature,     type: integer, description: "Orders the shopper cancelled or returned on or before the snapshot",            examples: ["0","0","1","2","5"]}
    - {name: returned_items,           role: feature,     type: integer, description: "Items returned on or before the snapshot",                                      examples: ["0","0","3","24","180"]}
    - {name: reactivated_90d,          role: target,      type: integer, description: "Target: 1 when the shopper ordered again within 90 days of the snapshot, else 0. Leave blank when scoring.", examples: ["0","1","0","1","1"]}

# --- v3 phase 0: the Data Doctor's order-log path ------------------------------------------------
# Read only when a dataset is built from a raw order log (docs/plans/DATA_DOCTOR_EVENT_LOG_PATH.md, behind
# `data_doctor.order_log`). The path rolls the log up into three event tables, deterministically:
#   orders       one row per order: the shopper, the earliest timestamp, `order_value` (quantity x price over
#                its lines with a quantity above zero), `quantity` (units on those lines), `order_month`,
#                `days_since_previous_order` (the shopper's earlier orders only) and `country` when the log has one
#   order_lines  one row per line with a quantity above zero: `product_code`, `quantity`, `line_value`
#   returns      one row per order with lines of a quantity below zero: `quantity`, as a positive number
# An order is a line with a quantity above zero; the `C` prefix of a cancelled invoice is evidence, not the rule.

label:
  name: reactivated_90d
  type: event_presence
  role: orders
  horizon_days: 90
  where: {column: quantity, op: gt, value: 0}
  description: The shopper placed an order within 90 days of the snapshot.

audience:                               # who the outcome is measured for: shoppers who have stopped buying
  role: orders
  no_event_days: 90

built_split:                            # a built dataset has several month-ends; the newest rows are the test
  type: time_based
  time_column: snapshot_date

suggested_features:
  - {name: recency_days,             role: orders,      function: days_since_last, description: "Days between the shopper's last order and the snapshot."}
  - {name: tenure_days,              role: orders,      function: days_since_first, description: "Days between the shopper's first order and the snapshot."}
  - {name: orders_total,             role: orders,      function: count, description: "Orders placed on or before the snapshot."}
  - {name: spend_total,              role: orders,      function: sum,   column: order_value, description: "Total order value on or before the snapshot."}
  - {name: order_value_mean,         role: orders,      function: mean,  column: order_value, description: "Mean value of the shopper's orders."}
  - {name: order_value_max,          role: orders,      function: max,   column: order_value, description: "Value of the shopper's largest order."}
  - {name: active_months,            role: orders,      function: nunique, column: order_month, description: "Calendar months in which the shopper placed at least one order."}
  - {name: days_between_orders_mean, role: orders,      function: mean,  column: days_since_previous_order, description: "Mean days between consecutive orders; blank when the shopper has placed only one."}
  - {name: country,                  role: orders,      function: latest, column: country, description: "Country of the shopper's latest order."}
  - {name: items_total,              role: order_lines, function: sum,   column: quantity, description: "Items bought on or before the snapshot, summed over every order."}
  - {name: distinct_products,        role: order_lines, function: nunique, column: product_code, description: "Distinct product codes bought on or before the snapshot."}
  - {name: returned_orders,          role: returns,     function: count, description: "Orders with returned or cancelled items on or before the snapshot."}
  - {name: returned_items,           role: returns,     function: sum,   column: quantity, description: "Items returned on or before the snapshot."}

agent:                                  # Plan G: this use case's Guided-setup helper (DEC-1003)
  goal: "Find the lapsed shoppers most likely to order again within 90 days."
  knowledge:
    - "The outcome is another order within 90 days of the snapshot."
    - "Orders placed after the snapshot contain the answer; every spend and order count must be measured before it."
    - "Recency, frequency and spend describe the shopper before the snapshot and are the useful signals."
  column_hints:
    target_synonyms: [reactivated, reordered, returned]
  # Level 3 (M76): a win-back file is often the order log itself, one row per order. With `reshape`
  # the helper offers to combine it into one row per shopper, counting only orders on or before each
  # shopper's snapshot date; it is off in the defaults because most use cases' files are one row per
  # customer already, and a repeating ID there is a mistake to stop on, not a log to combine.
  levels: [clean, derive, reshape]
