id: telco-churn
name: Telco Customer Churn
description: Scores every subscriber on how likely they are to leave, so retention offers reach the accounts most at risk.
lifecycle_stage: Churn
entity: subscriber                       # the engine's copy says "one row per subscriber"; config, not code

# Plan section 10's public-dataset smoke test: the Kaggle Telco Customer Churn file
# (https://www.kaggle.com/datasets/blastchar/telco-customer-churn) mapped to this engine by
# configuration alone. Its column names, its Yes/No target and its missing date column are the
# real-world schema; nothing below asks the engine for new behaviour.

target:
  column: Churn
  positive_label: "Yes"                # the file labels the outcome with strings, not 0/1 (plan section 4.1)
  definition: The subscriber left within the month after the snapshot
  label_source: Kaggle Telco Customer Churn (IBM sample), column Churn

primary_key_hints: [customerID, customer_id, id]

# The file carries no date column, so the split stays random_stratified (the engine default).

actions:
  score_field: churn_prob
  bands:
    - {name: High,   min_score: 0.80, action: "Retention call + targeted offer"}
    - {name: Medium, min_score: 0.50, action: "Contract upgrade offer"}
    - {name: Low,    min_score: 0.00, action: "No action"}
  suppression:
    opt_out_column: null               # the public file carries no consent or contact history
    recently_contacted_column: null

output:
  kpi:
    label: "Subscribers at risk"
    formula: 'count_where_band_in(["High","Medium"])'

ui:
  pages:
    data: "Subscription + billing profile"
    model: "Telco Churn Model"
    output: "Churn Risk / Retention Offers"

template:
  columns:
    - {name: customerID,       role: primary_key, type: string,  description: "Unique subscriber identifier. Never used as a feature.",                 examples: ["1024-KLMNO","2048-PQRST","3072-UVWXY","4096-ABCDE","5120-FGHIJ"]}
    - {name: gender,           role: feature,     type: string,  description: "Female or Male",                                                          examples: ["Female","Male","Male","Male","Female"]}
    - {name: SeniorCitizen,    role: feature,     type: integer, description: "1 if the subscriber is a senior citizen, else 0",                          examples: ["0","0","0","1","0"]}
    - {name: Partner,          role: feature,     type: string,  description: "Has a partner: Yes or No",                                                 examples: ["Yes","No","No","No","No"]}
    - {name: Dependents,       role: feature,     type: string,  description: "Has dependents: Yes or No",                                                examples: ["No","No","No","No","No"]}
    - {name: tenure,           role: feature,     type: integer, description: "Months the subscriber has stayed with the company",                        examples: ["1","34","2","45","8"]}
    - {name: PhoneService,     role: feature,     type: string,  description: "Has phone service: Yes or No",                                             examples: ["No","Yes","Yes","No","Yes"]}
    - {name: MultipleLines,    role: feature,     type: string,  description: "Yes, No, or No phone service",                                             examples: ["No phone service","No","No","No phone service","Yes"]}
    - {name: InternetService,  role: feature,     type: string,  description: "DSL, Fiber optic, or No",                                                  examples: ["DSL","DSL","DSL","DSL","Fiber optic"]}
    - {name: OnlineSecurity,   role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["No","Yes","Yes","Yes","No"]}
    - {name: OnlineBackup,     role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["Yes","No","Yes","No","No"]}
    - {name: DeviceProtection, role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["No","Yes","No","Yes","Yes"]}
    - {name: TechSupport,      role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["No","No","No","Yes","No"]}
    - {name: StreamingTV,      role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["No","No","No","No","Yes"]}
    - {name: StreamingMovies,  role: feature,     type: string,  description: "Yes, No, or No internet service",                                          examples: ["No","No","No","No","Yes"]}
    - {name: Contract,         role: feature,     type: string,  description: "Month-to-month, One year, or Two year",                                    examples: ["Month-to-month","One year","Month-to-month","One year","Month-to-month"]}
    - {name: PaperlessBilling, role: feature,     type: string,  description: "Billed paperlessly: Yes or No",                                            examples: ["Yes","No","Yes","No","Yes"]}
    - {name: PaymentMethod,    role: feature,     type: string,  description: "Electronic check, Mailed check, Bank transfer (automatic), or Credit card (automatic)", examples: ["Electronic check","Mailed check","Mailed check","Bank transfer (automatic)","Credit card (automatic)"]}
    - {name: MonthlyCharges,   role: feature,     type: float,   description: "Amount charged to the subscriber this month",                              examples: ["29.85","56.95","53.85","42.30","99.65"]}
    - {name: TotalCharges,     role: feature,     type: float,   description: "Amount charged to the subscriber in total; blank for a subscriber whose tenure is 0", examples: ["29.85","1889.50","108.15","1840.75","820.50"]}
    - {name: Churn,            role: target,      type: string,  description: "Target: Yes if the subscriber left within the month, else No. Leave blank when scoring.", examples: ["No","No","Yes","No","Yes"]}

# --- Phase 2: onboarding from raw tables ---------------------------------------------------------
# The Kaggle file this use case is mapped to is already one row per subscriber, so onboarding it is
# the `single` snapshot, `label.type: column` path. The schema below is what a *real* telco's raw
# tables get mapped onto: the same columns, but recovered from a customer master plus billing,
# complaint and usage event tables.

standard_schema:
  entity_key: customer_id
  columns:
    - name: tenure_months
      type: numeric
      aliases: [tenure, tnr_mnths, months_active, customer_age_months, tenure_mths, vintage_months]
      description: Months since the customer signed up, as of the snapshot date.
      range: [0, 600]
      derivable: {from_role: entity, expression: "months_between(signup_date, snapshot_date)"}
    - name: signup_date
      type: date
      aliases: [signup_dt, start_date, activation_date, joined_on, acct_open_dt]
      description: When the customer joined. Used to derive tenure and to exclude pre-signup snapshots.
    - name: plan_type
      type: categorical
      aliases: [plan, tariff, package, product, plan_name, contract_type]
      description: The plan the subscriber is on.
      value_aliases: {prepaid: ["pre", "ppd", "pre-paid", "prepay"], postpaid: ["post", "post-paid", "postpay"]}
    - name: region
      type: categorical
      aliases: [circle, zone, state, geo, area]
      description: Where the customer is, as the client's own geography names it.
    - name: monthly_charges
      type: numeric
      aliases: [monthlycharges, mrc, arpu, monthly_bill, rental]
      description: What the subscriber is billed in a normal month.
      range: [0, 100000]
    - name: marketing_opt_in
      type: boolean
      aliases: [opt_in, consent, marketing_consent, dnd_flag, do_not_disturb, dnd]
      description: The customer agreed to marketing contact. A DND-style flag means the opposite and is mapped with negate.
      value_aliases: {"true": ["y", "yes", "1", "t", "allowed", "opted_in"], "false": ["n", "no", "0", "f", "blocked", "opted_out"]}
    - name: last_contacted_at
      type: date
      aliases: [last_contact_dt, last_contacted, last_touch_date, lst_cntct_dt]
      description: Date of the last outbound contact, so recently-contacted rows can be suppressed.

label:
  name: churn_next_60d
  type: event_absence
  role: activity
  horizon_days: 60
  description: No activity of any kind in the 60 days after the snapshot date.

suggested_features:
  - {name: complaints_90d,             role: complaints, function: count,            window_days: 90,  description: "Complaints raised in the last 90 days."}
  - {name: complaints_open_30d,        role: complaints, function: count,            window_days: 30,  where: {column: resolved_time, op: is_null}, description: "Complaints from the last 30 days still unresolved."}
  - {name: days_since_last_complaint,  role: complaints, function: days_since_last,  description: "Days since the subscriber last complained."}
  - {name: avg_bill_6m,                role: bills,      function: mean,  column: amount, window_days: 180, description: "Average bill over six months."}
  - {name: bill_trend_3m_vs_6m,        role: bills,      function: ratio, of: {function: mean, column: amount, window_days: 90}, over: {function: mean, column: amount, window_days: 180}, description: "Recent bills against the six-month average; above 1 means bills are rising."}
  - {name: late_payments_6m,           role: payments,   function: count, window_days: 180, where: {column: days_late, op: gt, value: 0}, description: "Payments made after the due date in six months."}
  - {name: usage_mb_30d,               role: usage,      function: sum,   column: data_mb, window_days: 30, description: "Data used in the last 30 days."}
  - {name: usage_drop_30d_vs_90d,      role: usage,      function: ratio, of: {function: mean, column: data_mb, window_days: 30}, over: {function: mean, column: data_mb, window_days: 90}, description: "Recent usage against the quarter; well below 1 means the subscriber is going quiet."}
  - {name: days_since_last_activity,   role: activity,   function: days_since_last, description: "Days since the subscriber last did anything."}
