# India: paydays and festival or sale days (plan-v3 decision V-5).
#
# One file per country: calendar_<country code in lower case>.yaml, read by autonomy/decide/moments.py.
# To add a country, copy this file, change `country`, `name` and `timezone` and list its days.
#
# A festival is active from `lead_days` before its date to `tail_days` after it, and the dates are
# data. A date can be given in two ways:
#   dates: [YYYY-MM-DD, ...]  one entry per year (moving festivals: they follow a lunar calendar)
#   fixed: "MM-DD"            the same day every year
#
# CHECK BEFORE RELYING ON IT: the moving dates below were written from general knowledge when the
# file was made; no command or published source was run to confirm them, and Eid depends on the
# moon sighting, so it can fall a day later. The years listed are 2026 and 2027; add years as they
# come. A year with no date for a festival simply has no festival moment.
country: IN
name: India
timezone: Asia/Kolkata

# Salary days: the first and the last day of the month ("last" is the month's last day).
payday:
  days: [1, last]

festivals:
  - id: republic_day_sale
    name: Republic Day sale
    fixed: "01-26"
    lead_days: 3
    tail_days: 1
    multiplier: 1.3

  - id: holi
    name: Holi
    dates: [2026-03-04, 2027-03-22]
    lead_days: 5
    tail_days: 0
    multiplier: 1.3

  - id: eid_al_fitr
    name: Eid al-Fitr
    dates: [2026-03-20, 2027-03-10]
    lead_days: 7
    tail_days: 0
    multiplier: 1.5

  - id: eid_al_adha
    name: Eid al-Adha
    dates: [2026-05-27, 2027-05-17]
    lead_days: 5
    tail_days: 0
    multiplier: 1.3

  - id: independence_day_sale
    name: Independence Day sale
    fixed: "08-15"
    lead_days: 3
    tail_days: 1
    multiplier: 1.4

  - id: raksha_bandhan
    name: Raksha Bandhan
    dates: [2026-08-28, 2027-08-17]
    lead_days: 7
    tail_days: 0
    multiplier: 1.5

  - id: dussehra
    name: Dussehra
    dates: [2026-10-20, 2027-10-09]
    lead_days: 4
    tail_days: 0
    multiplier: 1.3

  - id: diwali
    name: Diwali
    dates: [2026-11-08, 2027-10-29]
    lead_days: 10
    tail_days: 2
    multiplier: 1.7

  - id: christmas
    name: Christmas
    fixed: "12-25"
    lead_days: 5
    tail_days: 0
    multiplier: 1.25

  - id: year_end_sale
    name: Year-end sale
    fixed: "12-28"
    lead_days: 2
    tail_days: 3
    multiplier: 1.35
