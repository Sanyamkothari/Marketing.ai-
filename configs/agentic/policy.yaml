# The policy every agent proposal is checked against (Plan K M132, design §2; docs/AGENTIC.md).
#
# The policy is default-deny: a proposal kind with no rule set below is refused (POLICY_NO_RULES), and a
# rule set allows a proposal only when every rule that applies allows it. The sha256 of this file is the
# policy version written into every ledger entry, so a past decision can be re-checked against the rules
# in force when it was made. Prompts never reach this file: it is read by the server only.
schema_version: 1

# Which rules apply to which proposal kind, in the order they are evaluated (every one is evaluated, so a
# refusal lists every rule it breaks). Rule names: holdout.immutable, budget.cap, consent.channel,
# frequency.cap, test.registered, role.separation.
rule_sets:
  test_plan: [holdout.immutable, test.registered, role.separation]
  campaign_plan:
    [holdout.immutable, budget.cap, consent.channel, frequency.cap, test.registered, role.separation]

holdout:
  # How far a proposed holdout share may sit below the share in force (0.5 percentage points, the test
  # plan's own HOLDOUT_TOLERANCE) before it counts as shrinking the holdout.
  tolerance: 0.005

budget:
  # A run whose cost cannot be worked out while a cost cap is set needs a person's confirmation
  # (RUN_COST_NEEDS_CONFIRMATION); an agent cannot give it, so its proposal is refused.
  refuse_unpriced_when_capped: true

consent:
  # Customers the plan would contact on the proposed channel who may not be contacted on it: the plan's
  # planned_contacts beyond the run's contactable eligible rows there. Any is too many. Customers who opted
  # out of the channel are not on the run's list for it (the treat list never sends them anything there), so
  # they do not count against a plan that stays within the contactable rows.
  max_not_contactable: 0
  # A channel whose contactability the scoring run did not record - or recorded without one of its
  # configured columns, so its consent was never read - is not assumed contactable.
  require_recorded: true

proposals:
  # A pending proposal no Approver decided within this many days expires and cannot be approved.
  expire_after_days: 14

# Plan O M233 (DEC-1803): Data Doctor's rule sets, one per PROPOSE kind (engine/doctor/policy.py; the design
# §5.4, §6.2, §6.6). Default deny, as above: a kind with no rule set is refused (POLICY_NO_RULES), and a rule set
# allows a proposal only when every rule that applies allows it. Plan G's own checks stay in the code as a second check. Rule names: data.step_kind,
# data.step_params, data.spellings, data.protected_columns, data.personal_data, data.level, data.grounded,
# data.tried, data.never_ticked, data.change_share, data.setting, data.approve_class, data.reshape_guard.
data:
  # Only the person ticks these, whoever proposed them (advisor.NEVER_TICKED_STEPS; M238 adds keep_latest_per_id).
  never_ticked_steps: [set_missing, valid_range, keep_latest_per_id, combine_rows, sql_query]
  # Settings no suggestion may change: hiding a column is a step (loop.NEVER_SUGGESTED_BY_CHAT), safeguards and
  # thresholds are the person's (recommend.NEVER_RECOMMENDED), and settings no stage reads (config.ADVISORY_PATHS).
  settings_never_suggested:
    - prepare.exclude_columns
    - validation.min_positive
    - validation.min_rows
    - validation.leakage_check
    - validation.acknowledged
    - governance.approval_required
    - features.auto_feature_engineering
    - features.categorical_encoding
    - features.numeric_scaling
    - features.text_columns
    - features.selection
    - features.max_features
    - monitoring.retraining
  # Decision O10: an AI step changing more than 30% of a column carries a warning, more than 60% is refused (the
  # person may make it as their own edit). Re-typing steps (a type or a unit) count the values they could not
  # read; a rename, hiding a column and a step writing a new column rewrite none of their column's values.
  change_share:
    warn_pct: 30
    refuse_pct: 60
    retyping_kinds: [parse_number, parse_date, map_boolean, convert_units]
  # Design §6.6: a join, stack or de-duplication dropping more than this share of rows needs the person's yes.
  approve_drop_share_pct: 2.0
  # An AI's fix is tried on the file's first rows before it is shown (loop.STEP_SAMPLE_ROWS).
  trial_rows: 1000
  # M241: `na` may mean no, or "not available"; it is asked, never mapped to yes or no.
  boolean_spellings:
    never: [na]
  rule_sets:
    # The chat's setting suggestion (M232 `propose_setting`; loop._propose).
    data.setting:
      proposes: setting
      rules: [data.setting]
    # The chat's data fix (M232 `propose_step`; loop._propose_step): the chat's kinds (loop.CHAT_STEP_KINDS; the
    # Data Doctor's chat adds `remove_rows`, loop.DOCTOR_STEP_KINDS, whose own yes the approval still collects),
    # grounded in a look, tried on 1,000 rows, never ticked here (the visit may apply a clean one for the person
    # to undo); Excel day numbers stay the rules' fix (M240).
    data.recipe_step:
      proposes: steps
      rules:
        - data.step_kind
        - data.personal_data
        - data.grounded
        - data.step_params
        - data.spellings
        - data.protected_columns
        - data.level
        - data.tried
        - data.change_share
        - data.never_ticked
      step_kinds:
        - parse_number
        - parse_date
        - map_boolean
        - normalise_text
        - set_missing
        - map_values
        - set_missing_text
        - convert_units
        - split_column
        - valid_range
        - fill_missing
        - rename_column
        - drop_column
        - remove_rows
      params:
        parse_date: {allowed: [dayfirst]}
        parse_number:
          allowed: [decimal, percent_to_fraction, indian_scale_words]
          one_of: {decimal: [".", ","]}
        remove_rows:
          allowed: [operator, values]
          one_of: {operator: [equals, in, starts_with, is_empty, before, after]}
      levels: [clean, derive]
      change_share: true
    # The person's own edit (M232 `edit_by_hand`; edits.add_edit): their kinds (edits.PERSON_STEP_KINDS).
    data.person_edit:
      proposes: steps
      rules: [data.step_kind, data.personal_data, data.protected_columns, data.level]
      step_kinds:
        - correct_cells
        - map_values
        - set_missing_text
        - convert_units
        - split_column
        - valid_range
        - fill_missing
        - remove_rows
        - rename_column
        - drop_column
      levels: [clean, derive]
      not_allowed_code: AGENT_EDIT_NOT_ALLOWED
    # M237: one way of writing a key so two files meet; on a key column, never on the outcome.
    data.normalise_key:
      proposes: steps
      rules: [data.step_kind, data.step_params, data.protected_columns, data.never_ticked]
      step_kinds: [normalise_key]
      params:
        normalise_key: {allowed: [prefix, zeros, case, spaces, phone]}
      tick_only_sure: true
    # M237: joins and stacks are APPROVE-class when they drop more than 2% of the rows.
    data.join_files:
      proposes: plan
      rules: [data.approve_class]
      approve: above_drop_share
    data.stack_files:
      proposes: plan
      rules: [data.approve_class]
      approve: above_drop_share
    data.build_dataset:
      proposes: plan
      rules: [data.step_kind, data.step_params, data.protected_columns, data.approve_class]
      step_kinds: [normalise_key]
      params:
        normalise_key: {allowed: [prefix, zeros, case, spaces, phone]}
      approve: above_drop_share
    # M238: one row per ID (reshape level, decision O3): through its question, never ticked, the guards at
    # Approve; APPROVE-class when it leaves out more than 2% of the rows.
    data.keep_latest_per_id:
      proposes: steps
      rules:
        - data.step_kind
        - data.step_params
        - data.protected_columns
        - data.level
        - data.never_ticked
        - data.reshape_guard
        - data.approve_class
      step_kinds: [keep_latest_per_id]
      params:
        keep_latest_per_id:
          allowed: [time_column, snapshot_column, dayfirst, ties]
          one_of: {ties: [refuse, first_in_file, last_in_file]}
      approve: above_drop_share
    # Guided setup's combine question as a tool: several rows per ID into one (reshape level, decision O3), through
    # its question, never ticked, the guards at Approve. Rows are combined, not left out: not APPROVE-class.
    data.propose_combine_rows:
      proposes: steps
      rules:
        - data.step_kind
        - data.step_params
        - data.protected_columns
        - data.level
        - data.never_ticked
        - data.reshape_guard
      step_kinds: [combine_rows]
      params:
        combine_rows:
          allowed: [time_column, snapshot_column, dayfirst, outcome, features]
    # A query Data Doctor wrote (rules or AI; engine.agent.sql_step keeps it read-only and sandboxed): never
    # ticked, tried on the first rows, APPROVE-class when its table has over 2% fewer rows than the file read.
    data.propose_sql_step:
      proposes: plan
      rules: [data.never_ticked, data.approve_class]
      approve: above_drop_share
    # Step 7: behaviour features compiled to one query (never ticked, like a query of its own).
    data.propose_features:
      proposes: plan
      rules: [data.never_ticked, data.approve_class]
      approve: above_drop_share
    # M238: which customers are learnt from is the person's choice (design §6.6).
    data.split_file:
      proposes: plan
      rules: [data.approve_class]
      approve: always
    # M242 (DEC-1812 (d), (e), (k)), at the wave-2 integration: a conversion at the rate, date and source a person
    # gave (the tool is the person's only; the product never fetches a rate) is always APPROVE-class: an Analyst
    # approves the exact sentence. Its steps (convert_currency, then parse_number with `unit`) are checked by
    # check_recipe, which never lets a step touch the ID or the outcome.
    data.convert_currency:
      proposes: plan
      rules: [data.approve_class]
      approve: always
    # M238: the steps its look tools propose (pending, `check`: never offered ticked); an AI's merge of spellings
    # is held to O10.
    data.synonym_clusters:
      proposes: steps
      rules:
        - data.step_kind
        - data.step_params
        - data.protected_columns
        - data.personal_data
        - data.grounded
        - data.tried
        - data.change_share
        - data.never_ticked
      step_kinds: [map_values]
      params:
        map_values: {allowed: [mapping]}
      tick_only_sure: true
      change_share: true
    data.impossible_values:
      proposes: steps
      rules: [data.step_kind, data.step_params, data.protected_columns, data.personal_data, data.never_ticked]
      step_kinds: [valid_range, set_missing_text]
      params:
        valid_range: {allowed: [minimum, maximum]}
        set_missing_text: {allowed: [values]}
      tick_only_sure: true
    data.detect_units:
      proposes: steps
      rules: [data.step_kind, data.step_params, data.protected_columns, data.personal_data, data.never_ticked]
      step_kinds: [convert_units]
      params:
        convert_units: {allowed: [units, bare]}
      tick_only_sure: true
    # M240: Excel day numbers are the rules' own fix (`find_excel_serial_dates`), never the chat's.
    data.excel_serial_dates:
      proposes: steps
      rules: [data.step_kind, data.step_params, data.protected_columns, data.personal_data, data.never_ticked]
      step_kinds: [parse_date]
      params:
        parse_date:
          allowed: [excel_serial, date_1904]
          equals: {excel_serial: true}
      tick_only_sure: true
    # M241: lakh, crore, K, M and `/-`, with `indian_scale_words: true`; pre-ticked only when the rules are sure.
    data.parse_indian_numbers:
      proposes: steps
      rules:
        - data.step_kind
        - data.step_params
        - data.protected_columns
        - data.personal_data
        - data.never_ticked
        - data.change_share
      step_kinds: [parse_number]
      params:
        parse_number:
          allowed: [decimal, percent_to_fraction, indian_scale_words]
          equals: {indian_scale_words: true}
          one_of: {decimal: [".", ","]}
      tick_only_sure: true
      change_share: true
    # M241: Hindi and Hinglish yes/no, both sides seen, from the lexicons, never `na`.
    data.indian_booleans:
      proposes: steps
      rules:
        - data.step_kind
        - data.step_params
        - data.spellings
        - data.protected_columns
        - data.personal_data
        - data.never_ticked
        - data.change_share
      step_kinds: [map_boolean]
      params:
        map_boolean: {allowed: [true_values, false_values]}
      tick_only_sure: true
      change_share: true
    # M236 (DEC-1806): the wrappers' proposals carry no step - a file's role, its ID column, a mapping, how a file
    # is read, an import from a connection, the AI's second opinion. Each lands pending; only a proposal the
    # rules are sure of may start ticked (`propose_role`, `propose_mapping` and `propose_import` are never offered
    # sure), and nothing the AI proposes is ticked.
    data.propose_role:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.propose_key:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.propose_mapping:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.propose_intake:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.propose_import:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.second_opinion:
      proposes: plan
      rules: [data.never_ticked]
    # M239 (DEC-1809): the outcome definition decides what the model learns. APPROVE-class, always: its own yes,
    # with the exact sentence (counts included), by an Analyst; never offered ticked (the tools offer it `check`).
    data.define_outcome:
      proposes: plan
      rules: [data.never_ticked, data.approve_class]
      tick_only_sure: true
      approve: always
    data.map_outcome_values:
      proposes: plan
      rules: [data.never_ticked, data.approve_class]
      tick_only_sure: true
      approve: always
    # M244 (DEC-1814): time settings. The budget is a setting, not APPROVE-class: three plain choices, Balanced
    # offered ticked only when the rules are sure (past runs here close in size). The data time settings carry no
    # step; the outcome window and lapse stay the outcome definition's (APPROVE-class, `data.define_outcome`).
    data.propose_training_budget:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
    data.propose_time_settings:
      proposes: plan
      rules: [data.never_ticked]
      tick_only_sure: true
