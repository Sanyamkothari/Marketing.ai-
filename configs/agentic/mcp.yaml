# The verifier over MCP (Plan K M133, DEC-1404; docs/AGENTIC.md §8).
#
# mcp.enabled: mount the MCP server at /mcp (streamable HTTP, stateless). Off - the default - nothing is
# mounted, the MCP SDK is never imported and every response is byte-identical to Plan J's. The server is a
# front to the agent-safe core, so agentic.enabled (agentic.yaml) must be on as well: with it off every tool
# call is refused with AGENTIC_DISABLED. Sign-in is required (MARKETING_AI_AUTH_MODE=local): with sign-in
# off the endpoint answers 503 AUTH_NOT_CONFIGURED.
mcp:
  enabled: false

  # demo (M133): the demo library only; anything else asked about is refused with MCP_DEMO_ONLY.
  # clients (M141, DEC-1408): client data, one workspace per client (`workspaces` below); every sign-in reaches
  # exactly one workspace and anything outside it is refused with MCP_WORKSPACE_DENIED. Any other value is
  # refused with MCP_DEMO_ONLY.
  workspace: demo

  # What counts as demo data: a run or upload made for one of these use cases (the public datasets of
  # library/), or generated data (`synthetic: true`). A run that belongs to an onboarded client
  # (`client_id` set) is never demo data.
  demo_use_cases: [hillstrom-email]

  # Small-group suppression on every grouped output (Plan I's rate_by rule): a group of 1 to 9 customers
  # shows no figure, and the next smallest group joins it until what is withheld adds up to 10.
  min_group_rows: 10

  # Per signed-in session (the bearer token, kept as its sha256 only): calls in any 60 seconds, and calls
  # running at once. Over either, a call is refused with MCP_RATE_LIMITED.
  rate_limit:
    calls_per_minute: 60
    concurrent_calls: 2

  # A call that runs synchronously is refused with MCP_TIMEOUT after this many seconds; a task fails after it.
  call_timeout_seconds: 120

  # M141: the client workspaces of a `workspace: clients` server. Each names the onboarded client whose data it
  # holds (`client_id`: its runs, and the campaigns made from them) or claims the data no client is recorded on
  # (`unattributed: true`: uploads, runs made from uploads, audited campaigns; at most one workspace, the
  # single-client deployment's), and lists the people bound to it by user id (`members`; GET /admin/users shows
  # them). A person may be in one workspace only, so every token of theirs reaches that workspace alone. Each
  # workspace keeps its own ledger chain: `python -m engine.agentic.ledger verify --workspace <id>`.
  #   workspaces:
  #     - id: acme
  #       client_id: c_acme_1
  #       members: [u-0123456789abcdef]
  workspaces: []

  # M141: long tools run as MCP tasks for a client that supports the tasks extension (io.modelcontextprotocol/
  # tasks); other clients get the synchronous answer, refused with MCP_TIMEOUT after call_timeout_seconds. A
  # finished task is kept ttl_seconds; poll_interval_ms is the polling interval the server suggests.
  tasks:
    tools: [audit_campaign, get_proof_pack]
    ttl_seconds: 3600
    poll_interval_ms: 1000
