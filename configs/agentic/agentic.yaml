# Plan K switches (docs/AGENTIC.md, design §11). Every one is off by default; with all three off the product is
# byte-identical to Plan J's.
#
# agentic.enabled: the agent-safe core (M132) - the tool registry's in-process entry point, proposals,
# the decision ledger and the /agentic routes. Off (the default), none of it is reachable: the routes are
# not mounted, the app creates no table and writes no file, and every response is byte-identical to Plan
# J's. (`alembic upgrade head` still adds the empty agentic_decision_log table, revision 0009, whatever
# this switch says: a migration runs on every deployment.)
agentic:
  enabled: false

# compliance.gate.enabled: the pre-send compliance gate (M134, DEC-1405), one decision record per customer and
# planned channel before a treat list leaves the product (consent on the channel, the DLT template, whitelisted
# links, a WhatsApp opt-in), signed on the decision ledger. Off, every treat list is byte for byte what it was.
# It does not need agentic.enabled. This is the gate's only switch; its settings (opt-in channels, the longest
# DLT slot value) are in configs/compliance/compliance.yaml, which refuses an `enabled` of its own.
compliance:
  gate:
    enabled: false

# mcp.enabled: the verifier over MCP (M133, DEC-1404) - other companies' agents calling the read and propose tools
# at /mcp. Off, nothing is mounted and the MCP SDK is not imported. It needs agentic.enabled on as well (with it
# off every tool call is AGENTIC_DISABLED). What the server does once on - the workspace, the demo use cases, the
# rate limits and the call timeout - is in configs/agentic/mcp.yaml.
mcp:
  enabled: false
