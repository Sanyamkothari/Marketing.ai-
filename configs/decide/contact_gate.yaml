# The contact-list gate (`engine/decide/contact_gate.py`): who is taken off the list before it is sent.
#
# It reads the customer file the run scored, finds the columns below BY NAME (whole words, any case) and applies
# one rule for each. Every customer taken off is counted under one reason, and the list's summary says so
# ("excluded: 12 because they are under 18"). Edit the lists here, not the code.
#
# An unknown answer is never a yes: a blank "do not disturb" or consent cell takes the customer off the list,
# unless the run's `contact_rules.json` says a blank means OK.

minimum_age: 18

# Columns by name. Status, do-not-disturb and consent columns are also found when the name holds one of these as
# whole words (`kyc_status`, `dnd_flag`, `sms_consent`); such a do-not-disturb or consent column is read only when
# most of its answers are ones listed below, and the list says so when it is not. Every status column is read,
# and every do-not-disturb column; consent is read from the first column found.
age_columns: [age, customer_age, cust_age, age_years, age_in_years, applicant_age]
birth_date_columns: [dob, birth_date, birthdate, date_of_birth]
status_columns: [status, customer_status, account_status, lifecycle_status, legal_status]
dnd_columns: [dnd, ndnc, do_not_disturb, do_not_call, do_not_contact, dnc, opt_out, opted_out, optout, unsubscribed]
consent_columns: [consent, marketing_consent, opt_in, optin]

# Statuses that always take a customer off the list (whole value; case, spaces and punctuation do not matter).
blocked_statuses: [deceased, dead, death, fraud, fraudulent, suspected fraud, legal, legal hold, litigation, court case, do not contact, closed, blacklisted, written off]

# Test, QA and staff accounts are not customers. A cell of an ID or e-mail column (whole column name; the key is always
# read) that matches one of these patterns (regular expressions, any case) takes the account off the list.
test_account_columns: [id, customer_id, cust_id, client_id, user_id, member_id, contact_id, email, email_address, email_id, e_mail, mail, contact_email]
test_account_patterns: ['^(test|dummy|demo|sample|qa)[\W_]*\d*$', '^qa\+', '^test@', '@example\.(com|org|net)$', '@test\.']

# One person per household: a column named like these that repeats (a column unique per row, such as the key, is no
# household) keeps the best-ranked member on the list and takes the others off. A blank, `NA` or `unknown` cell is no
# household. A run can name its own column in `contact_rules.json` (`household_column`).
household_columns: [household_id, family_id, account_id]

# What the do-not-disturb and consent cells may say (any case). Anything else is "unknown".
dnd_yes: ["y", "yes", "true", "1", "dnd", "registered", "blocked"]
dnd_no: ["n", "no", "false", "0", "ndnd", "not registered", "clear"]
dnd_partial: [partial, dnd-partial, dnd partial]
consent_yes: ["y", "yes", "true", "1", "agreed", "opted in", "granted"]
consent_no: ["n", "no", "false", "0", "refused", "opted out", "withdrawn"]

# A DND scrub older than this many days earns a warning on the list.
dnd_scrub_max_days: 30
