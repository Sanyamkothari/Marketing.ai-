# configs/decide/reasons.yaml
# Plain-language dictionary for model explanations (Plan J M98, DEC-1308).
#
# Maps feature names and value directions (up/down) to plain business phrases.
# Every phrase is written in plain English: jargon_in() returns an empty tuple.
# Features not mapped here keep today's text from row_explanations.parquet.

schema_version: 1

features:
  monthly_spend:
    down: "Spent less each month for 3 months"
    up: "Increased monthly spend"
  complaints_30d:
    up: "Raised two complaints in 30 days"
    down: "Fewer complaints in the last 30 days"
  tenure_months:
    down: "Account is newer than average"
    up: "Long-standing account"
  days_since_last_activity:
    up: "No activity in recent days"
    down: "Active in the last few days"
  visits_last_7d:
    down: "Fewer site visits in the last week"
    up: "More site visits in the last week"
  visits_30d:
    down: "Fewer site visits this month"
    up: "More site visits this month"
  support_tickets_90d:
    up: "Multiple support tickets in 90 days"
    down: "Few support tickets in 90 days"
  ad_ctr_90d:
    down: "Lower ad click rate in 90 days"
    up: "Higher ad click rate in 90 days"
