# configs/pilot/value.yaml
# Which way round a campaign's measured outcome counts in the value view (Plan E M62, DEC-908).
# A use case listed here predicts something a campaign exists to PREVENT (a customer leaving, a
# late payment, a fault): when a campaign is measured on that same outcome - the use case's target
# column or label - fewer outcomes among the contacted customers is the gain. Every other outcome
# (a conversion, a customer coming back) is one to have more of. The client can still say otherwise
# on the value screen; this is only the default, so a churn campaign is never reported backwards
# before anybody has entered a value.

schema_version: 1

outcomes_to_prevent:
  - telco-churn
  - rca
  - payment-propensity
  - card-default-propensity
  - fault-prediction
  - order-fulfillment

# Editable defaults for the cost of a contact and of an offer, in rupees (Plan J M97, DEC-1307).
# Read through one function, engine.pilot.roi.lookup_value_costs, by the uplift targeting policy of a
# use case that ranks by customer value (uplift.policy.value_column) and sets no cost_per_contact of
# its own. They are never applied to a run that did not opt in, and the ROI form's own defaults are
# unchanged: these are suggestions to edit, not numbers anybody entered.
# Channel costs reflect Indian messaging benchmarks: WhatsApp marketing ~0.86, WhatsApp utility ~0.13,
# SMS ~0.15, e-mail ~0.05, voice ~0.70. M99's offer and channel catalogue takes these over.
value:
  offer_cost: 0.0
  contact_cost: 0.86
  channel_contact_costs:
    whatsapp: 0.86
    whatsapp_marketing: 0.86
    whatsapp_utility: 0.13
    sms: 0.15
    email: 0.05
    voice: 0.70
