# configs/pilot/help.yaml
# The plain-language catalogue (Plan E, M60 and M63). ONE source for three readers:
#   * the data readiness report (every problem it lists carries `meaning` and `fix` from here),
#   * the in-app "What does this mean?" tooltips (every warning pill and every advanced setting),
#   * the pre-flight checker's report on the client's own laptop.
# Written for a client analyst, not a data scientist: no model jargon unless `terms` explains it.
# `tests/unit/pilot/test_help.py` fails when a code the engine can raise has no entry here, when an
# entry names a code the engine cannot raise, or when a text uses a word from `plain_language.jargon`
# (engine/pilot/plain.py) that the same entry does not explain.
#
# Shape: codes.<CODE> = {title, meaning, fix}; settings.<dotted path, list index as [*]> = {meaning};
# terms.<term> = one-line explanation, shown wherever a report uses the term.

schema_version: 1

codes:
  # --- Phase 1: the prepared file (validation.json) ----------------------------------------------
  PK_MISSING:
    title: The customer ID column is missing
    meaning: The file has no column that identifies each customer, so rows cannot be told apart or joined to anything else.
    fix: Add the customer ID column (pseudonymised is fine) and choose it as the key on the setup screen.
  PK_NOT_UNIQUE:
    title: The same customer ID appears on more than one row
    meaning: The prepared file should have one row per customer; repeated IDs mean some customers would be counted twice.
    fix: Remove the repeated rows, or keep only the latest row for each customer, then upload the file again.
  PK_NULLS:
    title: Some rows have no customer ID
    meaning: Rows without an ID cannot be scored against a customer or followed up later.
    fix: Fill in the missing IDs or remove those rows before uploading.
  TARGET_MISSING:
    title: The outcome column is missing
    meaning: To learn, the platform needs a column that says what happened to each customer in the past (for example, whether they left).
    fix: Add the outcome column named in the template, or build it from raw tables with "Build from raw tables".
  TARGET_NOT_BINARY:
    title: The outcome column has more than two values
    meaning: The outcome must be yes or no for each customer; other values make it impossible to learn what a "yes" looks like.
    fix: Recode the outcome to two values (for example 1 for left and 0 for stayed) and upload again.
  TARGET_CONSTANT:
    title: Every customer has the same outcome
    meaning: If nobody (or everybody) left, there is nothing to tell apart and nothing to learn.
    fix: Send a longer period, or a period in which the outcome actually happened to some customers.
  TARGET_TOO_FEW_POSITIVES:
    title: Too few customers had the outcome
    meaning: The platform needs a minimum number of past examples (for example, customers who left) to learn a reliable pattern.
    fix: Send more history or more customers so that more examples of the outcome are included.
  TARGET_IMBALANCE_SEVERE:
    title: The outcome is very rare
    meaning: Only a very small share of customers had the outcome. The platform can still learn, but results will be less certain.
    fix: No action is required. If you can, send more history so there are more examples of the outcome.
  ROWS_TOO_FEW:
    title: Too few rows
    meaning: The file has fewer customers than the minimum the platform needs to learn and to test what it learned.
    fix: Send more customers or a longer period.
  LEAKAGE_SUSPECTED:
    title: A column seems to contain the answer
    meaning: One column predicts the outcome almost perfectly, which usually means it was recorded after the outcome happened (for example a "closure date" when predicting who will leave). A result built on it would look excellent and fail in real use.
    fix: Remove that column, or send the value as it was before the outcome date.
  TIME_COLUMN_MISSING:
    title: The date column is missing
    meaning: This use case learns from the past and tests on the most recent period, so every row needs the date it describes.
    fix: Add the date column the upload template lists, or choose a random split in the settings.
  TIME_COLUMN_UNPARSEABLE:
    title: The dates cannot be read
    meaning: Too many values in the date column are not recognisable dates.
    fix: Write dates as YYYY-MM-DD (for example 2026-08-31) and upload again.
  HIGH_NULL_COLUMN:
    title: A column is mostly empty
    meaning: Most rows have no value in this column, so it carries little information.
    fix: Nothing is required; you can acknowledge the warning. If the column should be filled, check how the file was exported.
  CONSTANT_COLUMN:
    title: A column has the same value on every row
    meaning: A column that never changes cannot help tell customers apart, so it will not be used.
    fix: Nothing is required; you can acknowledge the warning or remove the column.
  HIGH_CARDINALITY_ID_LIKE:
    title: A column looks like an ID
    meaning: Almost every row has a different value, as an account number or reference would. Such a column cannot teach anything general about customers.
    fix: Exclude the column in the settings, or acknowledge the warning if it is meaningful.
  PII_DETECTED:
    title: Personal details were found
    meaning: A column looks like names, phone numbers, email addresses, Aadhaar or PAN numbers. The platform masks or drops it and never learns from it, but it should not have been sent.
    fix: Remove the column from the next extract. Keep only the pseudonymised customer ID.
  PII_IN_FREE_TEXT:
    title: Contact details were found inside free text
    meaning: A notes or remarks column mentions phone numbers or email addresses. They are masked wherever the text is shown or summarised.
    fix: If you can, strip contact details from notes before the next extract.
  SCHEMA_MISMATCH:
    title: The new file does not match the one the model learned from
    meaning: Columns the model needs are missing or have changed type since training, so the file cannot be scored as it is.
    fix: Export the new file with the same columns and formats as the training file.
  CONSENT_COLUMN_MISSING:
    title: The marketing consent column is missing
    meaning: This use case only contacts customers who agreed to marketing, and the column that records that agreement is not in the file.
    fix: Add the consent column (true or false for each customer), or turn off the consent setting if consent is handled elsewhere.
  SUPPRESSION_COLUMN_MISSING:
    title: A column used to avoid over-contacting is missing
    meaning: The platform skips customers who opted out or were contacted recently, but the column it needs for that is not in the file, so nobody will be skipped for that reason.
    fix: Add the opt-in or last-contact column, or acknowledge the warning if suppression is handled elsewhere.

  # --- Phase 2: raw tables (the onboarding checks in build_report.json) --------------------------
  NO_ENTITY_SOURCE:
    title: The customer table is missing
    meaning: One table must list every customer once. Without it there is nothing to build a row for.
    fix: Upload the customer table (one row per customer) and mark it as the customer table.
  MULTIPLE_ENTITY_SOURCES:
    title: More than one table is marked as the customer table
    meaning: Only one table can hold one row per customer.
    fix: Keep the table that lists every customer and change the others to the kind of events they record.
  ENTITY_KEY_UNMAPPED:
    title: The customer table has no customer ID column
    meaning: The platform does not know which column in the customer table identifies each customer.
    fix: On the mapping screen, map the column that holds the customer ID.
  ENTITY_DUPLICATE_KEYS:
    title: The customer table repeats customer IDs
    meaning: The customer table should have exactly one row per customer; some IDs appear more than once.
    fix: Send one row per customer (for example, the latest record), or let the platform keep the latest row where it offers to.
  JOIN_KEY_UNMAPPED:
    title: An event table has no customer ID column
    meaning: The platform cannot attach this table's rows (bills, complaints, usage…) to customers.
    fix: On the mapping screen, map the column of that table that holds the customer ID.
  EVENT_TIME_UNMAPPED:
    title: An event table has no date column
    meaning: Each bill, complaint or usage record needs the date it happened, so it can be counted only when it happened before the date being predicted from.
    fix: On the mapping screen, map the column that says when each row happened.
  EVENT_TIME_UNPARSEABLE:
    title: The dates in an event table cannot be read
    meaning: Too many values in the date column are not recognisable dates.
    fix: Export dates as YYYY-MM-DD, or pick the right date format on the mapping screen.
  DATE_FORMAT_AMBIGUOUS:
    title: The date format is unclear
    meaning: Dates such as 03/04/2026 could mean 3 April or 4 March. Reading them the wrong way would shift events by months.
    fix: Confirm the format on the mapping screen, or export dates as YYYY-MM-DD so there is no doubt.
  JOIN_KEY_COVERAGE_LOW:
    title: Many rows do not match a known customer
    meaning: A large share of this table's rows carry customer IDs that are not in the customer table, so they cannot be used.
    fix: Check that every file uses the same customer IDs, pseudonymised the same way (same method, same secret key), and that the customer table covers every customer in the other files.
  KEY_FORMAT_MISMATCH:
    title: Customer IDs are written differently in two tables
    meaning: The same customers appear in both tables, but their IDs are written differently (for example with leading zeros or a prefix in one of them).
    fix: Export the IDs the same way in every file, or apply the transformation the mapping screen suggests.
  REQUIRED_STANDARD_COLUMN_UNMAPPED:
    title: A required column is not mapped
    meaning: This use case needs a column that none of your columns has been matched to yet.
    fix: Map the column on the mapping screen, or send it in the next extract.
  MAPPING_LOW_CONFIDENCE:
    title: A column match needs your confirmation
    meaning: The platform guessed which of your columns means what, but it is not sure about this one.
    fix: Check the suggested match on the mapping screen and correct it if it is wrong.
  MAPPING_TYPE_CONFLICT:
    title: A column holds the wrong kind of value
    meaning: A column was matched to something that should be a number or a date, but its values are not.
    fix: Map a different column, or correct the export so the column holds the expected kind of value.
  VALUE_UNMAPPED:
    title: Some values were not recognised
    meaning: A column uses codes the platform does not know (for example plan names or yes/no spellings).
    fix: On the mapping screen, say what each unrecognised value means, or whether to leave it blank.
  SNAPSHOT_OUTSIDE_DATA_RANGE:
    title: A chosen date is outside the data
    meaning: The platform was asked to describe customers on a date the data does not cover.
    fix: Pick dates inside the period the files cover, or send data that covers the date.
  TOO_LITTLE_HISTORY:
    title: Not enough history
    meaning: To learn, the platform needs some history before each date it predicts from and enough time after it to see the outcome. The files cover a shorter period than that.
    fix: Send a longer history. The data request lists the minimum number of months for this use case.
  LABEL_HORIZON_CENSORED:
    title: The most recent dates are too recent to know the outcome
    meaning: For the latest dates, the period in which the outcome would happen has not finished yet, so those dates were left out of learning.
    fix: Nothing is required. This is expected for the most recent weeks.
  LABEL_DEGENERATE_SNAPSHOT:
    title: At one date, everyone or nobody had the outcome
    meaning: One of the dates the platform learns from has no examples of the outcome (or only examples), which usually points to a gap in the data.
    fix: Check that the activity or campaign file covers that period completely.
  LABEL_ROLE_MISSING:
    title: The table that defines the outcome is missing
    meaning: The outcome for this use case is worked out from one kind of table (for example the activity log) and that table was not uploaded.
    fix: Upload the table named in the data request.
  FEATURE_ALL_NULL:
    title: A calculated measure came out empty
    meaning: One of the measures built from your tables (for example "complaints in the last 90 days") is empty for almost every customer, so it was dropped.
    fix: Nothing is required. If the measure matters, check that its table covers the right period.
  FEATURE_NAME_COLLISION:
    title: Two measures have the same name
    meaning: Two of the measures being built share a name, so one would overwrite the other.
    fix: Rename one of them on the features screen.
  TOO_MANY_FEATURES:
    title: Too many measures were selected
    meaning: More measures were selected than the platform builds in one dataset.
    fix: Remove the measures that matter least on the features screen.
  ENTITY_ATTRIBUTES_NOT_TIME_VERSIONED:
    title: Customer details are only as they are today
    meaning: The customer table shows details as they are today, not as they were on each past date. A detail that changed recently (such as the plan) may make past predictions look better than they will be.
    fix: If you can, send customer details with the date they were valid from. Otherwise, acknowledge the warning.
  FUTURE_EVENTS_LEAKED:
    title: Information from the future reached a past date
    meaning: The platform found events after a prediction date inside the measures for that date. This is a fault in the platform, not in your data.
    fix: Please report this to the Minfy team; it cannot be waved through.
  SOURCE_TOO_LARGE:
    title: A file is too large
    meaning: One table has more rows than the platform reads from a single file.
    fix: Send a shorter period, or only the customers and dates this use case needs.
  TOO_MANY_SOURCES:
    title: Too many tables
    meaning: More tables were uploaded than one dataset can combine.
    fix: Remove the tables this use case does not need, or combine tables that hold the same kind of row.

  # --- Phase 3b: uplift (uplift_validation.json) ---------------------------------------------------
  TREATMENT_COLUMN_MISSING:
    title: The column saying who was contacted is missing
    meaning: Measuring what a campaign changed needs a column that says, for each customer, whether they received the campaign or were held back.
    fix: Add the treatment column (1 for contacted, 0 for held back) to the campaign file.
  TREATMENT_NOT_BINARY:
    title: The "contacted" column has more than two values
    meaning: Each customer must be either contacted or held back; other values cannot be read.
    fix: Recode the column to 1 for contacted and 0 for held back.
  TREATMENT_VARIES_WITHIN_ENTITY:
    title: A customer is in both groups
    meaning: In one campaign, some customers were contacted on one date and held back on another, so the two groups cannot be compared fairly.
    fix: Keep each customer in one group for the whole campaign, or add a campaign column so each campaign is judged on its own.
  TREATMENT_ARM_TOO_SMALL:
    title: Too few customers in one group
    meaning: Either the contacted group or the held-back group is too small, or has too few outcomes, for a reliable comparison.
    fix: Use a campaign with a larger held-back group, or wait for more outcomes before measuring.
  TREATMENT_NOT_RANDOM:
    title: Who was contacted does not look random
    meaning: Customer details predict who was contacted, so the contacted and held-back groups were not chosen by chance. A comparison between them could reflect who was picked rather than what the campaign did.
    fix: Use a campaign where a random share was held back, or acknowledge that results are descriptive only.
  OUTCOME_WINDOW_IMMATURE:
    title: The outcome period has not finished
    meaning: For some customers, not enough time has passed since the campaign to know whether they responded.
    fix: Wait until the outcome period has passed; the report shows the date results will be ready.
  FEATURE_AFTER_TREATMENT:
    title: A column was recorded after the campaign
    meaning: A column seems to describe customers after they were contacted, so it could reflect the campaign itself.
    fix: Remove that column, or send its value as it was before the campaign date.

  # --- Phase 1: scoring drift (scoring_summary.json drift_status) --------------------------------
  DRIFT_WATCH:
    title: The new customers look a little different
    meaning: Some measures in the file being scored have moved away from what the model learned on. Scores are still usable.
    fix: No action now. If it persists for a few months, retrain on recent data.
  DRIFT_DRIFTED:
    title: The new customers look very different
    meaning: Several measures have moved far from what the model learned on, so scores may be less reliable.
    fix: Check that the new file was exported the same way; if it was, retrain the model on recent data.

  # --- Phase 1: the decision threshold (model/scorer.json, evaluation.json threshold_detail) ------
  THRESHOLD_FALLBACK:
    title: The automatic cut-off was replaced by the top 10%
    meaning: The automatic way of choosing which customers to flag would have flagged almost everyone, so the platform flags the top 10% of scores instead.
    fix: Nothing is required. If a different share suits your campaign budget, set the cut-off in the settings.

  # --- Plan E: the pre-flight checker (scripts/preflight.py, run on the client's side) -----------
  PREFLIGHT_FILE_UNREADABLE:
    title: A file could not be read
    meaning: The file is not a readable CSV or Parquet file (for example it is compressed, password-protected, or in an unusual text encoding).
    fix: Save it as a CSV in UTF-8 with a header row, or as Parquet, and run the check again.
  PREFLIGHT_FILE_SKIPPED:
    title: A file was skipped
    meaning: Only CSV and Parquet files are checked; this file has another type.
    fix: Export it as CSV or Parquet if it is part of the data request; otherwise remove it from the folder.
  PREFLIGHT_TABLE_NOT_RECOGNISED:
    title: A table's contents were not recognised
    meaning: The checker could not tell which table of the data request this file is (customers, bills, complaints, usage or campaign events).
    fix: Name the file after the table it holds (for example bills.csv), or check it holds the columns the data request lists.
  PREFLIGHT_TABLE_MISSING:
    title: A requested table was not found
    meaning: The data request lists this table, and none of the files looks like it.
    fix: Add the table to the folder, or tell Minfy why it cannot be sent.
  PREFLIGHT_KEY_NOT_FOUND:
    title: No customer ID column was found
    meaning: The checker could not find a column that looks like a customer ID in this table, so it cannot be linked to the customer table.
    fix: Include the pseudonymised customer ID in every table, with the same column name in each file.
  # --- Plan G: a scoring file the model's saved preparation cannot prepare (DEC-1006, DEC-1013) ----
  RECIPE_COLUMN_MISSING:
    title: A column the model prepares is missing
    meaning: The model was trained on data prepared in saved steps, and one of those steps needs a column this file does not have.
    fix: Add the column back under its old name, or open Guided setup and tell the helper what it is called now.
  RECIPE_VALUES_UNCONVERTED:
    title: Some values could not be read
    meaning: A saved preparation step could not turn too many of this column's values into numbers, dates or yes / no, so the file looks different from the one the model learnt from.
    fix: Check how the column is written in this file; Guided setup shows the values it could not read.
  RECIPE_STEP_INVALID:
    title: A saved preparation step no longer applies
    meaning: One of the steps saved with the model cannot run on this file, or the file it was prepared from is gone. A model keeps the preparation rules it was approved with; only a model approved before those rules were saved with it is also stopped when this use case no longer allows one of its steps.
    fix: Train the model again with Guided setup so its preparation steps are saved again.
  # --- Plan J M91: consent purposes and customer-level downloads (DEC-1301 (b), (e)) ---------------
  CONSENT_PURPOSE_MISSING:
    title: A use case that contacts customers has no consent purpose
    meaning: One or more use cases send offers or reminders to customers, but the privacy settings do not say what purpose the customer agreed to. Without a purpose the consent ledger cannot check them, so a customer who said no could still be contacted. Until it is fixed the privacy settings do not load, so scoring, the retention job and erasure requests that read them stop too.
    fix: Open configs/privacy.yaml and add each use case named in the message under use_case_purposes, choosing marketing_communication for offers and campaigns or account_servicing for account reminders. If the use case really does not contact customers, set actions.contacts_customers to false in its own file.
  ROW_LEVEL_DOWNLOAD_REFUSED:
    title: Only an Analyst can download customer-level rows
    meaning: This file has one row per customer (scored customers, reasons per customer or campaign messages), so with sign-in on it needs the Analyst role. Every download is recorded in the audit log. Reports and charts for the run stay open to Viewers.
    fix: Ask an Admin to give you the Analyst role, or ask an Analyst to share what you need.
  # --- Plan J M92: persistent control group and explore slice (DEC-1302 (a), (b)) ---------------
  HOLDOUT_SALT_MISSING:
    title: "The control group's secret salt is not set"
    meaning: This use case holds the same customers out on every run. That needs a secret salt (MARKETING_AI_HOLDOUT_SALT), and none is set, so the run stops before scoring anyone.
    fix: "Ask your administrator to set the salt (at least 16 characters, kept for as long as the same control group is used; on AWS the deployment generates it), or set the use case's control group scope back to run, a fresh draw on every run."
  HOLDOUT_SALT_CHANGED:
    title: The salt is not the one the fixed control group was drawn with
    meaning: "The configured salt differs from the one recorded when this deployment's fixed control group started. Scoring with it would quietly move customers in or out of the control group, so results could no longer be compared over time."
    fix: Set the original salt again. Or, if the change is intended, ask an Admin to adopt the new salt, which starts a new period for every fixed control group.
  HOLDOUT_SALT_UNCHANGED:
    title: There is no new salt to switch to
    meaning: A switch to a new salt was requested, but the configured salt is the one already recorded (or no salt has been recorded yet), so switching would reshuffle nobody.
    fix: Set the new MARKETING_AI_HOLDOUT_SALT first, then ask again. To lower a share, start the new period without switching the salt.
  HOLDOUT_FRACTION_LOWERED:
    title: The control group share was lowered
    meaning: This use case now asks to keep a smaller share of customers out than its fixed control group has used in the current period. Some customers who were held out would then be contacted, so results before and after could not be added up.
    fix: Set the share back. Or ask an Admin to start a new control group period at the lower share; results are then reported per period.
  HOLDOUT_FRACTION_MISMATCH:
    title: Use cases sharing one control group ask for different shares
    meaning: The shared (universal) control group keeps the same customers out of every use case on it, so it has one share. This use case, or the requested new period, asks for a different share than the current period, so one use case would contact customers another holds out.
    fix: Give every use case on the shared control group the same share. To change that share, change it in all of them first, then ask an Admin to start a new period at it.
  HOLDOUT_SCOPE_RESERVED:
    title: This use case name cannot have its own fixed control group
    meaning: "The names 'universal' and 'explore' are reserved for the shared control group and the explore slice. A use case with one of these names cannot have a control group of its own (scope use_case), because its customers would be drawn as if they were in the shared control group or the explore slice."
    fix: Rename the use case, or use scope universal or run.
  # --- Plan J M93: the readiness report's planning warnings (DEC-1303 (f), (g), (h)) -------------
  LABEL_RATE_UNSTABLE:
    title: The outcome rate jumps from one month to the next
    meaning: "The share of customers with the outcome changed a lot between two months of prediction dates, by more than the allowed amount and more than chance would explain. When the outcome means something different from month to month, the model learns from an outcome that keeps changing and a test compares unlike months. This is a warning: the dataset can still be used."
    fix: "Check the outcome definition and the extract for the months named: a changed process, a new product or a gap in the data can change what the outcome means. If the change is real and expected, carry on; otherwise fix the extract and build the dataset again."
  TREATMENT_HISTORY_NOT_RANDOM:
    title: Past campaigns did not pick customers at random
    meaning: "Who past campaigns contacted can be told from the customers' own data, so they were chosen by a model or a rule. Comparing contacted with held-back customers would then mix what a campaign changed with how the chosen customers already differed, so this history cannot yet show who a campaign changes. This is a warning: nothing is blocked."
    fix: Hold back a randomly chosen control group in the next campaign, and rank customers by how likely they are to have the outcome until its results are in. Learning who each campaign changes can start from the next cycle.
  # --- Plan J M94: campaigns, the one measurement path and the registered test plan (DEC-1304) -----
  CAMPAIGN_NOT_FOUND:
    title: "There is no such campaign"
    meaning: "The campaign named in the address does not exist, or it was recorded in another workspace."
    fix: "Open the campaign again from the Results page, where every recorded campaign is listed beside the runs."
  CAMPAIGN_NOT_MATURED:
    title: "The campaign's results are not in yet"
    meaning: "Some customers are still inside the period their response is counted over. A result now would count only part of them, so no number is shown until every customer's period is over."
    fix: "Measure again on or after the date shown. That date is counted from the day the campaign really went out."
  CAMPAIGN_OUTCOMES_MISSING:
    title: "The campaign has no outcomes file yet"
    meaning: "A campaign is measured from a file saying, for each customer, whether they responded. None has been added to this campaign."
    fix: "Add the outcomes file (the customer ID plus one column saying whether each customer responded), then measure."
  CAMPAIGN_INVALID:
    title: "The campaign request cannot be used"
    meaning: "Something in the request does not fit this campaign. Examples: a send date before the list was made, bands on a list that already chose who to contact, an outcomes file missing a named column, or a measurement date that is still in the future."
    fix: "Correct the item the message names and try again. Measure as of today or an earlier day, never a later one."
  TEST_PLAN_EXISTS:
    title: "This campaign already has a test plan"
    meaning: "The way this campaign will be judged was fixed when its plan was registered. A different plan cannot silently replace it."
    fix: "To change the plan, file an amendment with a reason. The new version is kept beside the old one, so the change is on the record."
  TEST_PLAN_CHANGED:
    title: "This measurement differs from the registered test plan"
    meaning: "The measurement would use a different outcome, window, comparison group or adjustment column from the plan fixed in advance. Changing these after the results are known can make chance look like an effect. Customers removed by a privacy erasure request do not count as a change."
    fix: "Measure exactly as planned, or amend the plan with a reason first."
  TEST_PLAN_NOT_FOUND:
    title: "This campaign has no test plan to amend"
    meaning: "An amendment changes a registered plan, and this campaign has none yet."
    fix: "Register the test plan first. Once it exists, amend it if needed."
  TEST_PLAN_INVALID:
    title: "The test plan cannot be accepted"
    meaning: "The plan cannot be used as given. Its analysis date may fall before every customer's response is in, the amendment may change nothing, or the result may already have been read, so a plan made now would not be fixed in advance. A whole-programme readout never takes a plan or an earlier amount to adjust by: it is read only after its period has ended, so such a plan could not have been fixed in advance."
    fix: "Correct the item the message names. A plan must be registered, and amended, before the final result is read. For a whole-programme readout, send it again without the plan and the earlier amount; the plain difference is given."
  PLAN_UNDERPOWERED:
    title: "The test may be too small to see the effect you expect"
    meaning: "With this many customers contacted and kept back, an effect of the size you entered would often be missed and read as 'no clear effect'. This is a warning, not a block."
    fix: "Keep back more customers, run the campaign to more of them, or plan for a larger effect. Otherwise go ahead knowing that a 'no clear effect' result may be inconclusive."
  CAMPAIGN_EPOCH_MISMATCH:
    title: "The campaign's control group was redrawn"
    meaning: "This campaign kept a fixed control group of customers out. That group was redrawn (a new period started, at a lower share or with a new salt) before every customer's response was in, or the campaign's lists come from different periods or no longer match the period recorded with it. Customers in the control group may since have been contacted, so comparing the two groups would no longer show what the campaign changed, and no result is given."
    fix: "Measure campaigns whose lists come from one period of the control group. Before starting a new period, wait until the responses of the campaigns still running are in. A whole-programme readout is refused the same way when the shared control group was first used, or redrawn, after the period began: read a period that begins on or after the date the message gives."
  # --- Plan J M96: advisory checks on an uplift model's approval (DEC-1306 (f)) ------------------------
  UPLIFT_NOT_BETTER_THAN_RISK:
    title: "The campaign-effect model does not beat ranking by risk"
    meaning: "The model that predicts who a campaign changes was checked on test customers it never saw. It was compared with plain risk ranking: the approved risk model (the one that predicts who will have the outcome), or the model's own chance of the outcome without contact when there was none. Ranking by the predicted effect of contact did not do clearly better; the 95% range of the difference was not wholly above zero. Contact lists from this model are therefore ranked by the approved risk model, at the same number of contacts. With no approved risk model, the list keeps the model's own ranking and carries this warning."
    fix: "Approve a risk model for this use case so lists can fall back to it. Or retrain the campaign-effect model on more customers, or on a campaign with a clearer effect, and check that its test result beats risk ranking before approving it."
  UPLIFT_UNSTABLE_ACROSS_FOLDS:
    title: "The campaign-effect model is unstable across folds"
    meaning: "The model was refitted several times, each time leaving out one part (fold) of the training customers, and measured on the part it did not see. Either at least one refitted model did no better than random even allowing for the noise of that fold, or the folds' results differed more than noise explains, or a fold could not be measured. Its quality depends on which customers it happened to learn from. This check is advisory: it does not block approval."
    fix: "Train on more customers, use fewer columns, or try another model type, then look at each fold's result and range on the Approvals screen before approving."
  UPLIFT_MISCALIBRATED:
    title: "The predicted effect of contact does not match what was measured"
    meaning: "The test customers were split into ten groups by the predicted effect of contact. In fewer than 8 of the groups with enough contacted and held-back customers did the measured effect's 95% range contain the predicted effect. The ranking may still be useful, but the predicted number of extra responses should not be trusted as a forecast. This check is advisory: it does not block approval."
    fix: "Use the measured (expected) extra responses rather than the model's own prediction when planning, or retrain on more customers or a more recent campaign."
  # --- Plan J M97: the budget curve's query (DEC-1307 (i)); an API route error of api/routes/uplift.py --
  PROFIT_CURVE_QUERY_INVALID:
    title: "The budget curve was asked for the value of a conversion twice"
    meaning: "The budget curve was asked for with both value and value_per_conversion. They are two names for the same setting, the money one extra response is worth, so the request does not say which to use."
    fix: "Give one of the two, value or value_per_conversion, and ask for the budget curve again."
  # --- Plan J M98: the treat list's refusal (DEC-1308 (k), (o)); an API route error, also raised by the
  # budget curve, campaign and measurement routes ------------------------------------------------------------
  RUN_NOT_SCORED:
    title: "This run has no finished scores to work from"
    meaning: "What you asked for (the treat list, the budget curve, a campaign or its results) is built from the customers a scoring run scored. This run cannot give it: it trained a model instead of scoring customers, it has not finished yet, it did not save the settings it was scored with, or its scores file is no longer kept. The message says which."
    fix: "Wait for the scoring run to finish, or choose a finished scoring run. If its scores file was removed when the keep period ended, score the customers again."
  # --- Plan J M99: the action catalogue and consent per channel (DEC-1309 (c), (j), (k), (m)) --------------
  CATALOGUE_ACTION_UNKNOWN:
    title: "The use case names an action the catalogue does not have"
    meaning: "A band's action_id, the treat_action_id of a campaign-effect use case, or a cost lookup names an action that configs/decide/catalogue.yaml does not declare, or there is no catalogue at all. The message lists the ids the catalogue does declare."
    fix: "Add the action to configs/decide/catalogue.yaml, or correct the id in the use case."
  ACTION_DLT_TEMPLATE_MISSING:
    title: "An SMS action has no registered DLT template"
    meaning: "The catalogue's region (configs/regions/<region>.yaml) requires a DLT template id for SMS. This action is sent by SMS and has no id, or still has the example's placeholder, such as <your DLT template id>."
    fix: "Enter the template id registered with your DLT operator for this action in configs/decide/catalogue.yaml."
  # Plan K M131 (DEC-1323 (a)): an automated call or IVR action the region requires to be declared
  ACTION_A2P_UNDECLARED:
    title: "An automated call or IVR action is not declared to the operator"
    meaning: "The catalogue's region (configs/regions/<region>.yaml) requires a2p_declared: true on every action sent by call or ivr. India's file does, following the TRAI Third Amendment, in force about 30 days after its Gazette publication (expected late October 2026). This action is sent on one of those channels and the field is missing or false. The message names the action's position, channel and region and the field. This describes what the product checks and is not legal advice."
    fix: "Set a2p_declared: true on the action in configs/decide/catalogue.yaml once its calls are declared to the operator as automated (A2P) calls. The value must be a real true: a quoted \"true\", 1 or \"yes\" is refused. If people dial these calls by hand, move the action to another channel name, such as telecaller."
  CATALOGUE_INVALID:
    title: "The action catalogue is not valid"
    meaning: "The file configs/decide/catalogue.yaml failed its checks. Possible causes: a missing or unknown field, the same action_id twice, channels that are not a list of channel names (lower case letters, digits and _), or a field the region requires that is missing or still a placeholder. The message names the field."
    fix: "Correct the field the message names in configs/decide/catalogue.yaml. The file configs/decide/catalogue.example.yaml shows every field."
  CONSENT_CHANNEL_INVALID:
    title: "A consent row names a channel that is not a channel name"
    meaning: "A row of the imported consent file has a channel that could never match a configured channel, such as e-mail or text msg, so the customer's opt-out would never apply. A channel name is lower case letters, digits and _, such as sms or email; case and spaces around it are ignored. The row is refused rather than stored, and each such row is reported, like a row with an unreadable status."
    fix: "Correct the channel in the rows reported, or leave it empty for a record that applies to every channel, then import the file again."
  # Plan K M131 (DEC-1323 (b)): a consent row whose basis or operator_registered cell cannot be read
  CONSENT_BASIS_INVALID:
    title: "A consent file row has an unknown basis"
    meaning: "The basis column records how the consent was obtained and must be explicit, inquiry or legacy, in any letter case. A row of the imported consent file has another value. The row and the column are reported; the value itself is not repeated. The row is refused rather than stored, like a row with an unreadable status."
    fix: "Correct the basis in the rows reported, or leave it empty where it was not recorded, then import the file again. The import is all or nothing unless you choose to import the readable rows only."
  CONSENT_REGISTERED_INVALID:
    title: "A consent file row has an unreadable operator_registered flag"
    meaning: "The operator_registered column says whether the consent is held on the telecom operators' digital platform and must be true, false, yes, no, 1 or 0 (1.0 and 0.0 are also read, as a Parquet column with gaps is written). A row of the imported consent file has another value. The row and the column are reported; the value itself is not repeated."
    fix: "Correct operator_registered in the rows reported, or leave it empty where it was not recorded, then import the file again. The import is all or nothing unless you choose to import the readable rows only."
  # --- Plan J M100: a model that chooses between several offers is never champion (DEC-1310 (h)) -----------
  MULTI_ARM_PROMOTION_REFUSED:
    title: "A model that chooses between several offers is not made champion"
    meaning: "This campaign-effect model was trained on several offers against one held-back group. The rule that picks the champion compares models of one offer only, so this model stays a candidate. It is not made champion by its training run, and it is not made champion when you press Promote on the Models page. The same refusal appears when the model's record and the settings of the run that trained it cannot be read, because then nobody can check that it is a model of one offer."
    fix: "Score with this model by naming its version on the scoring run. To make a model champion by hand, train it with one offer: leave the treatment_levels setting of the campaign-effect use case empty. If the message says the model's record cannot be read, try again; if it keeps happening, train the model again."
  # --- Plan J M100 part B: the offer chosen per customer, and consent columns kept out of the model (DEC-1310 (r), (y))
  OFFER_CHOICE_NOT_MADE:
    title: "No offer was chosen for each customer"
    meaning: "This scoring run used a model of several offers, but it had no value per response to compare the offers by. Without that value it cannot tell which offer is worth more for a customer, so it chose no offer per customer. The treat list is the first offer's list, as for a model of one offer. The file offer_choice.json says so. This is a note on the run, not a failure."
    fix: "In the campaign-effect use case's policy, set the money one extra response is worth (value_per_conversion), or name a column of customer values (value_column), then score again."
  CHANNEL_COLUMN_MODEL_INPUT:
    title: "The model uses a channel's consent column as an input"
    meaning: "The model chosen for this scoring run was trained with a column that this use case uses to record whether a customer agreed to be contacted on a channel, or can be reached on it (actions.suppression.channels), as one of its inputs. The message names the columns. Whether someone agreed to be contacted must not decide how they are ranked, so this model cannot score for this use case. The run stops before it scores anyone."
    fix: "Train the model again. Training now leaves each channel's consent and contactable columns out of the model's inputs. Then score with the new version."
  # --- Plan J M101: one action per customer across use cases (DEC-1311) ------------------------------------
  NO_RUNS_TO_ARBITRATE:
    title: "No finished scoring runs to arbitrate"
    meaning: "There is no finished scoring run to arbitrate across: no use case was named and no use case has a scoring run that has finished. (A use case named in the request that has no finished scoring run is reported by name instead.)"
    fix: "Score at least one use case, wait for the run to finish, then arbitrate again."
  PRIMARY_KEY_MISMATCH:
    title: "The use cases do not share a customer key"
    meaning: "The runs identify customers by different columns, so one customer cannot be matched across them and nobody can be given one action across the use cases. The message names the columns of each."
    fix: "Arbitrate runs that identify customers by the same customer id column (and the same date column, if the runs use one)."
  ARBITRATION_USE_CASE_REPEATED:
    title: "One use case was named twice"
    meaning: "Two of the chosen runs are for the same use case, so its customers would be counted twice."
    fix: "Choose one run per use case, then arbitrate again."
  ARBITRATION_NOT_FOUND:
    title: "No arbitration to show"
    meaning: "No arbitration has been run yet, or its customer list has been removed under the retention rules from every run that took part."
    fix: "Run the arbitration again to make a new list."
  ARBITRATION_CONFIG_INVALID:
    title: "The arbitration settings file could not be read"
    meaning: "The arbitration settings file (decide/arbitration.yaml) is there but could not be read. The message names the setting to correct: for example a negative channel cap, a contact cap below 1, a misspelt setting, or a file that is not valid YAML. The arbitration does not run until the file is fixed, so the caps and priorities you wrote are never silently dropped."
    fix: "Correct the setting the message names, or remove the file to use the defaults (every use case equal, one action per customer, no channel caps). The file configs/decide/arbitration.example.yaml shows every setting."
  # --- Plan J M102: campaigns measured on an amount such as revenue (DEC-1312 (e), (f)) ----------------------
  COVARIATE_NOT_BEFORE_CAMPAIGN:
    title: "The figure used to adjust may include the campaign's effect"
    meaning: "The figure used to adjust the result may come from after the campaign started, so it could already include what the campaign changed. Either the earlier amount (for example last quarter's revenue) is dated on or after the day a customer was contacted or has no date column, or the scoring run whose prediction the test plan registered finished after the campaign started or never finished. Nothing was measured or stored."
    fix: "Use an amount measured before each customer was contacted, dated at least one day before the contact, and name its date column. Register the scoring run's prediction only for a campaign whose scoring run finished before the campaign started."
  OUTCOME_SKEWED:
    title: "A few very large amounts make the range less reliable"
    meaning: "Most customers spent little or nothing and a few spent far more, so with this many customers the range around the result may be too narrow. The numbers are kept and nothing was capped."
    fix: "Wait for more customers, or read the range as approximate."
  # --- Plan J M103: auditing a past campaign, the contact file and the programme readout (DEC-1313 (a), (f), (i))
  AUDIT_ARM_UNREADABLE:
    title: "The group column could not be read as contacted against held back"
    meaning: "The column that says who was contacted and who was held back has values that cannot be sorted into two groups, or some values are neither a held-back value nor a contacted one. Nothing was measured or stored. The message says which values."
    fix: "Name the value that means held back with control_value (and, for several offers, list the contacted values with treated_values), or use 1/0, yes/no or treated/control in the file."
  CONTACT_FILE_UNREADABLE:
    title: "The contact file could not be read"
    meaning: "The file that says who was actually contacted lists a customer twice, has no readable contact column, or has values that cannot be read as contacted or not. No contact rate was worked out and nothing was stored. The message names the problem."
    fix: "List each customer once, pick the column that says whether each customer was contacted, and name the value that means contacted if it is not 1, yes or true."
  PROGRAMME_NO_HOLDOUT:
    title: "No shared control group to read the whole programme against"
    meaning: "The whole programme is compared with the customers that one control group shared by every use case (the universal control group) keeps back. None has been used yet, or this deployment has no control group secret salt set (MARKETING_AI_HOLDOUT_SALT), so nothing was measured or stored."
    fix: "Set each use case's control group scope to universal, ask your administrator to set the salt, and score once. Then read a period that begins on or after that day."
  # --- Plan J M104: the Value Proof Pack (DEC-1314 (b), (f), (i)) ------------------------------------------------
  PROOF_SYNTHETIC_DATA:
    title: "No Value Proof Pack for generated data"
    meaning: "This campaign was measured on generated data (a scoring run, an outcomes file, an audit, a programme readout or a contact file marked as generated), where the effect was planted. A Value Proof Pack is drawn only from a client's own data, so none is made for it."
    fix: "Measure the campaign on the client's own files: upload them without the generated mark, add them to the campaign and measure it again."
  PROOF_NOT_MATURE:
    title: "The Value Proof Pack appears once the campaign's final result is in"
    meaning: "The campaign has not been measured yet, some customers' outcome period had not ended when it was measured, or the stored result is an early look read before the date its test plan fixed."
    fix: "Measure the campaign on or after the day shown, once every customer's outcome period has ended (and on or after the plan's reading date when it has one). The pack appears as soon as that final result is stored."
  PROOF_NOT_TRACEABLE:
    title: "This Value Proof Pack cannot be shown"
    meaning: "A number in the pack, or a digit in its words, could not be traced back to the measured record it was read from. So nothing is shown rather than a number nobody can check."
    fix: "Measure the campaign again so its records are written together. If it happens again, tell your administrator: a stored record may have been changed by hand."
  PROOF_SUPPRESSION_INVALID:
    title: "That group is not flagged as backfiring"
    meaning: "The group named for leaving out of the next cycle is not one this campaign's Value Proof Pack flags as backfiring in its latest measurement, so there is no suggestion to approve for it."
    fix: "Open the campaign's Value Proof Pack and approve one of the suggestions it lists. If the campaign was measured again, the suggestions are the new measurement's."
  # --- Plan J M105: warnings and the value proven to date on Results (DEC-1315 (b), (h), (j)) -----------------------
  # PLAN_UNDERPOWERED, DRIFT_DRIFTED and UPLIFT_NOT_BETTER_THAN_RISK are reused as cards with their entries above.
  CAMPAIGN_NO_CONTROL:
    title: "Nobody was held back, so this campaign cannot be measured"
    meaning: "Nobody was kept out of this campaign as a control group, so there is nothing to compare the contacted customers with and what the campaign changed cannot be measured. It is never counted in the value proven to date."
    fix: "Keep a random group of customers out of the next campaign so that its effect can be measured."
  CAMPAIGN_EARLY_LOOK:
    title: "This result was read early"
    meaning: "The campaign was measured before the day its test plan fixed for the final reading, so the result can still move and is not a final verdict. It is not counted in the value proven to date."
    fix: "Measure the campaign again on or after the planned day, and decide only then."
  CONTROL_GROUP_CONTACTED:
    title: "Customers kept back were contacted anyway"
    meaning: "At least one in twenty of the customers in the control group was contacted, so the difference between the groups understates what the campaign does."
    fix: "Find out how they were reached and keep the control group out of every channel next time."
  CHALLENGER_READY:
    title: "A new model is waiting for approval"
    meaning: "A newly trained model for this use case waits for someone to approve it before it is used for any list."
    fix: "Open the approvals to compare it with the model in use, then approve or decline it."
  GROUP_BACKFIRED:
    title: "A group of customers did worse because of the campaign"
    meaning: "The measured difference for this group lies wholly on the harmful side, even allowing for the number of groups checked. When the groups were random only by your statement, the card says so and reads as 'if the groups were random as you said'."
    fix: "Open the campaign's Value Proof Pack and, if you agree, approve leaving this group out of the next cycle. Nothing is applied automatically."
  EFFECT_FADING:
    title: "The effect of the campaign is falling from one cycle to the next"
    meaning: "Across at least three final cycles of this use case (randomised by the engine or verified), the measured effect has fallen by more than chance would explain: the whole 95% range of the trend lies below zero and the latest effect is below the first. Campaigns that measure the same customers count as one cycle."
    fix: "Refresh the offer or the message, check that the customers contacted have not changed, and keep the control group in place to see whether the effect recovers."
  SUMMARY_NOT_TRACEABLE:
    title: "The summary of campaigns cannot be shown"
    meaning: "A number in the warnings or in the value proven to date, or a digit in their words, could not be traced back to the measured record it was read from, so nothing is shown rather than a number nobody can check."
    fix: "Measure the campaign again so its records are written together. If it happens again, tell your administrator: a stored record may have been changed by hand."
  # --- Plan J M108: cost before each run, with a cap (DEC-1318 (e), (f), (l)) ------------------------------------------
  RUN_COST_NEEDS_CONFIRMATION:
    title: "This run needs your confirmation before it starts"
    meaning: "Your administrator set a limit on what one run may cost, and this run could cost more than that, or its cost could not be worked out. Nothing was started. The message shows the most it could cost at the cloud's published price list; that is an estimate, not a bill. A scheduled run cannot be confirmed by a person, so it is not started."
    fix: "If you accept the cost, start it again and choose Start it anyway; a run is stopped when its running cost reaches the limit. For a scheduled run, ask an administrator to raise the limit or to refresh the price list."
  RUN_COST_CAP_REACHED:
    title: "This run was stopped at its cost limit"
    meaning: "The run was stopped because the cost it had run up so far reached the limit your administrator set for a single run. The message shows the limit and about how much it had cost at the cloud's published price list (an estimate, not a bill). The steps it had finished stay on its record, but a stopped run gives no results."
    fix: "To run it again, ask an administrator to raise the limit."
  # --- Plan J M106: learn the next model from the last cycle (DEC-1316 (e), (f)) ---------------------------------------
  LEARN_NO_OVERLAP:
    title: "Nothing to learn from for customers outside the list"
    meaning: "The last cycle cannot show what a contact changes for customers who were not on its list. Either it contacted none of them at random, or the outcomes file covers the contacted and the not-contacted customers unevenly, or it leaves too few of them. A model learned from it would only be guessing for those customers, so nothing was learned and nothing was written."
    fix: "Upload outcomes for every customer the cycle scored, contacted or not. Or set an explore share of 5% or more (actions.explore_fraction) for the next cycle and learn from that one. Or train on a file from a randomised campaign."
  # --- Plan J M109: events noted against a scoring run's drift report (DEC-1319 (e), (h)) -----------------------------
  DRIFT_NOT_MEASURED:
    title: "This run has no measure of how much the customers changed"
    meaning: "Events can only be noted on a run that scored customers against a trained model and measured how much they changed since the model was trained. This run has no such measure, so there is no change for an event to explain."
    fix: "Open a scoring run, or score a list first, then note the event there."
  DRIFT_ANNOTATION_INVALID:
    title: "The event note could not be saved"
    meaning: "The note was empty, or it named a measure the change report did not compare."
    fix: "Write a short note, and name only the measures the change report compared. Leave the list of measures empty if the event touched the customers as a whole."
  DRIFT_ANNOTATION_NOT_FOUND:
    title: "No noted event with that id"
    meaning: "The event was already removed, or it belongs to a different run."
    fix: "Reload the page to see the events that are noted now."
  DRIFT_ANNOTATION_LIMIT:
    title: "This run already holds the most noted events"
    meaning: "A run holds at most 50 noted events, so this one was not added."
    fix: "Remove one that no longer matters before adding another."
  # --- Plan J M107: the monthly loop, read-only (DEC-1317 (a), (b), (e), (g)) --------------------------------------------
  PULL_INVALID:
    title: "That selection does not fit the connection"
    meaning: "The table, file, folder or date window you named cannot be read from this connection. Each request names exactly one table, file or folder. A date column must be one of the table's own columns, and both dates must be real dates. Nothing was read."
    fix: "Pick from what the connection lists and try again."
  PULL_NOTHING_FOUND:
    title: "Nothing to read there"
    meaning: "The folder you named holds no CSV or Parquet file, or the file you named is gone."
    fix: "Check that this month's export has landed in the folder the connection reads, then try again or wait for the next scheduled run."
  CYCLE_SERVICES_MISSING:
    title: "This deployment cannot run the monthly loop"
    meaning: "The treat list, measure and learn schedules need the campaign records, and for measuring the saved connections. This deployment does not give them to its scheduler, so nothing was done."
    fix: "Ask whoever runs the platform to start the scheduler with the API's services."
  LEARN_NOT_READY:
    title: "This campaign cannot teach a model yet"
    meaning: "To learn who to contact next time, the measured campaign needs a final result rather than an early look. It needs a yes/no outcome and enough customers who responded in both the contacted and the held-back groups. It also needs the file the scoring run read to still be stored. The message says which of these is missing."
    fix: "Supply what the message names and measure the campaign again; the next scheduled learn then tries again."
  # --- Plan K M132: the agent-safe core - tools, the policy, proposals and the decision ledger (DEC-1401) ---------
  POLICY_NO_RULES:
    title: "No rules allow this kind of proposal"
    meaning: "An agent proposed something the deployment has no rules for (for example, sending a message now). Anything without rules is refused."
    fix: "Nothing to do. If this kind of proposal should be possible, an Admin adds a rule set for it in configs/agentic/policy.yaml."
  POLICY_PAYLOAD_INVALID:
    title: "The proposal is not in the expected form"
    meaning: "The proposal has a field its kind does not have, or lacks one it needs, so it cannot be checked and is refused."
    fix: "Have the agent draft it again with the fields the message names."
  POLICY_HOLDOUT_IMMUTABLE:
    title: "The proposal would change the control group"
    meaning: "The proposal would hold back fewer customers than the share in force, hold back no one, contact customers who are held back, or choose who is held back another way than the use case does (a fresh draw for each run instead of the lasting group, or one lasting group for another). No agent can change who is held back."
    fix: "Keep the share held back, and the way it is chosen, as the use case sets them. Only an Admin changes them, in the use case settings."
  POLICY_BUDGET_CAP:
    title: "The proposal is over budget"
    meaning: "The run's cost estimate is above the cost cap (or cannot be worked out while a cap is set), the offers would cost more than the offer budget, or the plan contacts more customers than the contact budget allows."
    fix: "Propose fewer contacts or cheaper offers. Raising a budget or confirming an unpriced run is a person's decision, not an agent's."
  POLICY_CONSENT_CHANNEL:
    title: "Not everyone the plan would contact may be contacted on this channel"
    meaning: "The plan would contact more customers on the channel than the scoring run found contactable there. Or the run did not record who may be contacted on this channel, or could not read one of the channel's configured columns, so consent was never checked. Customers who opted out of a channel are already left off its list and do not count against a plan."
    fix: "Propose no more contacts than the run's contactable customers on that channel, or use a channel the run recorded. Add the missing consent column to the scoring file and score again."
  POLICY_FREQUENCY_CAP:
    title: "Too many contacts"
    meaning: "The plan contacts each customer more often than the contact cap allows, or sends more on a channel than that channel's cap (configs/decide/arbitration.yaml)."
    fix: "Propose one contact per customer, or fewer contacts on the channel."
  POLICY_TEST_NOT_REGISTERED:
    title: "The campaign has no frozen test plan, or another one"
    meaning: "A campaign plan must rest on the campaign's test plan, fixed in advance. This campaign has none, or the plan the proposal cites is not the one frozen."
    fix: "Register the campaign's test plan first, then propose again citing it."
  POLICY_TEST_PLAN_FIXED:
    title: "This campaign's test plan can no longer be set this way"
    meaning: "The campaign already has a different frozen test plan, or it was measured before any plan was registered. A new plan proposed now could not be registered, so it is refused instead of being sent to an Approver."
    fix: "To change a frozen plan, file an amendment with a reason. A campaign already measured cannot get a plan fixed in advance. Plan the next campaign before its results are read."
  POLICY_ROLE_SEPARATION:
    title: "Someone else has to approve this"
    meaning: "The proposal was made for you, so you cannot approve it yourself. Another person with the Approver role must decide."
    fix: "Ask another Approver to approve or reject it."
  TOOL_UNKNOWN:
    title: "There is no such tool"
    meaning: "An agent asked for a tool the product does not have. Only the listed read and propose tools exist, and none of them sends anything."
    fix: "Use one of the listed tools."
  TOOL_INPUT_INVALID:
    title: "The tool was asked the wrong way"
    meaning: "The request to the tool has a field it does not accept, a value in the wrong form, an id that is not a plain id, or cites evidence no tool produced."
    fix: "Ask again with the fields the message names. Cite only evidence ids that a tool returned."
  TOOL_ROLE_REQUIRED:
    title: "Your role does not allow this"
    meaning: "The agent acts for you, and you do not hold the role this needs (for example, only an Analyst can have a proposal drafted). An agent never sees or does more than you could."
    fix: "Ask an Admin for the role, or ask someone who holds it."
  TOOL_OUTPUT_TOO_LARGE:
    title: "The answer would be too large"
    meaning: "A tool returns totals and counts, never customer rows, and this answer would exceed its size limit (16 KB)."
    fix: "Ask a narrower question, for example one band or one channel."
  TOOL_ARTEFACT_UNREADABLE:
    title: "A stored result could not be read"
    meaning: "The result the tool needs is stored but cannot be read. It may be a partial write or a file from an older version. The tool does not report it as \"not computed\", because that would be untrue."
    fix: "Compute it again through the screen or route that writes it (for example, measure the campaign again). If it happens again, tell your administrator and name the file shown."
  PROPOSAL_NOT_FOUND:
    title: "There is no such proposal"
    meaning: "The proposal named does not exist. It may have been made in another workspace."
    fix: "Open it again from the list of agent proposals."
  PROPOSAL_NOT_PENDING:
    title: "This proposal was already decided"
    meaning: "Only a pending proposal can be approved or rejected. This one was already approved, rejected, refused or has expired."
    fix: "Nothing to do. If it is still wanted, have the agent draft it again."
  PROPOSAL_EXPIRED:
    title: "This proposal expired"
    meaning: "Nobody decided on it within the allowed days (14 by default), so it can no longer be approved. The facts it rested on may have changed."
    fix: "Have the agent draft it again, so it is checked against today's facts."
  PROPOSAL_STALE:
    title: "The campaign changed since this was proposed"
    meaning: "The plan proposed is no longer the plan the campaign would get. The campaign's assignment changed, or the plan registered was not the one proposed. So it was not approved."
    fix: "Have the agent draft the plan again from the campaign as it is now."
  PROPOSAL_TAMPERED:
    title: "This proposal was changed after it was drafted"
    meaning: "The stored proposal does not match what the decision record wrote when it was drafted (what it proposes, who it was for, the evidence it cites, or its dates). It cannot be approved, and nothing was done."
    fix: "Have the agent draft it again. If nobody changed it on purpose, tell your administrator: proposal files should only be changed by the product."
  PROPOSAL_NOT_EXECUTABLE:
    title: "Nothing can carry this proposal out yet"
    meaning: "The proposal passed the rules, but the product cannot yet carry out proposals of this kind (campaign plans arrive in a later release). It stays pending and on the record."
    fix: "Nothing to do now. Carry the plan out yourself through the usual screens if it is wanted."
  LEDGER_CHAIN_BROKEN:
    title: "The decision record was changed"
    meaning: "An entry in the decision record was edited, removed or added out of order, or a checkpoint you kept is no longer in it. Each entry is chained to the one before, so any change shows up. The check names the first bad entry."
    fix: "Tell your administrator at once and keep the checkpoint from your last approval receipt. Restore the record from a backup taken before the bad entry."
  LEDGER_SIGNATURE_INVALID:
    title: "A signed decision does not verify"
    meaning: "An approval, a frozen test plan or an evidence label in the decision record is unsigned, or its signature does not match the signing key."
    fix: "Check that the verification uses the deployment's own signing key. If it does, tell your administrator: the entry was changed or forged."
  AGENTIC_DISABLED:
    title: "Agent proposals are switched off"
    meaning: "This deployment has agent tools and proposals turned off (agentic.enabled is false), which is the default. Nothing about agents is reachable."
    fix: "An Admin turns them on in configs/agentic/agentic.yaml if the deployment should use them."
  CONFIG_INVALID:
    title: "A settings file cannot be used"
    meaning: "A settings file is missing, cannot be read, or has a value that is not allowed. Examples are a use case setting or the agent files under configs/agentic: agentic.yaml (Plan K's three switches, including mcp.enabled for the MCP server), policy.yaml (the agent policy) and mcp.yaml (the MCP server's workspace, demo use cases, rate limits and call timeout; min_group_rows is fixed at 10); and configs/compliance/compliance.yaml (the compliance gate's settings; its switch, compliance.gate.enabled, is in agentic.yaml). Unknown settings are refused, not ignored. The message names the file and the setting."
    fix: "Correct the setting named, or restore the file, then try again. Removing mcp.yaml uses its defaults."
  RUN_NOT_FOUND:
    title: "There is no such run"
    meaning: "The run named does not exist, or it was recorded in another workspace."
    fix: "Open the run again from the Runs page, or check the run id."
  # --- Plan K M136: Estimated figures pooled across comparable campaigns (DEC-1402 (e), (f)) -----------------------------
  POOL_TOO_FEW:
    title: "Not enough comparable campaigns to estimate"
    meaning: "An Estimated figure draws a campaign's measured difference towards the average of comparable campaigns: the same use case, outcome and window, channels and offers, group of held-back customers and client, with groups chosen at random. That needs at least four of them with a final result, or more if configs/measurement.yaml sets min_campaigns higher; with three, the method cannot move the figure yet. Until there are enough, the campaign is shown only as measured. Nothing is wrong with the campaign."
    fix: "Measure more comparable campaigns; the Estimated figure appears once there are enough."
  POOL_NO_SPREAD:
    title: "Comparable campaigns differ by no more than chance"
    meaning: "A warning, not an error. The comparable campaigns' results differ by no more than chance explains, so each Estimated figure is drawn as far towards their average as the method allows ((k-3)/(k-1) of the way for k campaigns). This usually means there is too little data to tell the campaigns apart, not that their effects are equal. The measured figures, and the value proven to date, are unchanged."
    fix: "Read the measured figures first. The Estimated figures become more telling as comparable campaigns gather more customers."
  # --- Plan K M138: an early harm alarm, never an early win (DEC-1403 (f), (i)) -------------------------------------------
  HARM_ALARM:
    title: "This campaign may be doing harm"
    meaning: "Before the day the campaign's test plan fixed for the final reading, the customers who were contacted are doing worse than the customers held back. The gap is larger than chance explains, even though the campaign is checked at every reading. This is an alarm, not a result, and nothing has been stopped. The result itself is still read only on the planned day. The alarm is checked only when harm_alarm.enabled is true in configs/measurement.yaml (it is off by default), and only for a campaign whose registered test plan gives a smallest effect worth detecting. A benefit never raises it."
    fix: "Open the campaign and decide whether to pause it. If you go on, the final result is still read on the planned day."
  # --- Plan K M133: the verifier over MCP, demo data only (DEC-1404) ------------------------------------------------------
  MCP_DEMO_ONLY:
    title: "The MCP server answers about the demo library only"
    meaning: "Until client data is connected (M141), the MCP server at /mcp answers only about the demo library: the public datasets in library/ (for example Hillstrom) and generated data. It refused because the workspace is not 'demo', the request named another workspace, or the run or campaign asked about is not demo data. A run or upload counts as demo data when it was filed under one of mcp.demo_use_cases or marked as generated, and never when it belongs to an onboarded client. You get the same answer when the id names nothing, so the server never reveals which ids exist."
    fix: "Ask about a demo run or campaign. To serve client data, wait for M141's per-client scoping; until then keep mcp.enabled off on a deployment that holds client data."
  MCP_SCOPE_DENIED:
    title: "This sign-in cannot use that MCP tool"
    meaning: "Each MCP tool needs a scope, and the scope comes from the signed-in person's role. Every signed-in person holds marketing-ai:read. marketing-ai:propose, which drafts a test plan for a person to approve in the product, needs the Analyst role. No scope approves anything, and an Approver or Admin role adds no MCP scope."
    fix: "Connect the client with the token of a person who has the role the tool needs, or use a read tool."
  MCP_RATE_LIMITED:
    title: "Too many MCP calls from this sign-in"
    meaning: "Each signed-in session has a budget: mcp.rate_limit.calls_per_minute calls in any 60 seconds (60 by default) and mcp.rate_limit.concurrent_calls running at once (2 by default). This call went over one of them. The answer carries marketing-ai/retry_after_seconds. The limits are counted per API process."
    fix: "Wait that long and call again, or make fewer calls at once."
  MCP_TIMEOUT:
    title: "The MCP tool took too long"
    meaning: "A long tool (audit_campaign, or get_proof_pack, which draws the Value Proof Pack on request) runs while the client waits, because the MCP version in use has no way to hand back a job to collect later, and it is refused after mcp.call_timeout_seconds (120 seconds by default). Work that has been started cannot be stopped, so it keeps its place in the session's limit of calls at once until it ends."
    fix: "Ask again later, ask a narrower question, or raise mcp.call_timeout_seconds in configs/agentic/mcp.yaml."
  MCP_GROUP_TOO_SMALL:
    title: "The campaign holds a group too small to show"
    meaning: "No figure about a group of 1 to 9 customers is served over MCP (Plan I's small-group rule). This campaign has such a group in one of three places: its totals (contacted, held back or intended), one offer's group in its stored measurement, or one group in its results per group of customers. The Value Proof Pack prints those figures as text, which cannot be partly hidden, so measure, audit_campaign and get_proof_pack all refuse the campaign."
    fix: "Nothing to do over MCP. A person with access can read the campaign in the product, where the usual rules apply."
  MCP_RESULT_WITHHELD:
    title: "The result held outside text in a field that must be filled"
    meaning: "Results served over MCP pass a text check that withholds instruction-like text and masks personal data from outside the product. This result had such text in a field that must be filled, so withholding it left a result that is not complete, and the whole result was withheld."
    fix: "Find the outside text (a column name, an offer's name or a file name) in the product and rename it, then ask again."
  MCP_NOT_STARTED:
    title: "The MCP server is not running yet"
    meaning: "A request reached /mcp before the server had started with the app, or after it had stopped."
    fix: "Try again in a moment. If it persists, check that the API started cleanly and that configs/agentic/mcp.yaml is valid."
  MCP_TOOL_FAILED:
    title: "An MCP tool failed inside the product"
    meaning: "An unexpected fault happened inside the tool. Nothing was changed. The MCP client gets only this code, never the error's message. The failure is in the API log (tool name and error type) and in the audit log (mcp.tool_call, outcome failed)."
    fix: "Look up the log line for the call. If the stored file the tool reads is damaged, run again the step that wrote it."
  AUTH_REQUIRED:
    title: "Sign in to do this"
    meaning: "The request carried no valid signed-in session. An expired or signed-out token gets the same answer. For the MCP server at /mcp the answer is 401 with WWW-Authenticate: Bearer."
    fix: "Sign in again. For the MCP server, get a token with POST /auth/login and send it as 'Authorization: Bearer <token>' on every request."
  AUTH_NOT_CONFIGURED:
    title: "Sign-in is switched off on this deployment"
    meaning: "Some parts of the product never run without sign-in, and the MCP server at /mcp is one of them: it answers 503 while MARKETING_AI_AUTH_MODE=off, even on a laptop, and never acts as the local operator."
    fix: "Set MARKETING_AI_AUTH_MODE=local (or the deployment's identity provider), create users and connect with a signed-in token."
  # --- Plan K M144: the save-desk card, as a randomised pilot design (DEC-1411) -------------------------------------------
  SAVE_DESK_NO_TREAT_LIST:
    title: "This run's contact list has not been built yet"
    meaning: "The save-desk card reads the run's contact list (treat list) and never builds it, because building one over a large file would slow the desk."
    fix: "Open the run's Results page or its treat_list.csv once so the list is built, then ask for the card again."
  SAVE_DESK_CUSTOMER_NOT_FOUND:
    title: "That customer is not in this run's contact list"
    meaning: "No row of this run's contact list has that key. The customer may have been erased, may not have been scored in this run, or the key may be written differently in the run (for example with a different number of leading zeros or another date format)."
    fix: "Check the key against the run's own customer column, then ask again."
  SAVE_DESK_KEY_INVALID:
    title: "The customer key cannot be used for this run"
    meaning: "The key is empty, longer than 200 characters, or has the wrong number of parts. A run identified by several columns (for example customer and date) takes the parts in the run's order, joined by a vertical bar. The message never repeats the key you typed."
    fix: "Type the key again with one part for each of the run's key columns, in the run's order."
  SAVE_DESK_KEY_AMBIGUOUS:
    title: "More than one row has that key"
    meaning: "The run's contact list has two or more rows with exactly that key, so no single customer can be shown and the card will not guess."
    fix: "Ask the data owner to check the customer file for repeated keys and score again."
  SAVE_DESK_RATE_LIMITED:
    title: "Too many cards asked for in a minute"
    meaning: "One signed-in person may ask for a limited number of save-desk cards per minute (configs/agentic/save_desk.yaml, rate_limit_per_minute, 30 by default). The card is for one customer in front of one agent; looking customers up in a loop is how a copy of the customer list is made."
    fix: "Wait the number of seconds in the message and try again."
  SAVE_DESK_NOT_IN_PILOT_ARM:
    title: "You are not in the group given the card in this pilot"
    meaning: "While a randomised pilot is active (configs/agentic/save_desk_pilot.yaml, status active), only the staff drawn in advance to have the card are served one, so that the comparison with staff working as usual stays fair. The draw is not redone during the pilot."
    fix: "If you think you should be in the card group, ask the pilot owner."
  # --- Plan K M139: the campaign planner and the claim checker (DEC-1406 (d), (a)) -------------------------------------
  CLAIM_DIRECTION:
    title: "A sentence said more than the numbers show"
    meaning: "The AI service wrote a comparison or a trend that the measured range does not support (for example, that one group did better when the range of the difference includes zero, or the opposite of what was measured). Every sentence of a drafted plan's summary is checked against the numbers before anyone sees it, so this sentence was dropped. More than one failed sentence replaces the whole summary with the one the product writes by rules."
    fix: "Nothing to do. Read the plan's figures, which come straight from the product; draft again if you want a new summary."
  CLAIM_LABEL:
    title: "A sentence gave a result the wrong kind of evidence"
    meaning: "The AI service called a figure Causal, Estimated, Descriptive or Not proven when the product's own tool labelled it otherwise (only a randomised comparison is Causal). The sentence was dropped; more than one failed sentence replaces the summary with the one the product writes by rules."
    fix: "Nothing to do. The label shown beside each figure is the product's own."
  CLAIM_UNREFERENCED:
    title: "A sentence pointed at something that is not there"
    meaning: "The AI service's sentence named a figure, a place in a figure or a proposal that the plan's evidence does not hold, so it could not be checked and was dropped. More than one failed sentence replaces the summary with the one the product writes by rules."
    fix: "Nothing to do; draft again if you want a new summary."
  CLAIM_FREE_TEXT:
    title: "A sentence put a number or a verdict in its own words"
    meaning: "Every number in a plan's summary is filled in by the product from the evidence. This sentence's own words carried a number (also spelled out, such as 'twice' or 'a third'), a direction ('up', 'more', 'improve'), a cause or a certainty ('because', 'sure'), or failed the product's text checks, so it was dropped."
    fix: "Nothing to do. The figures in the plan itself are the product's own."
  CLAIM_MALFORMED:
    title: "The AI service's summary could not be read"
    meaning: "The AI service did not answer in the structured form the planner asks for, so none of its sentences could be checked. The plan's summary is the one the product writes by rules from the same evidence, as it is when no AI service is connected."
    fix: "Nothing to do. If it happens often, check the AI service connection on the Settings page."
  PLANNER_NO_CANDIDATE:
    title: "No campaign can be planned yet"
    meaning: "The planner found nothing it can draft: no finished scoring run of the use case without a campaign yet, no run that recorded how many customers were held back, no channel on which anyone may be contacted, a list judged not safe to roll out, a spend over the budget or one that cannot be checked against it, or a smallest effect given in points for an outcome measured as an amount. The message says which."
    fix: "Do what the message names (for example score a new list, or set the channel's cost), then draft again."
  PLANNER_NOTHING_TO_PLAN:
    title: "This warning does not call for a new campaign"
    meaning: "The warning card asks for waiting (an early look, a model not yet ready) or for a person's decision (drift, a campaign that did harm), not for a campaign the planner could draft. Nothing was drafted."
    fix: "Follow the warning's own next step on the Results page."
  PLANNER_CARD_NOT_FOUND:
    title: "That warning is no longer on the Results page"
    meaning: "The planner looks the warning up again on the server before drafting, and it is gone: the situation it described has changed since the page was drawn."
    fix: "Reload the Results page and draft from a warning that is shown now."
  PLANNER_NOT_FOUND:
    title: "There is no such plan"
    meaning: "No drafted campaign plan has that id, or it was recorded in another workspace."
    fix: "Open the plan again from its warning card, or draft a new one."
  PLANNER_GOAL_UNPARSED:
    title: "The goal in words could not be matched to the form"
    meaning: "The goal you typed was read by the AI service, but it could not be matched to the form's own choices (a use case, an objective, a channel) or a number in it could not be read, so nothing was drafted."
    fix: "Fill in the form instead, or type the goal again naming the use case, the channel and any budget plainly."
  # --- Plan K M134: the pre-send compliance gate (DEC-1405 (b), (h); the switch, (a)) --------------------------
  COMPLIANCE_CONSENT:
    title: "Not contactable on this channel"
    meaning: "The compliance gate did not send this customer on this channel. The run's own channel_contactability.parquet says they cannot be contacted on it: an opt-out, no valid consent in the ledger, an inquiry consent past its validity, or a legacy consent not registered with the operators. The customer goes on the next planned channel the gate allows, else is not treated."
    fix: "Fix the consent record, or plan another channel."
  COMPLIANCE_WHATSAPP_NO_OPT_IN:
    title: "No opt-in record on this channel"
    meaning: "The channel is one of compliance.gate.opt_in_channels (WhatsApp by default). Such a channel needs a valid grant on that channel itself in the consent ledger. An all-channel grant is consent to be contacted, not an opt-in to the channel."
    fix: "Import the customer's WhatsApp opt-in (a consent record with channel: whatsapp), or send on another channel."
  COMPLIANCE_TEMPLATE_MISMATCH:
    title: "Message is not the registered DLT template"
    meaning: "The region requires a DLT template on this channel (for example SMS in India). The action's message_text is not its dlt_template_text with each {#var#}, {#numeric#}, {#alphanumeric#}, {#url#} or {#cbn#} slot filled by a value of that tag; a {#var#} value can be at most dlt_var_max_chars long, 30 by default."
    fix: "Correct the message or register the new text, then update the catalogue."
  COMPLIANCE_URL_NOT_WHITELISTED:
    title: "A link is not on the URL whitelist"
    meaning: "A link in the action's message_text is not on the client's whitelist (configs/compliance/url_whitelist.yaml, else the region file's url_whitelist block) for this channel. A link is an http(s):// or www. link, or a bare host such as deals-x.in/a, in the text or filling a {#var#} slot."
    fix: "Add the host or prefix to the whitelist, or change the link. Text written with no space after a full stop (Dr.Smith) reads as a host: add the space."
  COMPLIANCE_NO_CHANNEL:
    title: "No planned channel to clear"
    meaning: "The contact has no planned channel at all: neither the action's catalogue channels nor the use case's configured channels name one, so the gate has nothing to allow it on."
    fix: "Give the action channels in the catalogue, or configure actions.suppression.channels."
  COMPLIANCE_CATALOGUE_CHANGED:
    title: "Catalogue changed since the run"
    meaning: "configs/decide/catalogue.yaml is not the catalogue this scoring run ran under (catalogue_stamp.json), so no message can be tied to the run. The gate fails closed: every contact with a catalogue action is withheld."
    fix: "Restore the catalogue the run used, or score again under the new one."
  COMPLIANCE_SWITCH_MISPLACED:
    title: "The compliance gate's switch is in the wrong file"
    meaning: "configs/compliance/compliance.yaml sets compliance.gate.enabled, but that file holds only the gate's settings (the opt-in channels and the longest template value). The gate is turned on or off in configs/agentic/agentic.yaml, with Plan K's other switches. The setting is refused rather than ignored, so nobody believes they turned the gate on or off where it has no effect. No contact list is built until it is fixed."
    fix: "Remove enabled from configs/compliance/compliance.yaml and set compliance: gate: enabled in configs/agentic/agentic.yaml."

settings:
  actions.bands[*].min_score:
    meaning: Customers whose score is at or above this value go into this band and get its action. Raising it makes the band smaller and more certain.
  actions.control_group_fraction:
    meaning: A random share of eligible customers is deliberately not contacted, so the campaign's real effect can be measured by comparing the two groups later.
  actions.suppression.recently_contacted_days:
    meaning: Customers contacted within this many days are skipped, so nobody is contacted too often.
  actions.suppression.suppress_opted_out:
    meaning: Customers who opted out of marketing are never put on a contact list.
  actions.suppression.suppress_recently_contacted:
    meaning: Skip customers who were contacted recently (see the number of days).
  evaluation.calibration:
    meaning: Adjusts scores so that a score of 0.3 means roughly a 30% chance. Leave the default unless advised otherwise.
  evaluation.champion_min_improvement_pct:
    meaning: A new model replaces the one in use only if it is better by at least this much, so the model in use does not change for tiny gains.
  evaluation.fairness_column:
    meaning: Optionally compare results across the groups of one column (for example region), to see whether the model works equally well for each.
  evaluation.reasons_per_row:
    meaning: How many reasons are listed next to each customer's score.
  evaluation.shap:
    meaning: Work out, for each customer, which of their details raised or lowered their score, so every score comes with its reasons.
  evaluation.threshold.mode:
    meaning: How the cut-off between "flag" and "do not flag" is chosen. Automatic picks the cut-off that best balances catching cases against false alarms.
  evaluation.threshold.value:
    meaning: The fixed cut-off used when the threshold is set manually.
  features.auto_feature_engineering:
    meaning: Recorded with the run for a later release; it does not change results yet.
  features.categorical_encoding:
    meaning: Recorded with the run for a later release; it does not change results yet.
  features.max_features:
    meaning: Recorded with the run for a later release; it does not change results yet.
  features.numeric_scaling:
    meaning: Recorded with the run for a later release; it does not change results yet.
  features.selection:
    meaning: Recorded with the run for a later release; it does not change results yet.
  features.text_columns:
    meaning: Recorded with the run for a later release; it does not change results yet.
  governance.approval_required:
    meaning: A newly trained model is only used after a named person approves it.
  governance.consent_column:
    meaning: The column that says whether a customer agreed to marketing. Only customers marked true are contacted.
  governance.retention_days:
    meaning: How long uploaded data and results are kept before they are deleted.
  model_search.candidates:
    meaning: Which kinds of model the platform may try. Keeping the recommended choice lets it try them all and keep the best.
  model_search.ensemble:
    meaning: Combine the best few models into one, which is usually a little more accurate.
  model_search.folds:
    meaning: How many times the training data is re-split to check each model. More is steadier but slower.
  model_search.imbalance:
    meaning: How the platform deals with an outcome that is rare (for example, when only a few customers leave).
  model_search.metric:
    meaning: The measure used to pick the best model. The default suits this use case.
  model_search.strategy:
    meaning: How hard the platform searches for a good model. Faster searches finish sooner; thorough ones may find a slightly better model.
  model_search.time_limit_minutes:
    meaning: The longest the search for a model may run.
  model_search.tuning_trials:
    meaning: How many variations of each model are tried. More can help a little and takes longer.
  monitoring.drift_psi_threshold:
    meaning: How far new customers may move from the ones the model learned on before a warning is raised. Lower values warn sooner.
  monitoring.performance_alert_drop_pct:
    meaning: An alert is raised when measured results fall by more than this share compared with the test results.
  monitoring.retraining:
    meaning: Recorded with the run for a later release; it does not change results yet.
  prepare.deduplicate:
    meaning: Remove rows that are exact copies of each other before learning.
  prepare.exclude_columns:
    meaning: Columns listed here are never used to learn from (for example internal codes).
  prepare.missing_values:
    meaning: What to do with empty cells before learning. The default lets the platform handle them.
  prepare.outliers:
    meaning: What to do with extreme values (for example a bill a hundred times the usual amount).
  prepare.pii_handling:
    meaning: What happens to columns that look like personal details. They are masked or dropped and never learned from.
  split.group_column:
    meaning: Rows with the same value here (for example the same customer) are kept together when the data is divided into learning and testing parts.
  split.test_fraction:
    meaning: The share of customers kept aside to test the model on data it never saw.
  split.time_column:
    meaning: The date column used to test on the most recent period.
  split.type:
    meaning: How customers are divided into learning and testing parts - at random, or by date so the test is on the most recent period.
  split.validation_fraction:
    meaning: The share of customers used to choose between models during learning.
  validation.leakage_check:
    meaning: Look for columns that contain the answer (recorded after the outcome), which would make results look better than they will be.
  validation.min_positive:
    meaning: The fewest past examples of the outcome needed before the platform will learn.

terms:
  model: A set of rules learned from past customers that gives each customer a score.
  score: A number from 0 to 1; higher means the outcome is more likely for that customer.
  champion: The model currently approved for use.
  decile: One tenth of customers, after sorting them from highest to lowest score. Decile 1 is the top 10%.
  lift: How many times more cases a group contains than a random group of the same size. A lift of 3 means three times as many.
  baseline: A simple model used as a yardstick; the platform's model should beat it.
  control group: Customers chosen at random and deliberately not contacted, so the campaign's effect can be measured against them.
  incremental: Caused by the campaign - the difference between contacted customers and the control group.
  confidence interval: The range the true value very probably lies in. A range that does not include zero means the effect is real, not luck.
  band: A group of customers with similar scores (High, Medium, Low) that share one suggested action.
  reason: A customer detail that raised or lowered that customer's score.
  pseudonymised: Customer IDs replaced by codes that only you can link back to real customers.

# Plain names of the metrics a report may quote, and what a random pick would score on each (null
# when there is no fixed random value). Only the model's primary metric is quoted, beside the
# simple yardstick model's value from baseline.json.
metrics:
  roc_auc: {name: "How well it ranks customers with the outcome above those without (1 is perfect)", random: 0.5}
  pr_auc: {name: "How precise its top of the list is, across all list lengths (1 is perfect)", random: null}
  f1: {name: "Balance between catching cases and avoiding false alarms (1 is perfect)", random: null}
  recall: {name: "Share of all cases it catches at the chosen cut-off", random: null}
  precision: {name: "Share of flagged customers who really have the outcome", random: null}
  rmse: {name: "Typical size of its error, in the outcome's own units (lower is better)", random: null}
  mae: {name: "Average size of its error, in the outcome's own units (lower is better)", random: null}
  auuc: {name: "How much better than a random pick it finds customers an offer changes (0 is no better)", random: 0.0}
