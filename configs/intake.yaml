# Intake (Plan L M150, DEC-1500): how Data Doctor reads a file before it has columns.
#
# Every rule here runs on every CSV upload, every Excel workbook and every CSV a connection imports,
# for training and scoring alike, so next month's file is read exactly as this month's was. A file
# that needs none of these rules is stored and read byte for byte as before. `docs/DATA_DOCTOR.md`
# explains each rule in plain words.
schema_version: 1

# Rows the header finder looks through for the column names. Rows above the names may hold at most
# two filled cells each (a title, a date line, "Branch: Pune"); otherwise the first row is the header.
max_header_search_rows: 30

# Trailing rows left out when they are a total ("Grand Total", "Sub-total: 1,234") or a one-cell note
# ("Generated by CRM on 3 Oct"). At most this many are ever left out.
max_footer_rows: 10

# The first cell of a total row, compared case-insensitively, ignoring a trailing ":" and a trailing
# "(...)". Only a whole cell matches: "Total Care" is a plan name, not a total.
total_words:
  - total
  - totals
  - grand total
  - sub total
  - sub-total
  - subtotal
  - net total
  - overall total

# Cells read as empty, compared trimmed and case-insensitively, but only in a column whose other values
# are numbers, dates or yes/no. In a text column they stay as written ("Unknown" can be a real answer).
# pandas already reads N/A, NA, NULL, None and #N/A as empty in every column; this list adds the rest.
missing_words:
  - "-"
  - "--"
  - "---"
  - "–"
  - "—"
  - "."
  - "?"
  - "na"
  - "n.a."
  - "n/a"
  - "none"
  - "null"
  - "nil"
  - "nan"
  - "unknown"
  - "not known"
  - "not available"
  - "not applicable"
  - "missing"
  - "blank"
  - "(blank)"
  - "#n/a"
  - "#div/0!"
  - "#value!"
  - "#ref!"
  - "#name?"
  - "#num!"
  - "#null!"

# Data rows the header finder and the missing-word rule look at to decide; the decision then applies
# to every row of the file.
sample_rows: 20000

# An .xlsx file is a zip archive. One whose contents would unpack to more than this is refused before it
# is opened, so a small file cannot unpack into gigabytes.
max_workbook_uncompressed_mb: 1024
# A workbook keeps every distinct text in one table that is read into memory whole (about ten times its
# size). A million different customer IDs take about 30 MB.
max_shared_strings_mb: 64
